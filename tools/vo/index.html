<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compass Offices — Price List Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ============ scoped: .vopl ============ */
.vopl{
  --co-orange:#FF6600;      --co-orange-dk:#E55A00;
  --co-orange-wash:#FFF3EB; --co-orange-tint:#FFD9BD;
  --co-ink:#1A1A1A;         --co-ink-deep:#161616;
  --co-text:#333333;        --co-text-2:#555555;
  --co-muted:#888888;       --co-faint:#BBBBBB;
  --co-line:#E5E5E5;        --co-line-soft:rgba(0,0,0,.08);
  --co-bg:#F5F5F5;          --co-fill:#EFEFEF;      --co-paper:#FFFFFF;
  --co-radius:10px;         --co-radius-pill:999px;
  color:var(--co-ink);
  font-family:'Hanken Grotesk','Noto Sans TC','Noto Sans SC','Noto Sans JP',sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background:var(--co-bg);
  margin:0; min-height:100vh;
}
.vopl *,.vopl *::before,.vopl *::after{box-sizing:border-box;}

/* ---- toolbar ---- */
.vopl-bar{position:sticky;top:0;z-index:50;background:var(--co-paper);border-bottom:1px solid var(--co-line);
  padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.vopl-bar-logo{height:26px;width:auto;display:block;}
.vopl-bar label{font-size:12px;font-weight:600;color:var(--co-text-2);margin-right:2px;}
.vopl-sel{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--co-line);border-radius:8px;
  background:var(--co-paper);color:var(--co-ink);cursor:pointer;}
.vopl-langs{display:flex;border:1px solid var(--co-line);border-radius:var(--co-radius-pill);overflow:hidden;}
.vopl-lang{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border:0;background:var(--co-paper);
  color:var(--co-text-2);cursor:pointer;}
.vopl-lang.on{background:var(--co-orange);color:#fff;}
.vopl-lang:disabled{opacity:.35;cursor:not-allowed;}
.vopl-chk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--co-text-2);cursor:pointer;}
.vopl-chk input{accent-color:#FF6600;cursor:pointer;}
.vopl-btn{font-family:inherit;font-size:13px;font-weight:600;padding:8px 16px;border-radius:var(--co-radius-pill);
  border:1px solid var(--co-line);background:var(--co-paper);color:var(--co-ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.vopl-btn:hover{border-color:var(--co-faint);}
.vopl-btn.primary{background:var(--co-orange);border-color:var(--co-orange);color:#fff;}
.vopl-btn.primary:hover{background:var(--co-orange-dk);border-color:var(--co-orange-dk);}
.vopl-btn:disabled{opacity:.45;cursor:not-allowed;}
.vopl-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.vopl-status{font-size:12px;color:var(--co-muted);margin-left:auto;max-width:340px;}
.vopl-status.err{color:#C0392B;}
.vopl-status.ok{color:#2E7D32;}
.vopl-file{display:none;}

/* ---- page stage ---- */
.vopl-stage{padding:28px 12px 60px;display:flex;flex-direction:column;align-items:center;gap:24px;}
.vopl-page{width:794px;height:1123px;background:var(--co-paper);position:relative;
  box-shadow:0 4px 24px rgba(0,0,0,.10);padding:46px 48px 64px;display:flex;flex-direction:column;overflow:hidden;}
.vopl-phead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;flex:0 0 auto;}
.vopl-phead-logo{width:140px;height:auto;display:block;margin-top:6px;}
.vopl-ptitle{text-align:right;}
.vopl-ptitle .t1{font-size:40px;font-weight:800;color:var(--co-orange);line-height:1.05;letter-spacing:.5px;}
.vopl-ptitle .t2{font-size:26px;font-weight:300;color:var(--co-ink);line-height:1.15;letter-spacing:.5px;}
.vopl-pbody{flex:1 1 auto;overflow:hidden;}
.vopl-pfoot{position:absolute;left:48px;right:48px;bottom:28px;display:flex;justify-content:space-between;
  font-size:10px;color:var(--co-muted);}
.vopl-pfoot span{margin-right:18px;}

/* ---- VO price table ---- */
.vopl-cols{display:grid;grid-template-columns:1fr 128px 128px 128px;}
.vopl-chead{padding:8px 6px 10px;text-align:center;font-weight:700;font-size:16px;color:var(--co-orange);}
.vopl-chead.lbl{text-align:left;}
.vopl-vline{border-left:1px solid var(--co-line);}
.vopl-city{grid-column:1 / -1;padding:10px 0 4px;font-size:17.5px;font-weight:800;color:var(--co-ink);
  letter-spacing:.4px;border-top:1px solid var(--co-ink);}
.vopl-dist{grid-column:1 / -1;padding:7px 0 3px;font-size:16px;font-weight:700;color:var(--co-ink);
  border-top:1px solid var(--co-faint);}
.vopl-dist.first,.vopl-city.first{border-top:1px solid var(--co-ink);}
.vopl-grp-l{padding:5px 8px 5px 0;border-top:1px dotted var(--co-line);}
.vopl-grp-l.nodot{border-top:0;}
.vopl-grp-l .lv,.vopl-grp-l .ad{font-size:13px;color:var(--co-text);line-height:1.45;}
.vopl-grp-l .bd{font-size:14.5px;font-weight:700;color:var(--co-orange);line-height:1.45;}
.vopl-price{display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:700;
  color:var(--co-ink);border-top:1px dotted var(--co-line);}
.vopl-price.nodot{border-top:0;}
.vopl-endline{grid-column:1 / -1;border-top:1px solid var(--co-ink);}

/* ---- VO features table ---- */
.vopl-fcat{grid-column:1 / -1;padding:16px 0 6px;font-size:15.5px;font-weight:700;color:var(--co-ink);border-top:1px solid var(--co-line);}
.vopl-fcat.first{border-top:1px solid var(--co-ink);padding-top:12px;}
.vopl-frow-l{padding:7px 10px 7px 0;font-size:14px;color:var(--co-text);border-top:1px dotted var(--co-line);line-height:1.5;}
.vopl-fval{display:flex;align-items:center;justify-content:center;font-size:14px;border-top:1px dotted var(--co-line);color:var(--co-ink);}
.vopl-fval .dot,.vopl-mx .dot{width:8px;height:8px;border-radius:50%;background:var(--co-orange);display:inline-block;}
.vopl-fval .dash{width:14px;height:2px;background:var(--co-ink);display:inline-block;}
.vopl-fval .txt{font-weight:700;font-size:13.5px;text-align:center;}
.vopl-fnotes{margin-top:26px;border-top:1px dotted var(--co-faint);padding-top:14px;}
.vopl-fnote{font-size:11px;color:var(--co-text);line-height:1.6;}
.vopl-fnote.b{font-weight:700;}
.vopl-fnote.i{padding-left:10px;}

/* ---- MR pricing ---- */
.vopl-mrsec{margin-bottom:8px;}
.vopl-mrtitle{font-size:17px;font-weight:700;color:var(--co-ink);padding:14px 0 6px;}
.vopl-mrt{display:grid;}
.vopl-mrt .h{padding:8px 6px;text-align:center;font-weight:700;font-size:15px;color:var(--co-orange);}
.vopl-mrt .h.lbl{text-align:left;color:var(--co-orange);font-size:15.5px;}
.vopl-mrt .bld{grid-column:1 / -1;padding:8px 0 2px;font-size:14.5px;font-weight:700;color:var(--co-orange);}
.vopl-mrt .rl{padding:8px 8px 8px 0;font-size:14px;color:var(--co-text);border-top:1px solid var(--co-line);}
.vopl-mrt .rv{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;
  color:var(--co-ink);border-top:1px solid var(--co-line);}
.vopl-mrt .bot{grid-column:1 / -1;border-top:1px solid var(--co-line);}
.vopl-vc{font-size:15px;font-weight:700;font-style:italic;color:var(--co-ink);padding:20px 0 4px;line-height:1.6;}
.vopl-mrbottom{display:flex;gap:16px;margin-top:26px;border-top:1px dotted var(--co-faint);padding-top:14px;align-items:flex-start;}
.vopl-tc{flex:2.3;min-width:0;padding-right:4px;}
.vopl-tc .tt{font-size:13px;font-weight:700;color:var(--co-ink);margin-bottom:5px;}
.vopl-tc .ln{font-size:11.5px;color:var(--co-text);line-height:1.7;}
.vopl-tc .ln.bl,.vopl-card .ln.bl{position:relative;padding-left:14px;}
.vopl-tc .ln.bl::before,.vopl-card .ln.bl::before{content:"\2022";position:absolute;left:1px;color:var(--co-ink);}
.vopl-card{flex:1;min-width:168px;border:1px solid var(--co-line);border-radius:8px;padding:12px 14px;background:var(--co-paper);}
.vopl-card .tt{font-size:13.5px;font-weight:700;color:var(--co-orange);margin-bottom:6px;line-height:1.35;}
.vopl-card .ln{font-size:12px;color:var(--co-text);line-height:1.75;}

/* ---- MR availability matrix ---- */
.vopl-mx .h{padding:8px 6px 10px;text-align:center;font-weight:700;font-size:14.5px;color:var(--co-orange);white-space:pre-line;}
.vopl-mx .h.lbl{text-align:left;}
.vopl-mx-dist{grid-column:1 / -1;padding:12px 0 2px;font-size:15.5px;font-weight:700;color:var(--co-muted);border-top:1px solid var(--co-line);}
.vopl-mx-dist.first{border-top:1px solid var(--co-ink);}
.vopl-mx .bname{padding:7px 8px 7px 0;font-size:14.5px;font-weight:700;color:var(--co-orange);}
.vopl-mx .bname.cont{border-top:0;}
.vopl-mx .lvl{padding:7px 8px;font-size:14px;font-weight:700;color:var(--co-ink);}
.vopl-mx .dcell{display:flex;align-items:center;justify-content:center;}
.vopl-mx .sep{grid-column:1 / -1;border-top:1px solid var(--co-line);margin:5px 0 4px;}

.vopl-empty{padding:60px 20px;text-align:center;color:var(--co-muted);font-size:14px;}

/* ---- IT & Telecommunications ---- */
.it-wifi{display:flex;border-top:2px solid var(--co-line);border-bottom:2px solid var(--co-line);margin-bottom:18px;}
.it-sechead{display:flex;align-items:stretch;background:#F7F7F7;border-top:2px solid var(--co-line);margin-top:6px;}
.it-sechead .tt{flex:1;font-size:21px;font-weight:800;color:var(--co-ink);padding:12px 14px;line-height:1.25;}
.it-sechead .pu{flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--co-ink);padding:0 8px;}
.it-tiers{display:flex;border-bottom:1px solid var(--co-line);}
.it-tiers .sp{flex:1;}
.it-tier{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 6px 8px;gap:2px;}
.it-tier .k{font-size:14px;font-weight:800;padding:0 14px 2px;border-bottom:3px solid var(--co-faint);}
.it-tier.a .k{color:#4A78C2;border-color:#4A78C2;}
.it-tier.b .k{color:#57A05A;border-color:#57A05A;}
.it-tier.c .k{color:#E8A33D;border-color:#E8A33D;}
.it-tier.a{background:#F5F8FC;}
.it-tier.b{background:#F4FAF5;}
.it-tier.c{background:#FEF8F0;}
.it-pc.ta{background:#F5F8FC;}
.it-pc.tb{background:#F4FAF5;}
.it-pc.tc{background:#FEF8F0;}
.it-tier .l{font-size:9.5px;font-weight:700;color:var(--co-ink);text-align:center;line-height:1.3;}
.it-grp{display:flex;border-top:1px solid var(--co-line);}
.it-grp.first{border-top:0;}
.it-gl{flex:0 0 150px;font-size:13.5px;font-weight:700;color:var(--co-ink);padding:10px 10px 10px 2px;line-height:1.35;}
.it-gb{flex:1;min-width:0;padding:5px 0;}
.it-gb .bl{font-size:10.8px;color:var(--co-text);line-height:1.45;padding:3.5px 8px 3.5px 0;display:flex;gap:6px;}
.it-gb .bl::before{content:"\2022";flex:0 0 auto;}
.it-gb .bl.noprice{}
.it-gb .bl .bp{margin-left:auto;flex:0 0 auto;font-weight:700;color:var(--co-orange);padding-left:10px;}
.it-gb .bl .bp.inc{color:var(--co-ink);}
.it-pc{flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--co-orange);text-align:center;padding:6px;line-height:1.35;border-left:1px solid var(--co-line);}
.it-pc.plain{color:var(--co-ink);}
.it-opt{display:flex;background:#F5F5F5;border-top:1px solid var(--co-line);}
.it-opt .ol{flex:1;font-size:10.8px;color:var(--co-text);padding:5px 8px 5px 152px;}
.it-opt .op{flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--co-orange);padding:5px 6px;}
.it-close{border-bottom:2px solid var(--co-line);margin-bottom:14px;}
/* ---- Included / Additional sections ---- */
.sk-sec{margin-bottom:20px;}
.sk-sec .tt{font-size:19px;font-weight:700;color:var(--co-orange);margin-bottom:8px;}
.sk-flex{display:flex;gap:16px;align-items:flex-start;}
.sk-imgs{display:flex;gap:8px;flex:0 0 auto;}
.sk-img{width:138px;height:96px;border-radius:6px;object-fit:cover;background:var(--co-bg);display:block;}
.sk-img.ph{display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--co-faint);}
.sk-bullets{flex:1;min-width:0;}
.sk-b{display:flex;gap:10px;padding:6px 0;border-bottom:1px dotted var(--co-line);font-size:14px;color:var(--co-text);line-height:1.5;align-items:baseline;}
.sk-b .tx{flex:1;min-width:0;}
.sk-b:last-child{border-bottom:0;}
.sk-b::before{content:"\2022";color:var(--co-ink);flex:0 0 auto;}
.sk-b .note{flex:0 0 172px;font-weight:700;color:var(--co-orange);font-size:14px;text-align:right;padding-left:12px;}
.sk-catnote{flex:0 0 168px;text-align:right;font-weight:700;color:var(--co-orange);font-size:14.5px;padding-top:2px;}

/* ---- Locations: transit composition (MTR / JR) ---- */
.sk-tcanvas{position:relative;width:698px;height:915px;}
.sk-tcanvas > svg{position:absolute;inset:0;width:698px;height:915px;}
.sk-block{position:absolute;}
.sk-block .sk-loc .b{font-size:13.5px;}
.sk-block .sk-loc .l{font-size:11.5px;}
.sk-block .sk-loc .a{font-size:11px;}
.sk-block .dn{font-size:23px;font-weight:800;color:var(--co-ink);margin-bottom:9px;letter-spacing:.2px;}
.sk-loc{margin-bottom:13px;}
.sk-loc .b{font-size:14.5px;font-weight:700;color:var(--co-orange);line-height:1.3;}
.sk-loc .l{font-size:12.5px;font-weight:700;color:var(--co-orange);margin-top:1px;}
.sk-loc .a{font-size:12px;color:var(--co-muted);line-height:1.4;margin-top:1px;}
/* ---- Locations: geo (map-image) style ---- */
.sk-cityhead{font-size:24px;font-weight:700;color:var(--co-muted);border-bottom:1px solid var(--co-line);padding-bottom:5px;margin:6px 0 12px;}
.sk-geobox{position:relative;width:698px;height:428px;margin-bottom:6px;border-radius:16px;overflow:hidden;}
.sk-geobox.auto{height:476px;}
.sk-geobox .bg.auto{position:absolute;top:0;left:0;width:100%;height:auto;}
.sk-mapcredit{font-size:8.5px;color:var(--co-faint);text-align:right;margin:0 4px 14px 0;}
.sk-geobox .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.sk-geobox .bg.ph{background:var(--co-bg);display:flex;align-items:center;justify-content:center;color:var(--co-faint);font-size:11px;}
.sk-geobox .ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.sk-card{position:absolute;width:44%;background:rgba(255,255,255,.9);border-radius:8px;padding:9px 13px 5px;}
.sk-card .dn{font-size:20px;font-weight:800;color:var(--co-ink);margin-bottom:4px;}
.sk-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 20px;margin-bottom:14px;}
.sk-dist{break-inside:avoid;padding-top:10px;}
.sk-dist .dn{font-size:20px;font-weight:800;color:var(--co-ink);margin-bottom:7px;}

/* ---- Global Network ---- */
.sk-net{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;}
.sk-net-sec{break-inside:avoid;margin-bottom:14px;}
.sk-net-h{font-size:18px;font-weight:800;color:var(--co-ink);background:var(--co-bg);padding:6px 12px;margin-bottom:8px;}
.sk-net-h.hl{color:var(--co-orange);background:var(--co-orange-wash);}
.sk-net-city{font-size:14.5px;font-weight:700;color:var(--co-ink);margin:8px 0 3px;}
.sk-net-line{font-size:12.5px;color:var(--co-text);padding:4px 0;border-bottom:1px dotted var(--co-line);line-height:1.45;}
.sk-net-blurb{font-size:13px;color:var(--co-text);margin:6px 0 8px;line-height:1.5;}
.sk-net-hq .b{font-size:14.5px;font-weight:700;color:var(--co-ink);}
.sk-net-hq .a{font-size:12.5px;color:var(--co-muted);}
.sk-net-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--co-ink);}
.sk-net-grid .gh{font-size:13.5px;font-weight:800;padding:6px 4px 3px;border-bottom:1px solid var(--co-line);}
.sk-net-grid .gi{font-size:12.5px;color:var(--co-text);padding:3px 4px;border-bottom:1px dotted var(--co-line);}
/* compact levels — used automatically so the network fits one page */
.sk-net.c1{gap:0 20px;}
.sk-net.c1 .sk-net-sec{margin-bottom:10px;}
.sk-net.c1 .sk-net-h{font-size:15px;padding:4px 10px;margin-bottom:6px;}
.sk-net.c1 .sk-net-city{font-size:12.5px;margin:6px 0 2px;}
.sk-net.c1 .sk-net-line{font-size:11px;padding:2.5px 0;line-height:1.35;}
.sk-net.c1 .sk-net-blurb{font-size:11px;margin:4px 0 6px;line-height:1.4;}
.sk-net.c1 .sk-net-hq .b{font-size:12.5px;} .sk-net.c1 .sk-net-hq .a{font-size:11px;}
.sk-net.c1 .sk-net-grid .gh{font-size:11.5px;padding:4px 3px 2px;}
.sk-net.c1 .sk-net-grid .gi{font-size:11px;padding:2px 3px;}
.sk-net.c2{gap:0 16px;}
.sk-net.c2 .sk-net-sec{margin-bottom:8px;}
.sk-net.c2 .sk-net-h{font-size:13px;padding:3px 9px;margin-bottom:5px;}
.sk-net.c2 .sk-net-city{font-size:11px;margin:5px 0 1px;}
.sk-net.c2 .sk-net-line{font-size:9.8px;padding:2px 0;line-height:1.3;}
.sk-net.c2 .sk-net-blurb{font-size:10px;margin:3px 0 5px;line-height:1.35;}
.sk-net.c2 .sk-net-hq .b{font-size:11px;} .sk-net.c2 .sk-net-hq .a{font-size:9.8px;}
.sk-net.c2 .sk-net-grid .gh{font-size:10.2px;padding:3px 3px 2px;}
.sk-net.c2 .sk-net-grid .gi{font-size:9.8px;padding:1.5px 3px;}

/* ---- Service Price Guide ---- */
.sp-t{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:2px;}
.sp-t col.c1{width:186px;} .sp-t col.c2{width:246px;}
.sp-t td{border:1px solid #E9E9E9;padding:4px 10px;font-size:11px;color:var(--co-text);vertical-align:middle;line-height:1.4;}
.sp-t tr.sec td{background:var(--co-orange-wash);border-color:#F3DCCB;color:var(--co-orange);font-weight:800;font-size:13px;padding:6px 10px;}
.sp-t tr.sec td.rm{background:#fff;border-color:#E9E9E9;color:var(--co-text);font-weight:400;font-size:10.5px;padding:7px 12px;}
.sp-t tr.sec td.mk{text-align:center;}
.sp-t td.d{font-weight:700;color:var(--co-ink);}
.sp-t td.d.sub{font-weight:600;font-style:italic;padding-left:22px;color:var(--co-text);}
.sp-t td.d.g{font-weight:800;color:var(--co-ink);border-right-color:transparent;}
.sp-t td.p{text-align:center;font-weight:700;}
.sp-t td.p .v{color:var(--co-orange);}
.sp-t td.p .v.plain{color:var(--co-ink);}
.sp-t td.p .dual{display:flex;flex-direction:column;}
.sp-t td.p .dual span{padding:2px 0;}
.sp-t td.p .dual span + span{border-top:1px solid #EFEFEF;}
.sp-t td.p .split{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.sp-t td.p .split .sh{font-size:10px;font-weight:800;color:var(--co-ink);border-bottom:1px solid #EFEFEF;padding:2px 0 3px;}
.sp-t td.p .split .sv{padding-top:4px;}
.sp-t td.p .split > *:nth-child(odd){border-right:1px solid #EFEFEF;}
.sp-t td.rm{font-size:10.5px;color:var(--co-text);vertical-align:middle;}
.sp-t td.rm .b2{position:relative;padding-left:11px;margin:2px 0;}
.sp-t td.rm .b2::before{content:"\2022";position:absolute;left:0;}
.sp-colhead{display:grid;grid-template-columns:186px 246px 1fr;background:#F2F2F2;border:1px solid #E5E5E5;margin-bottom:4px;}
.sp-colhead div{padding:7px 10px;font-size:12px;color:var(--co-text-2);text-align:center;}
.sp-colhead div:first-child{text-align:left;}
.sp-foot{font-size:9.5px;font-weight:700;color:var(--co-ink);line-height:1.6;padding:1px 2px;}
.sp-gap{height:10px;}
.vopl-ptitle.sp .t1{font-size:34px;}
.vopl-ptitle.sp .t2{font-size:17px;font-weight:700;line-height:1.3;margin-top:2px;}
.vopl-ptitle.sp .t2 .mk{color:var(--co-muted);font-weight:600;margin-left:10px;}

/* ---- inline editing ---- */
.vopl-btn.on{background:var(--co-ink);border-color:var(--co-ink);color:#fff;}
.ved{outline:none;border-radius:3px;}
body.editing .ved{box-shadow:inset 0 -1.5px 0 0 var(--co-orange-tint);cursor:text;min-width:14px;display:inline-block;}
body.editing .ved:hover{background:#FFF3E8;}
.ved:focus{background:#FFF3E8;box-shadow:0 0 0 2px #FF660055;}
.vopl-editbar{position:fixed;left:50%;transform:translateX(-50%);bottom:-70px;z-index:60;background:var(--co-ink);color:#fff;
  border-radius:999px;padding:10px 12px 10px 20px;display:flex;align-items:center;gap:14px;font-size:13px;
  box-shadow:0 8px 26px rgba(0,0,0,.25);transition:bottom .2s ease;}
.vopl-editbar.show{bottom:24px;}
@media (max-width:840px){.vopl-page{transform:scale(.44);transform-origin:top center;margin-bottom:-600px;}}
</style>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTBXPlBtYsiD_0oEThJ_pJzQOmeYNNWFezpC1z6ZIiA-p8VyqDqpdZExkG-51Lqxtf/exec";
var WEBSITE = "www.compassoffices.com";
var LANG_LABELS = { EN:"EN", TC:"\u7E41", SC:"\u7C21", JP:"\u65E5", VI:"VI" };
var LANG_KEYS = { EN:"en", TC:"tc", SC:"sc", JP:"jp", VI:"vi" };
var VO_HEADS_EN = ["Gold","Platinum","Diamond"];
function voHeads(){
  return [TXT("vo.head.gold") || "Gold",
          TXT("vo.head.platinum") || "Platinum",
          TXT("vo.head.diamond") || "Diamond"];
}

/* =====================================================================
   STATE
   ===================================================================== */
var DB = null;            // { config, centres, voPrices, voFeatures, mrPrices, mrTiers, mrMatrix, text }
var curMarket = "Hong Kong";
var curLang = "EN";
var EDIT = false;         // inline edit mode
var dirty = {};           // "kind|key1|…|field" -> value (same format as the editor)

/* =====================================================================
   BOOT
   ===================================================================== */
var mktSel = document.getElementById("mkt");
mktSel.addEventListener("change", function(){ curMarket = mktSel.value; render(); });
var langsEl = document.getElementById("langs");
Object.keys(LANG_LABELS).forEach(function(k){
  var b = document.createElement("button");
  b.className = "vopl-lang"; b.textContent = LANG_LABELS[k]; b.dataset.lang = k;
  b.addEventListener("click", function(){ curLang = k; render(); });
  langsEl.appendChild(b);
});
function post(payload){
  return fetch(SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) throw new Error(j.error || "backend error"); return j; });
}
document.getElementById("btnRefresh").addEventListener("click", function(){
  if (Object.keys(dirty).length && !confirm("Discard unsaved inline edits and refresh?")) return;
  dirty = {}; syncEditbar(); fetchData();
});
document.getElementById("btnLoad").addEventListener("click", function(){ document.getElementById("fileIn").click(); });
document.getElementById("fileIn").addEventListener("change", loadXlsx);
document.getElementById("btnPdf").addEventListener("click", function(){ exportPdf(false); });
document.getElementById("btnDrive").addEventListener("click", function(){ exportPdf(true); });
document.getElementById("secVO").addEventListener("change", render);
document.getElementById("secMR").addEventListener("change", render);
document.getElementById("secIT").addEventListener("change", render);
document.getElementById("secSP").addEventListener("change", render);
document.getElementById("secSK").addEventListener("change", render);

function setStatus(msg, cls){
  var el = document.getElementById("status");
  el.textContent = msg; el.className = "vopl-status" + (cls ? " " + cls : "");
}
if (SCRIPT_URL) fetchData();
else setStatus("Set SCRIPT_URL, or Load XLSX (the structured workbook) to test offline.");

/* =====================================================================
   DATA LOADING — structured workbook
   ===================================================================== */
function rowsToObjects(rows){
  if (!rows || !rows.length) return [];
  var head = rows[0].map(function(h){ return String(h || "").trim().toLowerCase().replace(/\s+/g, "_"); });
  var out = [];
  for (var r = 1; r < rows.length; r++){
    var o = {}, any = false;
    for (var c = 0; c < head.length; c++){
      var v = rows[r] ? rows[r][c] : null;
      if (v === undefined || v === null) v = "";
      if (typeof v === "string") v = v.trim();
      o[head[c]] = v;
      if (v !== "") any = true;
    }
    if (any) out.push(o);
  }
  return out;
}

function ingest(tabs){
  function need(name){
    if (!tabs[name]) throw new Error("Tab '" + name + "' not found — is this the structured workbook?");
    return rowsToObjects(tabs[name]);
  }
  DB = {
    config:     need("Config"),
    centres:    need("Centres"),
    voPrices:   need("VO-Prices"),
    voFeatures: need("VO-Features"),
    mrPrices:   need("MR-Prices"),
    mrTiers:    need("MR-Tiers"),
    mrMatrix:   need("MR-Matrix"),
    text:       need("Text"),
    itPackages: tabs["IT-Packages"] ? rowsToObjects(tabs["IT-Packages"]) : [],
    spServices: tabs["SP-Services"] ? rowsToObjects(tabs["SP-Services"]) : [],
    skIncluded:  rowsToObjects(tabs["SK-Included"] || []),
    skAdditional:rowsToObjects(tabs["SK-Additional"] || []),
    skAddPrices: rowsToObjects(tabs["SK-AddPrices"] || []),
    skMapNodes:  rowsToObjects(tabs["SK-MapNodes"] || []),
    skAssets:    rowsToObjects(tabs["SK-Assets"] || []),
    skText:      rowsToObjects(tabs["SK-Text"] || []),
    skMapPins:   rowsToObjects(tabs["SK-MapPins"] || [])
  };
  mktSel.innerHTML = "";
  DB.config.forEach(function(c){
    var o = document.createElement("option"); o.value = c.market; o.textContent = c.market; mktSel.appendChild(o);
  });
  if (!DB.config.some(function(c){ return c.market === curMarket; }) && DB.config.length) curMarket = DB.config[0].market;
  mktSel.value = curMarket;
}

function fetchData(){
  if (!SCRIPT_URL){ setStatus("SCRIPT_URL is not set.", "err"); return; }
  setStatus("Fetching from Google Sheets\u2026");
  fetch(SCRIPT_URL + (SCRIPT_URL.indexOf("?") > -1 ? "&" : "?") + "action=data")
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j.ok) throw new Error(j.error || "backend error");
      ingest(j.tabs);
      setStatus("Loaded \u00B7 " + new Date().toLocaleTimeString(), "ok");
      render();
    })
    .catch(function(err){ setStatus("Fetch failed: " + err.message, "err"); });
}

function loadXlsx(ev){
  var f = (ev.target.files || [])[0];
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function(e){
    try{
      var wb = XLSX.read(new Uint8Array(e.target.result), { type:"array" });
      var tabs = {};
      wb.SheetNames.forEach(function(n){
        tabs[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:null });
      });
      ingest(tabs);
      setStatus("Loaded " + f.name, "ok");
      render();
    }catch(err){ setStatus("Load failed: " + err.message, "err"); }
  };
  rd.readAsArrayBuffer(f);
  ev.target.value = "";
}

/* =====================================================================
   LOOKUPS (all language access falls back to English)
   ===================================================================== */
function L(row, field){
  var v = row[field + "_" + LANG_KEYS[curLang]];
  if (v === undefined || v === "") v = row[field + "_en"];
  return v === undefined ? "" : String(v);
}
function conf(){ return DB.config.filter(function(c){ return c.market === curMarket; })[0] || {}; }
function TXT(key, centreId){
  var rows = DB.text.filter(function(t){
    return t.key === key && (t.market === curMarket || t.market === "all") &&
           (centreId ? t.centre_id === centreId : true);
  });
  rows.sort(function(a, b){ return (a.market === "all" ? 1 : 0) - (b.market === "all" ? 1 : 0); });
  if (!rows.length) return "";
  var r = rows[0];

}
function txtSeries(prefix){
  /* Language rule: if this language has its OWN translated lines in the series,
     blank lines are simply left out (empty = not shown). English is used as a
     whole-list fallback only when the language has no translations at all.
     A cell containing just "-" is always skipped. */
  var f = "text_" + LANG_KEYS[curLang];
  function skipVal(v){ return v === "" || v === "-" || v === "\u2013" || v === "\u2014"; }
  var entries = [];
  for (var i = 1; i <= 40; i++){
    var key = prefix + "." + i;
    var r = txRowFor(key);
    if (!r) break;
    entries.push({ key: key, r: r });
  }
  var hasOwn = LANG_KEYS[curLang] !== "en" && entries.some(function(e){
    var v = String(e.r[f] === undefined ? "" : e.r[f]).trim();
    return !skipVal(v);
  });
  var out = [];
  entries.forEach(function(e){
    var v = String(e.r[f] === undefined ? "" : e.r[f]).trim();
    var en = String(e.r.text_en === undefined ? "" : e.r.text_en).trim();
    var use = v !== "" ? v : (hasOwn ? "" : en);
    if (skipVal(use)) return;
    out.push({ key: e.key, v: use });
  });
  return out;
}
/* ---- inline editing helpers ---- */
function edSpan(kind, keys, field, raw, dispHtml){
  if (!EDIT) return dispHtml;
  var k = [kind].concat(keys).concat([field]).join("|");
  var v = dirty[k] !== undefined ? dirty[k] : (raw === undefined || raw === null ? "" : String(raw));
  return '<span class="ved" contenteditable data-ed="' + esc(k) + '">' + esc(v) + '</span>';
}
function txRowFor(key){
  var rows = DB.text.filter(function(t){
    return t.key === key && (t.market === curMarket || t.market === "all");
  });
  rows.sort(function(a, b){ return (a.market === "all" ? 1 : 0) - (b.market === "all" ? 1 : 0); });
  return rows[0] || null;
}
function txEd(key, dispHtml){
  if (!EDIT) return dispHtml;
  var r = txRowFor(key);
  var f = "text_" + LANG_KEYS[curLang];
  var m = r ? r.market : curMarket;                    /* no row yet -> created for this market on save */
  var c = r ? String(r.centre_id || "") : "";
  var raw = r ? (r[f] !== undefined && r[f] !== "" ? r[f] : (r.text_en || "")) : "";
  var k = ["tx", m, c, key, f].join("|");
  if (dirty[k] !== undefined) raw = dirty[k];
  return '<span class="ved" contenteditable data-ed="' + esc(k) + '">' + esc(raw) + '</span>';
}
function tiersFor(kind){
  var row = DB.mrTiers.filter(function(t){ return t.market === curMarket && t.kind === kind; })[0];
  if (!row) return [];
  var out = [];
  for (var i = 1; i <= 6; i++){
    var en = row["t" + i];
    if (en === undefined || en === "") break;
    var loc = row["t" + i + "_" + LANG_KEYS[curLang]];
    out.push({ en:String(en), label:(loc === undefined || loc === "") ? String(en) : String(loc) });
  }

}

function fmtPrice(v, prefix){
  if (v === null || v === undefined || v === "") return "";
  var num = (typeof v === "number") ? v : parseFloat(String(v).replace(/[^\d.]/g, ""));

function lnHtml(entry){

  var t = String(entry.v).replace(/^\s*[\u2022\u25AA\u00B7]\s*/, "");

function paginateItems(stage, titles, items, makeContainer){
  var page = newPage(titles);
  stage.appendChild(page);
  var body = page.querySelector(".vopl-pbody");
  var box = makeContainer();
  body.appendChild(box);
  function overflowed(){ return body.scrollHeight > body.clientHeight + 1; }
  items.forEach(function(it){
    var frag = document.createElement("template");
    frag.innerHTML = it.html;
    var nodes = Array.prototype.slice.call(frag.content.childNodes);
    nodes.forEach(function(nd){ box.appendChild(nd); });
    if (overflowed()){
      nodes.forEach(function(nd){ box.removeChild(nd); });
      var carry = [];
      while (box.lastElementChild && box.lastElementChild.dataset && box.lastElementChild.dataset.hdr === "1"){
        carry.unshift(box.lastElementChild);
        box.removeChild(box.lastElementChild);
      }
      page = newPage(titles);
      stage.appendChild(page);
      body = page.querySelector(".vopl-pbody");
      box = makeContainer();
      body.appendChild(box);
      carry.forEach(function(nd){ nd.classList.add("first"); box.appendChild(nd); });
      var frag2 = document.createElement("template");
      frag2.innerHTML = it.html;
      Array.prototype.slice.call(frag2.content.childNodes).forEach(function(nd){ box.appendChild(nd); });
    }
  });
  return box;
}

function render(){
  langsEl.querySelectorAll(".vopl-lang").forEach(function(b){
    b.classList.toggle("on", b.dataset.lang === curLang);
    b.disabled = false;   // every language renders; blanks fall back to English
  });
  var stage = document.getElementById("stage");
  stage.innerHTML = "";
  if (!DB){ stage.innerHTML = '<div class="vopl-empty">No data loaded.</div>'; return; }
  var did = false;
  if (document.getElementById("secVO").checked){ did = renderVO(stage) || did; }
  if (document.getElementById("secMR").checked){ did = renderMR(stage) || did; }
  if (document.getElementById("secIT").checked){ did = renderIT(stage) || did; }
  if (document.getElementById("secSP").checked){ did = renderSP(stage) || did; }
  if (document.getElementById("secSK").checked){ did = renderSK(stage) || did; }
  if (!did) stage.innerHTML = '<div class="vopl-empty">Nothing to show for this market \u2014 tick a section or add data.</div>';
}

/* ---------- Virtual Office ---------- */
function renderVO(stage){
  var c = conf(), titles = titlePair("vo");
  var priced = {};
  DB.voPrices.forEach(function(p){
    if (p.gold !== "" || p.platinum !== "" || p.diamond !== "") priced[p.centre_id] = p;
  });
  var list = [], prevCity = null, prevDist = null, prevType = "head", first = true;
  marketCentres().forEach(function(ct){
    var p = priced[ct.id];
    if (!p) return;    // no prices yet -> not on the VO page
    var dist = L(ct, "district"), city = "", d = dist;
    if (dist.indexOf(" \u2014 ") > -1){ var sp = dist.split(" \u2014 "); city = sp[0]; d = sp.slice(1).join(" \u2014 "); }
    if (city && city !== prevCity){
      list.push({ html:'<div class="vopl-city' + (first ? " first" : "") + '" data-hdr="1">' + esc(city) + '</div>' });
      first = false; prevCity = city; prevDist = null; prevType = "head";
    }
    if (d && d !== prevDist){
      list.push({ html:'<div class="vopl-dist' + (first ? " first" : "") + '" data-hdr="1">' + esc(d) + '</div>' });
      first = false; prevDist = d; prevType = "head";
    }
    var nodot = (prevType !== "grp") ? " nodot" : "";
    var lang = LANG_KEYS[curLang];
    var lv = levelText(ct.levels), bld = L(ct, "building"), adr = L(ct, "address");
    var bldH = edSpan("ct", [ct.id], "building_" + lang, ct["building_" + lang] || ct.building_en, esc(bld));
    var lvH  = edSpan("ct", [ct.id], "levels", ct.levels, esc(lv));
    var adrH = edSpan("ct", [ct.id], "address_" + lang, ct["address_" + lang] || ct.address_en, esc(adr));
    var h = '<div class="vopl-grp-l' + nodot + '">';
    if ((c.vo_order || "") === "building-first"){
      h += '<div class="bd">' + bldH + '</div><div class="lv">' + lvH + '</div>';
    } else {
      h += '<div class="lv">' + lvH + '</div><div class="bd">' + bldH + '</div>';
    }
    h += '<div class="ad">' + adrH + '</div></div>';
    ["gold","platinum","diamond"].forEach(function(f){
      h += '<div class="vopl-price vopl-vline' + nodot + '">' +
        edSpan("vo", [p.centre_id], f, p[f], esc(fmtPrice(p[f], c.currency))) + '</div>';
    });
    list.push({ html:h });
    prevType = "grp";
  });
  if (!list.length) return false;

  var headHtml = '<div class="vopl-chead lbl" data-hdr="1"></div>' +
    [["vo.head.gold","Gold"],["vo.head.platinum","Platinum"],["vo.head.diamond","Diamond"]].map(function(hd){
      return '<div class="vopl-chead vopl-vline" data-hdr="1">' + txEd(hd[0], esc(TXT(hd[0]) || hd[1])) + '</div>';
    }).join("");
  var box = paginateItems(stage, titles, list, function(){
    var g = document.createElement("div"); g.className = "vopl-cols"; g.innerHTML = headHtml; return g;
  });
  box.insertAdjacentHTML("beforeend", '<div class="vopl-endline"></div>');

  /* features page */
  var setName = c.features_set || "default";
  var feats = DB.voFeatures.filter(function(f){ return f.set === setName; });
  if (feats.length){
    var fp = newPage(titles);
    stage.appendChild(fp);
    var fg = document.createElement("div");
    fg.className = "vopl-cols";
    var fh = '<div class="vopl-chead lbl"></div>' + voHeads().map(function(h){
      return '<div class="vopl-chead vopl-vline">' + esc(h) + '</div>'; }).join("");
    var firstCat = true, notes = [];
    feats.forEach(function(x){
      var label = L(x, "label");
      if (x.row_type === "footnote"){ notes.push(label); return; }
      if (x.row_type === "category"){
        fh += '<div class="vopl-fcat' + (firstCat ? " first" : "") + '">' + esc(label) + '</div>';
        firstCat = false; return;
      }
      fh += '<div class="vopl-frow-l">' + esc(label) + '</div>';
      [x.gold, x.platinum, x.diamond].forEach(function(v){
        var vv = String(v === undefined ? "" : v).trim(), inner;
        if (vv === "\u2022") inner = '<span class="dot"></span>';
        else if (vv === "\u2014" || vv === "-" || vv === "\u2013") inner = '<span class="dash"></span>';
        else if (vv === "") inner = "";
        else inner = '<span class="txt">' + esc(vv) + '</span>';
        fh += '<div class="vopl-fval vopl-vline">' + inner + '</div>';
      });
    });
    fh += '<div class="vopl-endline"></div>';
    fg.innerHTML = fh;
    fp.querySelector(".vopl-pbody").appendChild(fg);
    if (notes.length){
      var nt = document.createElement("div");
      nt.className = "vopl-fnotes";
      nt.innerHTML = notes.map(function(x, idx){
        var bold = /^\*/.test(x) || /[:\uFF1A]\s*$/.test(x) || idx === notes.length - 1;
        return '<div class="vopl-fnote ' + (bold ? "b" : "i") + '">' + esc(x) + '</div>';
      }).join("");
      fp.querySelector(".vopl-pbody").appendChild(nt);
    }
  }
  return true;
}

/* ---------- Meeting Room ---------- */
function renderMR(stage){
  var c = conf(), titles = titlePair("mr");
  var rows = DB.mrPrices.filter(function(p){ return p.market === curMarket; });
  var pricingTiers = tiersFor("pricing");
  var list = [];

  ["Internal","External"].forEach(function(client){
    var mine = rows.filter(function(p){ return p.client === client; });
    if (!mine.length) return;
    var titleKey = client === "Internal" ? "mr.internal.title" : "mr.external.title";
    var title = TXT(titleKey);
    var tiers = pricingTiers.length ? pricingTiers : [];
    if (!tiers.length){
      var seen = {}, t = [];
      mine.forEach(function(p){ if (!seen[p.tier_en]){ seen[p.tier_en] = 1; t.push({ en:p.tier_en, label:p.tier_en }); } });
      tiers = t;
    }
    var w = tiers.length <= 3 ? 118 : 74;
    var grid = 'style="grid-template-columns:1fr repeat(' + tiers.length + ',' + w + 'px)"';
    var scopes = [];
    mine.forEach(function(p){ if (scopes.indexOf(p.scope) < 0) scopes.push(p.scope); });
    var h = '<div class="vopl-mrtitle" data-hdr="1">' + txEd(titleKey, esc(title)) + '</div>';
    h += '<div class="vopl-mrt" ' + grid + '>';
    var lblCell = (scopes.length === 1 && scopes[0] === "all" && client === "Internal") ? TXT("mr.allcentres") : "";
    h += '<div class="h lbl">' + esc(lblCell) + '</div>';
    tiers.forEach(function(t){ h += '<div class="h vopl-vline">' + esc(t.label) + '</div>'; });
    scopes.forEach(function(scope){
      if (scope !== "all"){
        var ct = centre(scope);
        h += '<div class="bld">' + esc(ct ? L(ct, "building") : scope) + '</div>';
      }
      var srows = mine.filter(function(p){ return p.scope === scope; });
      [["per_30_mins", client === "External" && TXT("mr.per30.ext") ? "mr.per30.ext" : "mr.per30"],
       ["per_day", "mr.perday"]].forEach(function(pair){
        var field = pair[0], key = pair[1];
        var vals = tiers.map(function(t){
          var pr = srows.filter(function(p){ return p.tier_en === t.en; })[0];
          return { pr: pr, v: pr ? pr[field] : "" };
        });
        if (!vals.some(function(x){ return x.v !== ""; })) return;
        h += '<div class="rl">' + txEd(key, esc(TXT(key))) + '</div>';
        vals.forEach(function(x){
          var disp = esc(fmtPrice(x.v, c.currency));
          h += '<div class="rv vopl-vline">' +
            (x.pr ? edSpan("mr", [x.pr.market, x.pr.scope, x.pr.client, x.pr.tier_en], field, x.v, disp) : disp) +
            '</div>';
        });
      });
    });
    h += '<div class="bot"></div></div>';
    list.push({ html:'<div class="vopl-mrsec">' + h + '</div>' });
  });
  if (!list.length) return false;

  /* video conferencing lines */
  for (var i = 1; i <= 10; i++){

    vcRows.forEach(function(r){

      list.push({ html:'<div class="vopl-vc">' + esc(pre + v) + '</div>' });
    });
  }

  /* T&C + cards */
  var tcT = TXT("tc.title"), tcL = txtSeries("tc");
  var inT = TXT("incl.title"), inL = txtSeries("incl");
  var avT = TXT("avail.title"), avL = txtSeries("avail");
  if (tcL.length || inL.length || avL.length){
    var b = '<div class="vopl-mrbottom">';
    if (tcL.length) b += '<div class="vopl-tc"><div class="tt">' + txEd("tc.title", esc(tcT)) + '</div>' +
      tcL.map(lnHtml).join("") + '</div>';
    [["incl.title", inT, inL], ["avail.title", avT, avL]].forEach(function(card){
      if (!card[2].length) return;
      b += '<div class="vopl-card"><div class="tt">' + txEd(card[0], esc(card[1])) + '</div>' +
        card[2].map(lnHtml).join("") + '</div>';
    });
    b += '</div>';
    list.push({ html:b });
  }
  paginateItems(stage, titles, list, function(){ var d = document.createElement("div"); return d; });

  /* availability matrix */
  var mxTiers = tiersFor("matrix");
  if (!mxTiers.length) return true;
  var byCentre = {};
  DB.mrMatrix.forEach(function(m){
    var ticks = [];
    for (var k = 1; k <= mxTiers.length; k++) ticks.push(String(m["t" + k] || "").indexOf("\u2713") > -1);
    if (!ticks.some(function(x){ return x; })) return;   // pending rows (no ticks yet) are hidden
    (byCentre[m.centre_id] = byCentre[m.centre_id] || []).push({ level:m.level, ticks:ticks });
  });
  var mlist = [], prevDist = null, firstDist = true, lastWasRow = false, any = false;
  marketCentres().forEach(function(ct){
    var lv = byCentre[ct.id];
    if (!lv) return;
    any = true;
    var dist = L(ct, "district").split(" \u2014 ").pop();

      mlist.push({ html:'<div class="vopl-mx-dist' + (firstDist ? " first" : "") + '" data-hdr="1">' + esc(dist) + '</div>' });
      firstDist = false; prevDist = dist; lastWasRow = false;

    var fmt = TXT("level.format") || "Floor {n}";
    lv.forEach(function(row, li){
      var h = "";
      if (li === 0 && lastWasRow) h += '<div class="sep"></div>';
      h += '<div class="bname' + (li > 0 ? " cont" : "") + '">' + (li === 0 ? esc(L(ct, "building")) : "") + '</div>';
      h += '<div class="lvl">' + esc(fmt.replace("{n}", row.level)) + '</div>';
      row.ticks.forEach(function(t){
        h += '<div class="dcell vopl-vline">' + (t ? '<span class="dot"></span>' : "") + '</div>';
      });
      mlist.push({ html:h });

  var gridStyle = "grid-template-columns:1fr 95px repeat(" + mxTiers.length + "," + w2 + "px)";
  var headHtml = '<div class="h lbl" data-hdr="1"></div><div class="h" data-hdr="1"></div>' +
    mxTiers.map(function(t){ return '<div class="h vopl-vline" data-hdr="1">' + esc(t.label) + '</div>'; }).join("");
  var mbox = paginateItems(stage, titles, mlist, function(){
    var g = document.createElement("div"); g.className = "vopl-cols vopl-mx";
    g.style.cssText = gridStyle; g.innerHTML = headHtml; return g;
  });
  mbox.insertAdjacentHTML("beforeend", '<div class="vopl-endline"></div>');

function renderIT(stage){

                 k1: "title.it.line1", k2: "title.it.line2" };

  var SEC_ORDER = ["wifi_banner","enterprise","standard","rack","telecom","bundle"];
  var items = [];

  SEC_ORDER.forEach(function(sk){
    var rows = all.filter(function(r){ return r.section === sk; })
      .sort(function(a,b){ return (Number(a.sort)||0) - (Number(b.sort)||0); });
    if (!rows.length) return;
    var secRow = rows.filter(function(r){ return r.row_type === "section"; })[0];
    var tiers = rows.filter(function(r){ return r.row_type === "tier"; });
    var nT = tiers.length || 1;
    var colW = nT > 1 ? 108 : 190;
    var priceCols = 'flex:0 0 ' + colW + 'px;width:' + colW + 'px;';

    /* section band + tier heads (carry over on page break) */
    if (secRow && L(secRow, "label")){
      items.push({ html:'<div class="it-sechead" data-hdr="1"><div class="tt">' + esc(L(secRow, "label")) + '</div>' +
        '<div class="pu" style="flex-basis:' + (nT * colW) + 'px;width:' + (nT * colW) + 'px;">' + esc(priceUnit) + '</div></div>' });
    }
    if (tiers.length > 1){
      var th = '<div class="it-tiers" data-hdr="1"><div class="sp"></div>';
      tiers.forEach(function(t){
        var key = String(t.note || "").toLowerCase();
        th += '<div class="it-tier ' + esc(key) + '" style="' + priceCols + '">' +
          '<div class="k">' + esc(key.toUpperCase()) + '</div>' +
          '<div class="l">' + esc(L(t, "label")) + '</div></div>';
      });
      th += '</div>';
      items.push({ html: th });
    }

    /* groups: one paginate item per group (kept unsplit, like the PDF) */
    var gi = 0, i = 0;
    var body = rows.filter(function(r){ return ["group","bullet","option"].indexOf(r.row_type) > -1; });
    while (i < body.length){
      if (body[i].row_type !== "group"){ i++; continue; }
      var g = body[i]; i++;
      var kids = [];
      while (i < body.length && body[i].row_type !== "group"){ kids.push(body[i]); i++; }
      if (!L(g, "label")){ continue; }            /* language-specific group not present in this language */
      var bullets = kids.filter(function(k){ return k.row_type === "bullet" && L(k, "label"); });
      var opts    = kids.filter(function(k){ return k.row_type === "option" && L(k, "label"); });
      var groupHasTierPrice = (g.price_a !== "" || g.price_b !== "" || g.price_c !== "");
      var perBullet = bullets.some(function(b){ return b.price_a !== ""; });

      var h = '<div class="it-grp' + (gi === 0 ? " first" : "") + '">';
      h += '<div class="it-gl">' + esc(L(g, "label")) + '</div>';
      h += '<div class="it-gb">' + bullets.map(function(b){
        var bp = "";
        if (perBullet){
          var v = String(b.price_a || "");
          var plain = v && !/\d/.test(v.replace(/[.,]/g, "")) ? "" : "";
          bp = v ? '<span class="bp' + (/^(inclusive|包含|無料|免費|免费|complimentary)$/i.test(v) ? " inc" : "") + '">' + esc(v) + '</span>' : (groupHasTierPrice ? "" : '<span class="bp"></span>');
        }
        return '<div class="bl">' + '<span style="flex:1;min-width:0;">' + esc(L(b, "label")) + '</span>' + bp + '</div>';
      }).join("") + '</div>';
      if (!perBullet || groupHasTierPrice){
        var vals = nT > 1 ? [g.price_a, g.price_b, g.price_c].slice(0, nT) : [g.price_a];
        vals.forEach(function(v, vi){
          var s = String(v === undefined ? "" : v);
          var tint = nT > 1 ? " t" + "abc".charAt(vi) : "";
          h += '<div class="it-pc' + tint + (/request|リクエスト|按需|同價|同价|same price|preferred|優惠|优惠|優遇/i.test(s) ? " plain" : "") + '" style="' + priceCols + '">' + esc(s) + '</div>';
        });
      }
      h += '</div>';
      opts.forEach(function(o){
        var optW = 'flex:0 0 ' + (nT * colW) + 'px;width:' + (nT * colW) + 'px;';
        h += '<div class="it-opt"><div class="ol">' + esc(L(o, "label")) + '</div>' +
          '<div class="op" style="' + optW + '">' + esc(o.price_a) + '</div></div>';
      });
      items.push({ html: sk === "wifi_banner" ? '<div class="it-wifi-wrap">' + h + '</div>' : h });
      gi++;
    }
    items.push({ html:'<div class="it-close"></div>' });
  });

  if (!items.length) return false;
  paginateItems(stage, titles, items, function(){ var d = document.createElement("div"); return d; });
  return true;
}

var IMG = {}, GEO = {};   // image / map caches: null=pending, ""/false=failed
var LK = LANG_KEYS;
var COUNTRY = { "Hong Kong":"Hong Kong", "Japan":"Japan", "Australia":"Australia",
  "Singapore":"Singapore", "Manila":"Philippines", "Kuala Lumpur":"Malaysia", "Ho Chi Minh City":"Vietnam" };
function skPage(t1, t2){ return newPage({ t1:t1, t2:t2 }); }
function SKT(key){
  var r = DB.skText.filter(function(t){ return t.key === key; })[0];
  if (!r) return "";
  var v = r["text_" + LK[curLang]];
  return (v === undefined || v === "") ? String(r.text_en || "") : String(v);
}
function skMarketCentres(m){
  return DB.centres.filter(function(c){ return c.market === m; })
    .sort(function(a, b){ return (Number(a.sort) || 0) - (Number(b.sort) || 0); });
}
function assetId(key){
  var r = DB.skAssets.filter(function(a){ return a.key === key; })[0];
  return r && r.drive_file_id ? String(r.drive_file_id).trim() : "";
}
function imgTag(key, cls){
  var id = assetId(key);
  if (!id) return '<div class="' + cls + ' ph">photo pending</div>';
  if (IMG[id] === undefined){
    IMG[id] = null;
    fetch(SCRIPT_URL + "?action=image&id=" + encodeURIComponent(id))
      .then(function(r){ return r.json(); })
      .then(function(j){ IMG[id] = j.ok ? j.dataUri : ""; render(); })
      .catch(function(){ IMG[id] = ""; render(); });
  }
  if (IMG[id]) return '<img class="' + cls + '" src="' + IMG[id] + '">';
  if (IMG[id] === null) return '<div class="' + cls + ' ph">loading\u2026</div>';
  return '<div class="' + cls + ' ph">image unavailable</div>';
}
function imagesPending(){
  return Object.keys(IMG).some(function(k){ return IMG[k] === null; }) ||
         Object.keys(GEO).some(function(k){ return GEO[k] === null; });
}
function addPaged(stage, t1, t2, itemsHtml){
  var page = skPage(t1, t2); stage.appendChild(page);
  var body = page.querySelector(".vopl-pbody");
  itemsHtml.forEach(function(h){
    var tp = document.createElement("template"); tp.innerHTML = h;
    var nodes = Array.prototype.slice.call(tp.content.childNodes);
    nodes.forEach(function(n){ body.appendChild(n); });
    if (body.scrollHeight > body.clientHeight + 1){
      nodes.forEach(function(n){ body.removeChild(n); });
      page = skPage(t1, t2); stage.appendChild(page);
      body = page.querySelector(".vopl-pbody");
      var tp2 = document.createElement("template"); tp2.innerHTML = h;
      Array.prototype.slice.call(tp2.content.childNodes).forEach(function(n){ body.appendChild(n); });
    }
  });
}

/* ---------- PAGE 3: Locations ---------- */
function centreCards(market, groupByCity){
  var groups = {}, order = [];

    if (d.indexOf(" \u2014 ") > -1){ var sp = d.split(" \u2014 "); city = sp[0]; dist = sp.slice(1).join(" \u2014 "); }
    var key = groupByCity && city ? city : (dist || city || "");
    if (!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(ct);
  });
  return { groups:groups, order:order };

function locCard(ct){

    '<div class="l">' + esc(ct.levels) + '</div>' +
    '<div class="a">' + esc(L(ct, "address")) + '</div></div>';

function normd(x){ return String(x || "").toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]/g, ""); }
function centresForNodeDistrict(nodeDist){
  var nd = normd(nodeDist);
  return skMarketCentres(curMarket).filter(function(ct){

/* Interchange stations render as perpendicular capsules (MTR/JR visual grammar). */
var INTERCHANGE = { "central":1, "admiralty":1, "northpoint":1, "quarrybay":1, "mongkok":1, "yaumatei":1,
  "tokyo":1, "osaka":1, "shimbashi":1 };
function blockHtml(title, centres, style){
  return '<div class="sk-block" style="' + style + '"><div class="dn">' + esc(title) + '</div>' +
    centres.map(locCard).join("") + '</div>';

function renderTransit(stage, style){
  var nodes = DB.skMapNodes.filter(function(n){ return n.market === curMarket; })
    .sort(function(a, b){ return (Number(a.sort)||0) - (Number(b.sort)||0); });
  var t1 = COUNTRY[curMarket].toUpperCase();
  var page = skPage(t1, SKT("title.locations.line2") || "LOCATIONS");
  stage.appendChild(page);
  var body = page.querySelector(".vopl-pbody");
  if (!nodes.length){ body.innerHTML = '<div class="vopl-empty">No SK-MapNodes rows for ' + esc(curMarket) + '.</div>'; return; }

  var lines = [];
  nodes.forEach(function(n){ if (lines.indexOf(n.line) < 0) lines.push(n.line); });
  var main = nodes.filter(function(n){ return n.line === lines[0]; });
  var branch = lines[1] ? nodes.filter(function(n){ return n.line === lines[1]; }) : [];
  var W = 698, H = 915, mainY = 560;
  var padL = 102, padR = 44;
  var step = (W - padL - padR) / Math.max(main.length - 1, 1);
  main.forEach(function(n, i){ n._x = padL + step * i; });
  var mainCol = style === "jr" ? "#2E7D32" : "#1B5FA6";

  var svg = '';
  /* branch (red) line: vertical, elbow joining the main line */
  var bx = 0, joinX = 0;
  if (branch.length){
    var bi = Math.min(main.length - 2, Math.max(2, Math.round((main.length - 1) * 0.42)));
    bx = (main[bi]._x + main[bi + 1]._x) / 2;
    joinX = main[Math.max(bi - 1, 1)]._x + 10;
    var topY = 160, lastY = 430;
    branch.forEach(function(n, i){
      n._x = bx;
      n._y = topY + (lastY - topY) * (branch.length > 1 ? (branch.length - 1 - i) / (branch.length - 1) : 0);
    });
    svg += '<path d="M ' + bx + ' 116 L ' + bx + ' ' + (lastY + 24) +
      ' L ' + joinX + ' ' + (mainY - 7) +
      '" fill="none" stroke="#C0392B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  /* main (blue/green) line */

function monoize(dataUri, cb){   // monotone map: grayscale wash baked into the pixels (PDF-safe)

      try{
        var c = document.createElement("canvas");
        c.width = img.width; c.height = img.height;
        var x = c.getContext("2d");

        x.drawImage(img, 0, 0);
        cb(c.toDataURL("image/png"));
      }catch(e){ cb(dataUri); }
    };
    img.onerror = function(){ cb(dataUri); };
    img.src = dataUri;
  }catch(e){ cb(dataUri); }
}

  secs.forEach(function(sec){
    var rows = all.filter(function(r){ return r.section === sec; })
      .sort(function(a, b){ return (Number(a.sort) || 0) - (Number(b.sort) || 0); });
    var secRow = rows.filter(function(r){ return r.row_type === "section"; })[0];
    var body = rows.filter(function(r){ return ["item","sub","group","split"].indexOf(r.row_type) > -1; });
    var feet = rows.filter(function(r){ return r.row_type === "foot"; });
    var secRemark = secRow ? String(spVal(secRow, "remark")) : "";
    var h = '<table class="sp-t"><colgroup><col class="c1"><col class="c2"><col></colgroup>';
    if (secRow){
      h += '<tr class="sec"><td>' + spCell(secRow, "label", esc(spVal(secRow, "label"))) + '</td>' +
        '<td class="mk">' + (firstSec ? esc(place) : "") + '</td>';
      if (secRemark){
        h += '<td class="rm" rowspan="' + (body.length + 1) + '">' +
          secRemark.split(/\n/).map(function(l2){ return l2.trim() ? '<div class="b2">' + esc(l2.replace(/^\s*[\u2022\u25AA\u00B7]\s*/, "")) + '</div>' : ""; }).join("") + '</td>';
      } else {
        h += '<td class="rm">' + (EDIT ? spCell(secRow, "remark", "") : "") + '</td>';
      }
      h += '</tr>';
    }
    body.forEach(function(r){
      var lbl = spCell(r, "label", esc(spVal(r, "label")));
      h += '<tr>';
      if (r.row_type === "group"){
        h += '<td class="d g">' + lbl + '</td><td class="p"></td>';
      } else {
        h += '<td class="d' + (r.row_type === "sub" ? " sub" : "") + '">' + lbl + '</td>';
        if (r.row_type === "split"){
          h += '<td class="p"><div class="split"><div class="sh">' + esc(splitL) + '</div><div class="sh">' + esc(splitR) + '</div>' +
            '<div class="sv">' + spPrice(r, "price_1") + '</div><div class="sv">' + spPrice(r, "price_2") + '</div></div></td>';
        } else if (spVal(r, "price_2") !== ""){
          h += '<td class="p"><div class="dual"><span>' + spPrice(r, "price_1") + '</span><span>' + spPrice(r, "price_2") + '</span></div></td>';
        } else {
          h += '<td class="p">' + spPrice(r, "price_1") + '</td>';
        }
      }
      if (!secRemark){
        var rk = spVal(r, "remark");
        h += '<td class="rm">' + (EDIT ? spCell(r, "remark", esc(rk)) : esc(rk)) + '</td>';
      }
      h += '</tr>';
    });
    h += '</table>';
    feet.forEach(function(r){
      h += '<div class="sp-foot">' + spCell(r, "label", esc(spVal(r, "label"))) + '</div>';
    });
    h += '<div class="sp-gap"></div>';
    items.push({ html: h });
    firstSec = false;
  });
  paginateItems(stage, titles, items, function(){ var d = document.createElement("div"); return d; });
}

/* =====================================================================
   INLINE EDIT MODE
   ===================================================================== */
document.getElementById("btnEdit").addEventListener("click", function(){
  EDIT = !EDIT;
  this.classList.toggle("on", EDIT);
  document.body.classList.toggle("editing", EDIT);
  render();
  setStatus(EDIT ? "Edit mode \u2014 click any underlined text or price, type, then Save." : "Edit mode off", EDIT ? "ok" : "");
});
var stageEl = document.getElementById("stage");
stageEl.addEventListener("input", function(ev){
  var t = ev.target && ev.target.closest ? ev.target.closest("[data-ed]") : null;
  if (!t) return;
  dirty[t.dataset.ed] = t.innerText.replace(/\n+$/, "");
  syncEditbar();
});
stageEl.addEventListener("keydown", function(ev){
  if (ev.key === "Enter" && !ev.isComposing && ev.keyCode !== 229){
    var t = ev.target && ev.target.closest ? ev.target.closest("[data-ed]") : null;
    if (t){ ev.preventDefault(); t.blur(); }
  }
});
function syncEditbar(){
  var n = Object.keys(dirty).length;
  document.getElementById("editbarText").textContent = n + " unsaved change" + (n === 1 ? "" : "s");
  document.getElementById("editbar").classList.toggle("show", n > 0);
}
document.getElementById("ebDiscard").addEventListener("click", function(){
  dirty = {}; syncEditbar(); render();
});
document.getElementById("ebSave").addEventListener("click", function(){
  var kk = Object.keys(dirty);
  if (!kk.length) return;
  var edits = [], newRows = {};
  var NUMF = { gold:1, platinum:1, diamond:1, per_30_mins:1, per_day:1 };
  kk.forEach(function(k){
    var parts = k.split("|"); var field = parts.pop(); var kind = parts[0]; var keys = parts.slice(1);
    var value = dirty[k];
    if ((kind === "vo" || kind === "mr") && NUMF[field]){
      value = String(value).replace(/[^0-9.]/g, "");        /* prices go back as plain numbers */
    }
    if (kind === "tx"){
      var row = DB.text.filter(function(t){
        return t.market === keys[0] && String(t.centre_id || "") === keys[1] && t.key === keys[2];
      })[0];
      if (!row){
        var sig = keys.join("|");
        var nr = newRows[sig] = newRows[sig] || { market: keys[0], centre_id: keys[1], key: keys[2] };
        nr[field] = value;
        return;
      }
    }
    edits.push({ kind: kind, keys: keys, field: field, value: value });
  });
  var btn = document.getElementById("ebSave"); btn.disabled = true;
  setStatus("Saving " + kk.length + " change(s)\u2026");
  var rows = Object.keys(newRows).map(function(sg){ return newRows[sg]; });
  (rows.length ? post({ action:"addRows", tab:"Text", rows: rows }) : Promise.resolve({ ok:true }))
  .then(function(){ return edits.length ? post({ action:"saveEdits", edits: edits }) : { ok:true, skipped:[] }; })
  .then(function(j){
    btn.disabled = false;
    var skipped = j.skipped || [];
    if (skipped.length){
      var keep = {};
      skipped.forEach(function(sk){ if (dirty[sk.key] !== undefined) keep[sk.key] = dirty[sk.key]; });
      dirty = keep; syncEditbar();
      setStatus("Saved some \u2014 " + skipped.length + " FAILED (kept pending): " +
        skipped.map(function(sk){ return sk.reason; }).slice(0, 2).join("; "), "err");
    } else {
      dirty = {}; syncEditbar();
      setStatus("Saved to Google Sheet \u2713 \u2014 refreshing\u2026", "ok");
      fetchData();
    }
  })
  .catch(function(e){ btn.disabled = false; setStatus("Save failed: " + e.message, "err"); });
});
window.addEventListener("beforeunload", function(ev){
  if (Object.keys(dirty).length){ ev.preventDefault(); ev.returnValue = ""; }
});

/* =====================================================================
   PDF EXPORT + SAVE TO DRIVE (unchanged)
   ===================================================================== */
function pdfFilename(){ return curMarket.replace(/\s+/g, "") + "-" + curLang + ".pdf"; }
function exportPdf(toDrive){
  if (Object.keys(dirty).length){ setStatus("Save or discard your inline edits before exporting.", "err"); return; }
  if (typeof imagesPending === "function" && imagesPending()){ setStatus("Sales Kit photos/maps are still loading \u2014 try again in a moment.", "err"); return; }
  if (EDIT){
    EDIT = false;
    document.getElementById("btnEdit").classList.remove("on");
    document.body.classList.remove("editing");
    render();
  }
  var pages = document.querySelectorAll(".vopl-page");
  if (!pages.length){ setStatus("Nothing to export.", "err"); return; }
  if (toDrive && !SCRIPT_URL){ setStatus("SCRIPT_URL is not set.", "err"); return; }
  setStatus("Rendering PDF\u2026");
  document.getElementById("btnPdf").disabled = true;
  document.getElementById("btnDrive").disabled = true;
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ unit:"pt", format:"a4", orientation:"portrait" });
  var W = 595.28, idx = 0;
  function next(){
    if (idx >= pages.length){ finish(); return; }
    html2canvas(pages[idx], { scale:2.2, useCORS:true, backgroundColor:"#FFFFFF", logging:false })
      .then(function(cv){
        if (idx > 0) doc.addPage();
        doc.addImage(cv.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, W, 841.89);
        idx++; next();
      })
      .catch(function(err){ setStatus("Capture failed: " + err.message, "err"); unlock(); });
  }
  function finish(){
    var name = pdfFilename();
    if (!toDrive){ doc.save(name); setStatus("Downloaded " + name, "ok"); unlock(); return; }
    setStatus("Uploading to Drive\u2026");
    fetch(SCRIPT_URL, {
      method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"savePdf", filename:name, pdfBase64: doc.output("datauristring").split(",")[1] })
    })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j.ok) throw new Error(j.error || "backend error");
      setStatus("Saved to Drive: " + name, "ok"); unlock();
    })
    .catch(function(err){ setStatus("Drive save failed: " + err.message, "err"); unlock(); });
  }
  function unlock(){
    document.getElementById("btnPdf").disabled = false;
    document.getElementById("btnDrive").disabled = false;
  }
  next();
}
</script>
