<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compass Offices — Price List Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
.coed{
  --co-orange:#FF6600; --co-orange-dk:#E55A00; --co-orange-wash:#FFF3EB; --co-orange-tint:#FFD9BD;
  --co-ink:#1A1A1A; --co-text:#333; --co-text-2:#555; --co-muted:#888; --co-faint:#BBB;
  --co-line:#E5E5E5; --co-bg:#F5F5F5; --co-paper:#FFF; --co-radius:10px; --co-pill:999px;
  color:var(--co-ink);
  font-family:'Hanken Grotesk','Noto Sans TC','Noto Sans SC','Noto Sans JP',sans-serif;
  background:var(--co-bg); margin:0; min-height:100vh; line-height:1.5;
}
.coed *,.coed *::before,.coed *::after{box-sizing:border-box;}
.coed-top{position:sticky;top:0;z-index:40;background:var(--co-paper);border-bottom:1px solid var(--co-line);
  display:flex;align-items:center;gap:14px;padding:12px 22px;}
.coed-top .logo{height:26px;width:auto;}
.coed-top h1{font-size:15px;font-weight:800;margin:0;letter-spacing:.3px;}
.coed-top h1 span{color:var(--co-orange);}
.coed-status{margin-left:auto;font-size:12.5px;color:var(--co-muted);max-width:360px;}
.coed-status.ok{color:#2E7D32;} .coed-status.err{color:#C0392B;}
/* ── v2 additions ─────────────────────────────────────────────── */
.coed-help{background:#FFF7F0;border:1px solid #FFD9B8;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#7A4A1F;line-height:1.55;margin:10px 0 16px;}
/* ── preloader ── */
.coed-loader{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.coed-loader .ldr{position:relative;width:104px;height:104px;margin-bottom:14px;}
.coed-loader .ring{position:absolute;inset:0;width:100%;height:100%;animation:coed-spin 1.1s linear infinite;}
.coed-loader .mark{position:absolute;inset:24px;width:56px;height:56px;animation:coed-pulse 1.6s ease-in-out infinite;}
.coed-loader .t{font-size:15px;font-weight:800;color:var(--co-ink);}
.coed-loader .s{font-size:12px;color:var(--co-muted);}
.coed-loader .s::after{content:"";animation:coed-dots 1.4s steps(4,end) infinite;}
.coed-loader .err{font-size:13px;color:#C0392B;max-width:420px;text-align:center;line-height:1.6;margin-top:4px;}
@keyframes coed-spin{to{transform:rotate(360deg);}}
@keyframes coed-pulse{0%,100%{transform:scale(.94);opacity:.85;}50%{transform:scale(1.05);opacity:1;}}
@keyframes coed-dots{0%{content:"";}25%{content:".";}50%{content:"..";}75%{content:"...";}}
/* ── Map Designer ── */
.mdwrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
.mdfit{flex:0 0 auto;max-width:100%;overflow:visible;}
.mdcanvas{position:relative;width:698px;background:#fff;border:1px solid var(--co-line);box-shadow:0 4px 18px rgba(0,0,0,.08);overflow:hidden;touch-action:none;}
.mdcanvas svg.base{position:absolute;inset:0;width:100%;height:100%;}
.mdcanvas .sk-block{position:absolute;cursor:grab;z-index:2;}
.mdcanvas .sk-block:active{cursor:grabbing;}
.mdcanvas .sk-block .dn{font-size:16px;font-weight:800;color:var(--co-ink);margin-bottom:6px;}
.mdcanvas .mdloc{margin-bottom:8px;}
.mdcanvas .mdloc .b{font-size:11.5px;font-weight:700;color:var(--co-orange);line-height:1.3;}
.mdcanvas .mdloc .l{font-size:10px;font-weight:700;color:var(--co-orange);}
.mdcanvas .mdloc .a{font-size:9.5px;color:var(--co-muted);line-height:1.4;}
.mdcanvas .mdsta{position:absolute;width:34px;height:40px;transform:translate(-50%,-50%);cursor:ew-resize;border-radius:8px;z-index:3;}
.mdcanvas .mdsta:hover{background:rgba(255,102,0,.10);}
.mdcanvas .mdline{position:absolute;left:0;right:0;height:16px;transform:translateY(-50%);cursor:ns-resize;}
.mdcanvas .mdpin{position:absolute;width:34px;height:48px;transform:translate(-50%,-100%);cursor:grab;z-index:3;}
.mdcanvas .mdpin:active{cursor:grabbing;}
.mdcanvas .mdpin:hover svg{filter:drop-shadow(0 2px 5px rgba(0,0,0,.35));}
.mdcanvas .mdpin svg{width:100%;height:100%;display:block;}
.mdcanvas .mdpin.unplaced{opacity:.38;filter:grayscale(.4);}
.mdcanvas .mdcard{position:absolute;background:rgba(255,255,255,.94);border-radius:8px;padding:8px 11px 4px;cursor:grab;box-shadow:0 1px 6px rgba(0,0,0,.10);z-index:2;}
.mdcanvas .mdcard:active{cursor:grabbing;}
.mdcanvas .mdcard .dn{font-size:14px;font-weight:800;margin-bottom:3px;}
.mdcanvas [data-md]:hover{outline:1.5px dashed rgba(255,102,0,.55);outline-offset:2px;}
.mdcanvas [data-md].sel{outline:2px solid var(--co-orange);outline-offset:2px;box-shadow:0 0 0 5px rgba(255,102,0,.14);}
.mdpanel{flex:1;min-width:250px;background:#fff;border:1px solid var(--co-line);border-radius:12px;padding:14px 16px 16px;position:sticky;top:60px;box-shadow:0 3px 14px rgba(0,0,0,.05);max-height:calc(100vh - 90px);overflow:auto;}
.mdpanel h4{margin:0 0 10px;font-size:13px;color:var(--co-orange);text-transform:uppercase;letter-spacing:.5px;padding-bottom:7px;border-bottom:1px solid var(--co-line);}
.mdpanel input:focus,.mdpanel select:focus{outline:none;border-color:var(--co-orange);box-shadow:0 0 0 2.5px rgba(255,102,0,.14);}
.mdpanel label{display:block;font-size:10.5px;font-weight:700;color:var(--co-text-2);margin:9px 0 3px;}
.mdpanel input[type=text],.mdpanel input[type=number]{width:100%;font:inherit;font-size:12.5px;border:1px solid var(--co-line);border-radius:7px;padding:6px 9px;}
.mdpanel input[type=range]{width:100%;accent-color:#FF6600;}
.mdpanel .hint2{font-size:10.5px;color:var(--co-muted);line-height:1.5;margin-top:4px;}
.mdconn{position:absolute;width:17px;height:17px;border-radius:50%;transform:translate(-50%,-50%);cursor:grab;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.25);z-index:6;}
.mdconn:hover{width:21px;height:21px;}
.mdconn:active{cursor:grabbing;}
.mdselbar{display:flex;align-items:center;gap:8px;width:698px;max-width:100%;margin:0 0 8px;padding:7px 12px;background:#fff;border:1px solid var(--co-line);border-radius:9px;font-size:11.5px;color:var(--co-ink);}
.mdselbar .dim{color:var(--co-muted);font-weight:600;}
.mdselbar b{color:var(--co-orange);text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;}
.mdselbar kbd{font:inherit;font-size:10px;font-weight:800;border:1px solid var(--co-line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#FAFAFA;}
.mdconn.s{background:#2E7D32;} .mdconn.e{background:#FF6600;} .mdconn.v{background:#1B5FA6;}
.mdstyle{display:inline-flex;border:1px solid var(--co-line);border-radius:8px;overflow:hidden;background:rgba(255,255,255,.92);}
.mdstyle button{font:inherit;font-size:10.5px;font-weight:800;padding:5px 10px;border:0;background:transparent;color:var(--co-muted);cursor:pointer;}
.mdstyle button.on{background:var(--co-orange);color:#fff;}
.mdgeo-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#BBB;font-size:12px;text-align:center;padding:30px;background:#F6F6F6;}
.coed-drop{border:2px dashed #FFD9B8;background:#FFFBF7;border-radius:12px;padding:16px;text-align:center;font-size:12.5px;color:#7A4A1F;margin:0 0 14px;cursor:pointer;transition:background .15s,border-color .15s;}
.coed-drop b{color:var(--co-orange);}
.coed-drop.on{background:#FFE9D6;border-color:var(--co-orange);}
.coed-card{background:#fff;border:1px solid var(--co-line,#E4E4E4);border-radius:12px;padding:14px 16px;margin:0 0 14px;}
.coed-card h3{margin:0 0 2px;font-size:14.5px;color:var(--co-ink,#1A1A1A);}
.coed-card .hint{font-size:11.5px;color:var(--co-muted,#8A8A8A);margin:0 0 10px;line-height:1.5;}
.coed-keybadge{display:inline-block;background:#F2F2F2;border-radius:5px;padding:1px 7px;font-size:10.5px;color:#777;margin-right:4px;white-space:nowrap;}
.coed-langpick{display:flex;gap:6px;align-items:center;margin:0 0 14px;flex-wrap:wrap;}
.coed-langpick .lp{border:1.5px solid var(--co-line,#E4E4E4);background:#fff;border-radius:999px;padding:4px 13px;font-size:12px;font-weight:700;cursor:pointer;color:#666;}
.coed-langpick .lp.on{background:var(--co-orange,#FF6600);border-color:var(--co-orange,#FF6600);color:#fff;}
.coed-langpick .lbl{font-size:11px;color:var(--co-muted,#8A8A8A);font-weight:700;margin-right:2px;}
.coed-imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.coed-imgcard{border:1px solid var(--co-line,#E4E4E4);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;}
.coed-imgcard .th{height:130px;background:#F5F5F5 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#BBB;font-size:11px;}
.coed-imgcard .bd{padding:9px 11px;display:flex;flex-direction:column;gap:6px;}
.coed-imgcard .ky{font-size:12px;font-weight:800;color:var(--co-ink,#1A1A1A);word-break:break-all;}
.coed-imgcard .nt{font-size:10.5px;color:var(--co-muted,#8A8A8A);line-height:1.4;}
.coed-imgcard .ops{display:flex;gap:6px;}
.coed-upbtn{flex:1;border:1.5px dashed var(--co-orange,#FF6600);background:#FFF7F0;color:var(--co-orange,#FF6600);border-radius:8px;padding:6px 8px;font-size:11.5px;font-weight:700;cursor:pointer;text-align:center;}
.coed-upbtn.busy{opacity:.5;pointer-events:none;}
.coed-minibtn{border:1px solid var(--co-line,#E4E4E4);background:#fff;border-radius:8px;padding:6px 9px;font-size:11px;cursor:pointer;color:#666;}
.coed-acc{border:1px solid var(--co-line,#E4E4E4);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden;}
.coed-acc>.hd{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;font-weight:800;font-size:13.5px;color:var(--co-ink,#1A1A1A);background:#FAFAFA;}
.coed-acc>.hd .n{margin-left:auto;font-size:11px;color:var(--co-muted,#8A8A8A);font-weight:600;}
.coed-acc>.bd{padding:12px 14px;display:none;}
.coed-acc.open>.bd{display:block;}
.coed-acc.open>.hd{border-bottom:1px solid var(--co-line,#E4E4E4);}
.coed-itgrp{border:1px solid #EDEDED;border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.coed-itgrp .grow{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
.coed-itgrp input,.coed-itgrp textarea{width:100%;border:1px solid #E4E4E4;border-radius:7px;padding:5px 8px;font:inherit;font-size:12px;}
.coed-itgrp .prices{display:flex;gap:6px;}
.coed-itgrp .prices input{width:110px;}
.coed-itrow{display:flex;gap:6px;align-items:center;margin:4px 0 4px 14px;}
.coed-itrow .tag{font-size:9.5px;font-weight:800;color:#999;width:44px;flex:0 0 auto;text-transform:uppercase;}
.coed-itrow input.pr{width:150px;flex:0 0 auto;}
.coed-addrow{border:1.5px dashed #D9D9D9;background:#FCFCFC;color:#888;border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;margin:6px 0 0 14px;}
.coed-del{border:none;background:none;color:#C33;font-size:14px;cursor:pointer;padding:2px 6px;flex:0 0 auto;}
.coed-mv{border:none;background:none;color:#999;cursor:pointer;font-size:12px;padding:2px 4px;flex:0 0 auto;}
/* ── WYSIWYG ── */
.wz{background:#fff;border:1px solid #E4E4E4;border-radius:12px;padding:18px 20px;margin-bottom:16px;max-width:860px;}
.wz [contenteditable]{outline:none;border-radius:4px;min-width:24px;}
.wz [contenteditable]:hover{background:#FFF3E8;}
.wz [contenteditable]:focus{background:#FFF3E8;box-shadow:0 0 0 2px #FF660055;}
.wz [contenteditable]:empty:before{content:attr(data-ph);color:#C9C9C9;font-style:italic;font-weight:400;}
.wz .secband{display:flex;align-items:center;background:#F7F7F7;border-top:2px solid #DDD;margin:14px 0 0;}
.wz .secband .tt{flex:1;font-size:19px;font-weight:800;padding:10px 12px;}
.wz .secband .pu{font-size:12px;font-weight:700;padding:0 8px;text-align:center;}
.wz .tierrow{display:flex;border-bottom:1px solid #E4E4E4;}
.wz .tierrow .sp{flex:1;}
.wz .tiercell{display:flex;flex-direction:column;align-items:center;padding:6px;gap:2px;}
.wz .tiercell .k{font-size:13px;font-weight:800;padding:0 12px 2px;border-bottom:3px solid #CCC;}
.wz .tiercell.a{background:#F5F8FC;} .wz .tiercell.a .k{color:#4A78C2;border-color:#4A78C2;}
.wz .tiercell.b{background:#F4FAF5;} .wz .tiercell.b .k{color:#57A05A;border-color:#57A05A;}
.wz .tiercell.c{background:#FEF8F0;} .wz .tiercell.c .k{color:#E8A33D;border-color:#E8A33D;}
.wz .tiercell .l{font-size:9px;font-weight:700;text-align:center;line-height:1.3;}
.wz .grp{display:flex;border-top:1px solid #E4E4E4;position:relative;}
.wz .grp.first{border-top:0;}
.wz .gl{flex:0 0 150px;font-size:13px;font-weight:700;padding:10px 8px 10px 0;line-height:1.35;}
.wz .gb{flex:1;min-width:0;padding:5px 0;}
.wz .bl{font-size:10.5px;line-height:1.45;padding:3px 6px 3px 0;display:flex;gap:6px;align-items:baseline;position:relative;}
.wz .bl:before{content:"\2022";}
.wz .bl .t{flex:1;min-width:0;}
.wz .bl .bp{margin-left:auto;font-weight:700;color:#FF6600;min-width:40px;text-align:right;}
.wz .pcell{flex:0 0 96px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#FF6600;text-align:center;border-left:1px solid #E4E4E4;padding:6px 4px;line-height:1.3;}
.wz .pcell.ta{background:#F5F8FC;} .wz .pcell.tb{background:#F4FAF5;} .wz .pcell.tc{background:#FEF8F0;}
.wz .optrow{display:flex;background:#F5F5F5;border-top:1px solid #E4E4E4;position:relative;}
.wz .optrow .ol{flex:1;font-size:10.5px;padding:5px 6px 5px 152px;}
.wz .optrow .op{flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#FF6600;padding:5px 4px;}
.wz .rowops{position:absolute;right:-4px;top:2px;display:none;gap:0;background:#fff;border:1px solid #EEE;border-radius:6px;padding:0 2px;z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.wz .grp:hover>.rowops,.wz .bl:hover>.rowops,.wz .optrow:hover>.rowops,.wz .mrr:hover>.rowops{display:flex;}
.wz .rowops button{border:none;background:none;cursor:pointer;font-size:11px;color:#999;padding:2px 5px;}
.wz .rowops button:hover{color:#FF6600;}
.wz .rowops button.del:hover{color:#C33;}
.wz .addbar{border:1.5px dashed #DDD;background:#FCFCFC;color:#999;border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;margin:8px 0 0;}
.wz .addbar:hover{border-color:#FF6600;color:#FF6600;}
.wzlang{display:flex;gap:6px;margin:0 0 12px;}
.wzlang button{border:1.5px solid #E4E4E4;background:#fff;border-radius:999px;padding:4px 15px;font-size:12px;font-weight:700;cursor:pointer;color:#666;}
.wzlang button.on{background:#1A1A1A;border-color:#1A1A1A;color:#fff;}
.wzsave{position:sticky;top:0;z-index:5;background:#fff;padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #EEE;margin-bottom:12px;}
/* MR */
.wz .mrtable{width:100%;border-collapse:collapse;}
.wz .mrtable th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#999;text-align:left;padding:6px 8px;border-bottom:2px solid #EEE;}
.wz .mrtable td{padding:6px 8px;border-bottom:1px solid #F0F0F0;font-size:12.5px;vertical-align:middle;}
.wz .mrr{position:relative;}
.wz .mrimg{width:56px;height:38px;border-radius:6px;background:#F2F2F2 center/cover;display:inline-block;vertical-align:middle;cursor:pointer;border:1px solid #E8E8E8;font-size:8.5px;color:#BBB;text-align:center;line-height:38px;}
.wz .mrprice{color:#FF6600;font-weight:700;}
.wz .mxcell{text-align:center;font-size:14px;cursor:pointer;user-select:none;color:#57A05A;font-weight:800;}
.wz .mxcell.off{color:#E2E2E2;}
.wz .mxgrp{border:1px solid #EDEDED;border-radius:10px;padding:10px 14px;margin:10px 0;}
.wz .mxgrp .mxc{font-size:13.5px;font-weight:800;margin-bottom:2px;}
.wz .mxrow{display:flex;gap:7px;align-items:center;padding:5px 0;position:relative;flex-wrap:wrap;}
.wz .mxrow:hover>.rowops{display:flex;}
.wz .mxlvl{flex:0 0 auto;min-width:92px;font-size:12.5px;font-weight:700;border:1px dashed #E8E8E8;border-radius:7px;padding:5px 9px;}
.wz .mxlvl [contenteditable]{display:inline-block;min-width:60px;}
.wz .mxpill{border:1.5px solid #E4E4E4;background:#fff;border-radius:999px;padding:6px 14px;font-size:11.5px;font-weight:700;color:#999;cursor:pointer;font-family:inherit;line-height:1.2;}
.wz .mxpill:hover{border-color:#FFD9BD;}
.wz .mxpill.on{background:#FF6600;border-color:#FF6600;color:#fff;}
.wz .mxpill.on::before{content:"\2713  ";}
.coed-savebadge{background:var(--co-orange,#FF6600);color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:1px 7px;margin-left:6px;}

.coed-shell{display:flex;min-height:calc(100vh - 51px);}
.coed-nav{width:196px;flex:0 0 196px;background:var(--co-paper);border-right:1px solid var(--co-line);padding:16px 10px;}
.coed-nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font-family:inherit;font-size:13.5px;
  font-weight:600;color:var(--co-text-2);background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;}
.coed-nav button:hover{background:var(--co-bg);}
.coed-nav button.on{background:var(--co-orange-wash);color:var(--co-orange);}
.coed-nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 16px;}
.coed-main{flex:1;padding:22px 26px 80px;min-width:0;}
.coed-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.coed-chip{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 15px;border-radius:var(--co-pill);
  border:1px solid var(--co-line);background:var(--co-paper);color:var(--co-text-2);cursor:pointer;}
.coed-chip.on{background:var(--co-orange);border-color:var(--co-orange);color:#fff;}
.coed-h2{font-size:17px;font-weight:800;margin:0 0 4px;}
.coed-sub{font-size:12.5px;color:var(--co-muted);margin:0 0 16px;}
/* cards */
.coed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.coed-card{background:var(--co-paper);border:1px solid var(--co-line);border-radius:var(--co-radius);padding:16px;
  cursor:pointer;transition:border-color .15s, box-shadow .15s;position:relative;}
.coed-card:hover{border-color:var(--co-orange-tint);box-shadow:0 3px 14px rgba(0,0,0,.06);}
.coed-card .d{font-size:11px;font-weight:700;color:var(--co-muted);text-transform:uppercase;letter-spacing:.5px;}
.coed-card .b{font-size:15px;font-weight:700;color:var(--co-orange);margin:3px 0 2px;}
.coed-card .a{font-size:12px;color:var(--co-text-2);}
.coed-card .badges{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
.coed-badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:var(--co-pill);background:var(--co-bg);color:var(--co-text-2);}
.coed-badge.warn{background:#F5F5F5;color:#8a6d00;border:1px dashed #D9C87A;}
.coed-badge.ok{background:var(--co-orange-wash);color:var(--co-orange);}
.coed-add{border:1.5px dashed var(--co-faint);display:flex;align-items:center;justify-content:center;color:var(--co-muted);
  font-weight:700;font-size:13.5px;min-height:110px;background:none;}
.coed-add:hover{color:var(--co-orange);border-color:var(--co-orange-tint);}
/* drawer */
.coed-veil{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:none;}
.coed-veil.open{display:block;}
.coed-drawer{position:fixed;top:0;right:-620px;width:600px;max-width:96vw;height:100vh;background:var(--co-paper);
  z-index:70;box-shadow:-8px 0 30px rgba(0,0,0,.14);transition:right .22s ease;display:flex;flex-direction:column;}
.coed-drawer.open{right:0;}
.coed-dh{padding:18px 24px 12px;border-bottom:1px solid var(--co-line);display:flex;align-items:center;gap:12px;}
.coed-dh h3{margin:0;font-size:16px;font-weight:800;flex:1;}
.coed-x{background:none;border:0;font-size:20px;color:var(--co-muted);cursor:pointer;line-height:1;padding:4px 8px;}
.coed-db{flex:1;overflow-y:auto;padding:18px 24px 30px;}
.coed-df{padding:14px 24px;border-top:1px solid var(--co-line);display:flex;gap:10px;align-items:center;}
.coed-langs{display:flex;border:1px solid var(--co-line);border-radius:var(--co-pill);overflow:hidden;width:max-content;margin:0 0 16px;}
.coed-lang{font-family:inherit;font-size:12px;font-weight:700;padding:6px 14px;border:0;background:var(--co-paper);color:var(--co-text-2);cursor:pointer;}
.coed-lang.on{background:var(--co-orange);color:#fff;}
.coed-field{margin-bottom:12px;}
.coed-field label{display:block;font-size:11px;font-weight:700;color:var(--co-text-2);margin-bottom:4px;letter-spacing:.2px;}
.coed-field input,.coed-field select,.coed-field textarea{width:100%;font-family:inherit;font-size:13.5px;padding:9px 11px;
  border:1px solid var(--co-line);border-radius:8px;background:var(--co-paper);color:var(--co-ink);}
.coed-field textarea{resize:vertical;min-height:54px;}
.coed-field input:focus,.coed-field textarea:focus,.coed-field select:focus{outline:none;border-color:var(--co-orange-tint);box-shadow:0 0 0 3px var(--co-orange-wash);}
.coed-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.coed-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.coed-sec{font-size:12px;font-weight:800;color:var(--co-orange);letter-spacing:.6px;text-transform:uppercase;margin:22px 0 10px;
  padding-top:14px;border-top:1px solid var(--co-line);}
.coed-sec:first-child{margin-top:0;border-top:0;padding-top:0;}
.coed-hint{font-size:11.5px;color:var(--co-muted);margin:-6px 0 12px;}
/* matrix editor */
.coed-mx{border:1px solid var(--co-line);border-radius:8px;overflow:hidden;}
.coed-mx-h,.coed-mx-r{display:grid;grid-template-columns:86px repeat(var(--mxn,4),1fr) 36px;align-items:center;}
.coed-mx-h{background:var(--co-bg);font-size:11px;font-weight:700;color:var(--co-text-2);}
.coed-mx-h div,.coed-mx-r div{padding:8px 6px;text-align:center;}
.coed-mx-r{border-top:1px solid var(--co-line);}
.coed-mx-r input[type="text"]{width:64px;font-family:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--co-line);border-radius:6px;text-align:center;}
.coed-mx-r input[type="checkbox"]{width:16px;height:16px;accent-color:#FF6600;cursor:pointer;}
.coed-mx-r .del{background:none;border:0;color:var(--co-faint);cursor:pointer;font-size:15px;}
.coed-mx-r .del:hover{color:#C0392B;}
.coed-mini{font-family:inherit;font-size:12px;font-weight:700;color:var(--co-orange);background:none;border:0;cursor:pointer;padding:8px 2px;}
/* buttons */
.coed-btn{font-family:inherit;font-size:13.5px;font-weight:700;padding:10px 20px;border-radius:var(--co-pill);
  border:1px solid var(--co-line);background:var(--co-paper);color:var(--co-ink);cursor:pointer;}
.coed-btn.primary{background:var(--co-orange);border-color:var(--co-orange);color:#fff;}
.coed-btn.primary:hover{background:var(--co-orange-dk);border-color:var(--co-orange-dk);}
.coed-btn.danger{color:#C0392B;border-color:rgba(192,57,43,.35);}
.coed-btn:disabled{opacity:.5;cursor:not-allowed;}
/* tables (MR prices, texts, config) */
.coed-table{width:100%;background:var(--co-paper);border:1px solid var(--co-line);border-radius:var(--co-radius);overflow:hidden;border-collapse:separate;border-spacing:0;}
.coed-table th{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--co-text-2);
  background:var(--co-bg);padding:10px 12px;text-align:left;}
.coed-table td{padding:8px 12px;font-size:13px;border-top:1px solid var(--co-line);vertical-align:top;}
.coed-table td input,.coed-table td textarea{width:100%;font-family:inherit;font-size:13px;padding:7px 9px;
  border:1px solid transparent;border-radius:6px;background:transparent;color:var(--co-ink);}
.coed-table td textarea{min-height:38px;resize:vertical;}
.coed-table td input:hover,.coed-table td textarea:hover{border-color:var(--co-line);background:var(--co-paper);}
.coed-table td input:focus,.coed-table td textarea:focus{outline:none;border-color:var(--co-orange-tint);background:var(--co-paper);box-shadow:0 0 0 3px var(--co-orange-wash);}
.coed-table td.dirty input,.coed-table td.dirty textarea{border-color:var(--co-orange);background:var(--co-orange-wash);}
.coed-group{font-size:12px;font-weight:800;color:var(--co-orange);padding:16px 0 8px;letter-spacing:.4px;}
.coed-savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:-70px;z-index:50;background:var(--co-ink);color:#fff;
  border-radius:var(--co-pill);padding:10px 12px 10px 20px;display:flex;align-items:center;gap:14px;font-size:13px;
  box-shadow:0 8px 26px rgba(0,0,0,.25);transition:bottom .2s ease;}
.coed-savebar.show{bottom:24px;}
.coed-savebar .coed-btn{padding:8px 18px;}
.coed-empty{padding:50px;text-align:center;color:var(--co-muted);font-size:14px;}
@media (max-width:760px){
  .coed-nav{width:54px;flex-basis:54px;}
  .coed-nav button span{display:none;}
  .coed-main{padding:14px 10px 110px;}
  /* header: compact, status truncates instead of stacking the title */
  .coed-top{padding:8px 10px;gap:8px;}
  .coed-top h1{font-size:13px;white-space:nowrap;}
  .coed-status{font-size:11px;max-width:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .coed-top .coed-btn{padding:7px 10px;font-size:12px;white-space:nowrap;}
  /* wide tables scroll inside their card instead of stretching the page */
  .wz,.coed-card{overflow-x:auto;}
  .wz .mrtable,.coed-table{min-width:560px;}
  /* 16px inputs stop iOS zooming in on focus */
  input[type=text],input[type=number],select,textarea,[contenteditable="true"]{font-size:16px !important;}
  .coed-chips{gap:6px;}
  .coed-chip{padding:7px 12px;font-size:12px;}
  .mdpanel{position:static;max-height:none;min-width:0;width:100%;}
  .mdselbar{width:100%;flex-wrap:wrap;}
  .mdselbar .dim{margin-left:0 !important;width:100%;}
  .coed-savebar{max-width:calc(100vw - 12px);flex-wrap:wrap;justify-content:center;font-size:12px;padding:8px 10px;bottom:-200px;}
  .coed-savebar.show{bottom:10px;}
}
</style>

    <div style="flex:1"></div>
    <button class="coed-btn" id="dCancel">Cancel</button>
    <button class="coed-btn primary" id="dSave">Save centre</button>
  </div>
</aside>

<div class="coed-savebar" id="savebar">
  <span id="savebarText">0 unsaved changes</span>
  <button class="coed-btn" id="sbDiscard" style="border-color:#555;color:#fff;background:none;">Discard</button>
  <button class="coed-btn primary" id="sbSave">Save all</button>
</div>

<script>
/* ================= CONFIG ================= */
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTBXPlBtYsiD_0oEThJ_pJzQOmeYNNWFezpC1z6ZIiA-p8VyqDqpdZExkG-51Lqxtf/exec";
var LANGS = [["en","EN"],["tc","\u7E41"],["sc","\u7C21"],["jp","\u65E5"],["vi","VI"]];

/* ================= STATE ================= */
var DB = null;
var view = "centres", IT = [], itDirty = false, LANG2 = localStorage.getItem("coed_lang2") || "tc";
var mkt = null;               // current market filter
var editLang = "en";          // language tab inside the drawer
var editing = null;           // centre object being edited (working copy)
var editingNew = false;
var dirty = {};               // pending inline edits: key -> {action payload}

/* ================= UTIL ================= */
function el(q){ return document.querySelector(q); }
function esc(s){ return String(s === undefined || s === null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function setStatus(m, c){ var s = el("#status"); s.textContent = m; s.className = "coed-status" + (c ? " " + c : ""); }
function rowsToObjects(rows){
  if (!rows || !rows.length) return [];
  var head = rows[0].map(function(h){ return String(h || "").trim().toLowerCase().replace(/\s+/g, "_"); });
  var out = [];
  for (var r = 1; r < rows.length; r++){
    var o = {}, any = false;
    for (var c = 0; c < head.length; c++){
      var v = rows[r] ? rows[r][c] : "";
      if (v === undefined || v === null) v = "";
      if (typeof v === "string") v = v.trim();
      o[head[c]] = v;
      if (v !== "") any = true;
    }
    if (any) out.push(o);
  }
  return out;
}
function post(payload){
  return fetch(SCRIPT_URL, {
    method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); }).then(function(j){
    if (!j.ok) throw new Error(j.error || "backend error");
    return j;
  });
}

/* ================= LOAD ================= */
var ED_MARK = '<svg class="mark" viewBox="80 74 252 252" xmlns="http://www.w3.org/2000/svg">' +
  '<path fill="#FF6600" d="M321.05,200c0,63.81-51.72,115.52-115.52,115.52s-115.53-51.71-115.53-115.52,51.72-115.53,115.53-115.53,115.52,51.72,115.52,115.53Z"/>' +
  '<polygon fill="#fff" points="207.5 195.58 232.27 240.03 263.79 240.03 207.5 139.14 149.17 240.03 181.8 240.03 207.5 195.58"/></svg>';
function edLoaderHtml(errMsg){
  return '<div class="coed-loader"><div class="ldr">' +
    '<svg class="ring" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="50" cy="50" r="45" fill="none" stroke="#FFE3CF" stroke-width="5.5"/>' +
      '<circle cx="50" cy="50" r="45" fill="none" stroke="#FF6600" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="72 211"/></svg>' +
    ED_MARK + '</div>' +
    '<div class="t">Price List Editor</div>' +
    (errMsg
      ? '<div class="err">' + errMsg + '</div><button class="coed-btn primary" id="edLdrRetry" style="margin-top:14px">Try again</button>'
      : '<div class="s">Loading the latest data from Google Sheets</div>') +
    '</div>';
}
function load(){
  setStatus("Loading\u2026");
  if (!DB) el("#main").innerHTML = edLoaderHtml();
  fetch(SCRIPT_URL + "?action=data")
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j.ok) throw new Error(j.error || "backend error");
      DB = {
        config:   rowsToObjects(j.tabs["Config"]),
        centres:  rowsToObjects(j.tabs["Centres"]),
        voPrices: rowsToObjects(j.tabs["VO-Prices"]),
        voFeatures: rowsToObjects(j.tabs["VO-Features"] || []),
        mrPrices: rowsToObjects(j.tabs["MR-Prices"]),
        mrTiers:  rowsToObjects(j.tabs["MR-Tiers"]),
        mrMatrix: rowsToObjects(j.tabs["MR-Matrix"]),
        texts:    rowsToObjects(j.tabs["Text"]),
        skIncluded:  rowsToObjects(j.tabs["SK-Included"] || []),
        skAdditional:rowsToObjects(j.tabs["SK-Additional"] || []),
        skAddPrices: rowsToObjects(j.tabs["SK-AddPrices"] || []),
        skAssets:    rowsToObjects(j.tabs["SK-Assets"] || []),
        skText:      rowsToObjects(j.tabs["SK-Text"] || []),
        skMapNodes:  rowsToObjects(j.tabs["SK-MapNodes"] || []),
        itPackages:  rowsToObjects(j.tabs["IT-Packages"] || []),
        spServices:  rowsToObjects(j.tabs["SP-Services"] || [])
      };
      IT  = JSON.parse(JSON.stringify(DB.itPackages)); itDirty = false; syncItBadge();
      MRP = JSON.parse(JSON.stringify(DB.mrPrices));
      MRX = JSON.parse(JSON.stringify(DB.mrMatrix));
      MT  = JSON.parse(JSON.stringify(DB.mrTiers));
      VF  = JSON.parse(JSON.stringify(DB.voFeatures));
      SP  = JSON.parse(JSON.stringify(DB.spServices));
      /* legacy schema (v4.4): plain price_1/price_2 -> move into the _en fields */
      SP.forEach(function(r){
        ["price_1","price_2"].forEach(function(f){
          if (r[f] !== undefined && String(r[f]) !== ""){
            if (!r[f + "_en"]) r[f + "_en"] = r[f];
            r[f] = "";
          }
        });
      });
      SKI = JSON.parse(JSON.stringify(DB.skIncluded));
      MN  = JSON.parse(JSON.stringify(DB.skMapNodes));
      MP  = (DB.skMapPins || []).map(function(r){
        return { market:r.market, kind:String(r.kind||"pin"),
          ref:String(r.ref!==undefined&&r.ref!==""?r.ref:(r.centre_id||"")),
          x_pct:r.x_pct, y_pct:r.y_pct, w_pct:(r.w_pct===undefined?"":r.w_pct), opt:(r.opt===undefined?"":r.opt),
          t1:(r.t1===undefined?"":r.t1), t2:(r.t2===undefined?"":r.t2), t3:(r.t3===undefined?"":r.t3), t4:(r.t4===undefined?"":r.t4) };
      });
      mdDirty = false;
      SKA = JSON.parse(JSON.stringify(DB.skAdditional));
      SKP = JSON.parse(JSON.stringify(DB.skAddPrices));
      mrDirty=false; skDirty=false; vfDirty=false; spDirty=false; idxAll();
      if (!mkt) mkt = DB.config.length ? DB.config[0].market : null;
      dirty = {}; syncSavebar();
      setStatus("Loaded \u00B7 " + new Date().toLocaleTimeString(), "ok");
      renderView();
    })
    .catch(function(e){
      setStatus("Load failed: " + e.message, "err");
      if (!DB){
        el("#main").innerHTML = edLoaderHtml("Could not reach Google Sheets: " + esc(e.message));
        var rb = el("#edLdrRetry");
        if (rb) rb.addEventListener("click", load);
        var rg = document.querySelector("#main .ring"), mk = document.querySelector("#main .mark");
        if (rg) rg.style.animationPlayState = "paused";
        if (mk) mk.style.animationPlayState = "paused";
      }
    });
}
function anyDirty(){ return Object.keys(dirty).length>0 || itDirty || mrDirty || skDirty || vfDirty || spDirty || mdDirty; }
window.addEventListener("beforeunload", function(ev){
  if (anyDirty()){ ev.preventDefault(); ev.returnValue = ""; }
});
el("#btnReload").addEventListener("click", function(){
  if (anyDirty() && !confirm("Discard ALL unsaved changes and reload?")) return;
  load();
});

/* ================= NAV + CHIPS ================= */
document.querySelectorAll("#nav button").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll("#nav button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on"); view = b.dataset.view; renderView();
  });
});
function chipsHtml(){
  return '<div class="coed-chips">' + DB.config.map(function(c){
    return '<button class="coed-chip' + (c.market === mkt ? " on" : "") + '" data-mkt="' + esc(c.market) + '">' + esc(c.market) + '</button>';
  }).join("") + '</div>';
}
function bindChips(){
  document.querySelectorAll(".coed-chip[data-mkt]").forEach(function(b){
    b.addEventListener("click", function(){ mkt = b.dataset.mkt; renderView(); });
  });
}

/* ================= VIEW: CENTRES ================= */
function centrePrices(id){ return DB.voPrices.filter(function(p){ return p.centre_id === id; })[0] || null; }
function centreMatrix(id){ return DB.mrMatrix.filter(function(m){ return m.centre_id === id; }); }
function matrixTierLabels(){
  var row = DB.mrTiers.filter(function(t){ return t.market === mkt && t.kind === "matrix"; })[0];
  if (!row) return [];
  var out = [];
  for (var i = 1; i <= 6; i++){ if (row["t" + i]) out.push(row["t" + i]); }
  return out;
}
function renderCentres(){
  var list = DB.centres.filter(function(c){ return c.market === mkt; })
    .sort(function(a,b){ return (Number(a.sort)||0) - (Number(b.sort)||0); });
  var h = chipsHtml();
  h += '<h2 class="coed-h2">Centres \u2014 ' + esc(mkt) + '</h2>';
  h += '<p class="coed-sub">Click a centre to edit its names, VO prices and meeting-room availability \u2014 they all save together, straight to the Google Sheet.</p>';
  h += '<div class="coed-grid">';
  list.forEach(function(c){
    var p = centrePrices(c.id);
    var hasPrices = p && (p.gold !== "" || p.platinum !== "" || p.diamond !== "");
    var mx = centreMatrix(c.id).some(function(m){ return ["t1","t2","t3","t4"].some(function(k){ return String(m[k]).indexOf("\u2713") > -1; }); });
    h += '<div class="coed-card" data-id="' + esc(c.id) + '">' +
      '<div class="d">' + esc(c.district_en) + '</div>' +
      '<div class="b">' + esc(c.building_en) + '</div>' +
      '<div class="a">' + esc(c.address_en) + (c.levels ? ' \u00B7 ' + esc(c.levels) : '') + '</div>' +
      '<div class="badges">' +
        (hasPrices ? '<span class="coed-badge ok">VO priced</span>' : '<span class="coed-badge warn">No VO prices \u2014 hidden</span>') +
        (mx ? '<span class="coed-badge ok">In MR matrix</span>' : '<span class="coed-badge">No meeting rooms</span>') +
      '</div></div>';
  });
  h += '<button class="coed-card coed-add" id="addCentre">+ Add centre</button></div>';
  el("#main").innerHTML = h;
  bindChips();
  document.querySelectorAll(".coed-card[data-id]").forEach(function(card){
    card.addEventListener("click", function(){ openDrawer(card.dataset.id); });
  });
  el("#addCentre").addEventListener("click", function(){ openDrawer(null); });
}

/* ---------- drawer ---------- */
function blankCentre(){
  var o = { id:"", market:mkt, sort:"", levels:"" };
  ["district","building","address"].forEach(function(f){
    LANGS.forEach(function(L){ o[f + "_" + L[0]] = ""; });
  });
  return o;
}
function openDrawer(id){
  editingNew = !id;
  var src = id ? DB.centres.filter(function(c){ return c.id === id; })[0] : blankCentre();
  editing = JSON.parse(JSON.stringify(src));
  editing._prices = JSON.parse(JSON.stringify(centrePrices(id) || { centre_id:id||"", gold:"", platinum:"", diamond:"" }));
  editing._matrix = JSON.parse(JSON.stringify(centreMatrix(id)));
  editLang = "en";
  el("#dTitle").textContent = editingNew ? "Add centre \u2014 " + mkt : src.building_en;
  el("#dDelete").style.display = editingNew ? "none" : "";
  drawDrawer();
  el("#veil").classList.add("open"); el("#drawer").classList.add("open");
}
function closeDrawer(){ el("#veil").classList.remove("open"); el("#drawer").classList.remove("open"); editing = null; }
el("#veil").addEventListener("click", closeDrawer);
el("#dClose").addEventListener("click", closeDrawer);
el("#dCancel").addEventListener("click", closeDrawer);

function drawDrawer(){
  var c = editing, L = editLang;
  var tiers = matrixTierLabels();
  var h = '<div class="coed-sec">Names &amp; address</div>';
  h += '<div class="coed-langs">' + LANGS.map(function(x){
    return '<button class="coed-lang' + (x[0] === L ? " on" : "") + '" data-l="' + x[0] + '">' + x[1] + '</button>';
  }).join("") + '</div>';
  if (L !== "en") h += '<div class="coed-hint">Blank fields fall back to English on the documents.</div>';
  [["building","Building name"],["district","District"],["address","Address"]].forEach(function(f){
    h += '<div class="coed-field"><label>' + f[1] + ' (' + L.toUpperCase() + ')</label>' +
      '<input data-f="' + f[0] + '_' + L + '" value="' + esc(c[f[0] + "_" + L]) + '"></div>';
  });
  h += '<div class="coed-row2">' +
    '<div class="coed-field"><label>Levels (display text)</label><input data-f="levels" value="' + esc(c.levels) + '" placeholder="Floor 10 or Floor 18 &amp; 19"></div>' +
    '<div class="coed-field"><label>Sort position</label><input data-f="sort" type="number" value="' + esc(c.sort) + '"></div></div>';
  h += editingNew
    ? '<div class="coed-hint">The centre ID is generated automatically from the market + building name when you save.</div>'
    : '<div class="coed-hint">Centre ID: <b>' + esc(c.id) + '</b></div>';

  h += '<div class="coed-sec">Virtual Office prices</div>';
  h += '<div class="coed-hint">Leave blank to keep this centre off the VO page.</div>';
  h += '<div class="coed-row3">' +
    ['gold','platinum','diamond'].map(function(k){
      return '<div class="coed-field"><label>' + k.charAt(0).toUpperCase() + k.slice(1) + '</label>' +
        '<input data-p="' + k + '" type="number" step="any" value="' + esc(c._prices[k]) + '"></div>';
    }).join("") + '</div>';

  h += '<div class="coed-sec">Meeting room availability</div>';
  if (tiers.length){
    h += '<div class="coed-mx" style="--mxn:' + tiers.length + '">' +
      '<div class="coed-mx-h"><div>Level</div>' + tiers.map(function(t){ return '<div>' + esc(t) + '</div>'; }).join("") + '<div></div></div>';
    c._matrix.forEach(function(m, i){
      h += '<div class="coed-mx-r"><div><input type="text" data-mxl="' + i + '" value="' + esc(m.level) + '"></div>';
      tiers.forEach(function(_, ti){
        var on = String(m["t" + (ti+1)] || "").indexOf("\u2713") > -1;
        h += '<div><input type="checkbox" data-mxr="' + i + '" data-mxt="' + (ti+1) + '"' + (on ? " checked" : "") + '></div>';
      });
      h += '<div><button class="del" data-mxdel="' + i + '" title="Remove level">&#10005;</button></div></div>';
    });
    h += '</div><button class="coed-mini" id="mxAdd">+ Add level</button>';
    h += '<div class="coed-hint">A level with no ticks stays off the matrix pages.</div>';
  } else {
    h += '<div class="coed-hint">' + esc(mkt) + ' has no availability matrix yet \u2014 enable \u201Cmatrix\u201D tiers in the Meeting Rooms view (Room size / tier labels card), save, and reopen this centre.</div>';
  }
  el("#dBody").innerHTML = h;

  document.querySelectorAll("#dBody .coed-lang").forEach(function(b){
    b.addEventListener("click", function(){ captureDrawer(); editLang = b.dataset.l; drawDrawer(); });
  });
  var add = el("#mxAdd");
  if (add) add.addEventListener("click", function(){
    captureDrawer();
    editing._matrix.push({ centre_id: editing.id, level:"", t1:"", t2:"", t3:"", t4:"" });
    drawDrawer();
  });
  document.querySelectorAll("[data-mxdel]").forEach(function(b){
    b.addEventListener("click", function(){
      captureDrawer();
      editing._matrix.splice(Number(b.dataset.mxdel), 1);
      drawDrawer();
    });
  });
}
function captureDrawer(){
  document.querySelectorAll("#dBody [data-f]").forEach(function(i){ editing[i.dataset.f] = i.value.trim(); });
  document.querySelectorAll("#dBody [data-p]").forEach(function(i){ editing._prices[i.dataset.p] = i.value.trim(); });
  document.querySelectorAll("#dBody [data-mxl]").forEach(function(i){ editing._matrix[Number(i.dataset.mxl)].level = i.value.trim(); });
  document.querySelectorAll("#dBody [data-mxr]").forEach(function(i){
    editing._matrix[Number(i.dataset.mxr)]["t" + i.dataset.mxt] = i.checked ? "\u2713" : "";
  });
}
el("#dSave").addEventListener("click", function(){
  captureDrawer();
  if (!editing.building_en){ alert("English building name is required."); return; }
  editing._matrix = editing._matrix.filter(function(m){ return m.level !== ""; });
  var btn = el("#dSave"); btn.disabled = true; setStatus("Saving centre\u2026");
  post({ action:"saveCentre", isNew: editingNew, centre: stripPrivate(editing),
         prices: editing._prices, matrix: editing._matrix })
  .then(function(j){
    setStatus(j.message || "Saved", "ok"); btn.disabled = false; closeDrawer(); load();
  })
  .catch(function(e){ setStatus("Save failed: " + e.message, "err"); btn.disabled = false; });
});
el("#dDelete").addEventListener("click", function(){
  if (!confirm("Delete '" + editing.building_en + "' and all its prices and matrix rows?")) return;
  var btn = el("#dDelete"); btn.disabled = true; setStatus("Deleting\u2026");
  post({ action:"deleteCentre", id: editing.id })
  .then(function(){ setStatus("Deleted", "ok"); btn.disabled = false; closeDrawer(); load(); })
  .catch(function(e){ setStatus("Delete failed: " + e.message, "err"); btn.disabled = false; });
});
function stripPrivate(o){
  var out = {};
  Object.keys(o).forEach(function(k){ if (k.charAt(0) !== "_") out[k] = o[k]; });
  return out;
}

/* ================= VIEW: MR PRICES ================= */
function mrMark(){ mrDirty=true; var b=el("#mrSave"); if(b)b.disabled=false; var d=el("#mrDiscard"); if(d)d.disabled=false; }
function mrTierList(kind){
  var src = MT.length ? MT : (DB.mrTiers||[]);
  var t=src.filter(function(x){return x.market===mkt && x.kind===kind;})[0]||{};
  var out=[]; for(var i=1;i<=6;i++){ if(t["t"+i]) out.push(t["t"+i]); }
  return out;
}
function centresOf(market){ return (DB.centres||[]).filter(function(c){return c.market===market;}); }
function centreName(id){
  var c=(DB.centres||[]).filter(function(x){return x.id===id;})[0];
  return c ? (c.building_en||c.id) : id;
}
function renderMrPrices(){
  idxAll();
  var h = chipsHtml();
  h += '<h2 class="coed-h2">Meeting Rooms <span style="font-size:12px;color:var(--co-muted);font-weight:600">\u2014 '+esc(mkt)+'</span></h2>';
  h += '<div class="coed-help"><b>What you see is what the PDF shows.</b> Click any price or room name to edit it in place. ' +
       'Hover a row for delete. Use the buttons to add rooms/prices \u2014 for the whole market (\u201CAll centres\u201D) or one centre. ' +
       'The <b>photo</b> on each room feeds the One-Pager meeting-room page later. Press <b>Save Meeting Rooms</b> when done.</div>';
  h += wLangTabs();
  h += '<div class="wzsave"><button class="coed-btn primary" id="mrSave"'+(mrDirty?"":" disabled")+'>Save Meeting Rooms</button>'+
       '<button class="coed-btn" id="mrDiscard"'+(mrDirty?"":" disabled")+'>Discard</button></div>';

  ["Internal","External"].forEach(function(client){
    var rows=MRP.filter(function(p){return p.market===mkt && p.client===client;});
    h += '<div class="wz"><div class="secband"><div class="tt">'+client+' Meeting Room Pricing</div></div>';
    h += '<table class="mrtable"><tr><th style="width:34%">Room / tier</th><th style="width:14%">Scope</th><th>Per 30 mins</th><th>Per day</th><th style="width:70px">Photo</th><th style="width:8px"></th></tr>';
    var scopes=["all"].concat(centresOf(mkt).map(function(c){return c.id;}));
    scopes.forEach(function(sc){
      rows.filter(function(p){return p.scope===sc;}).forEach(function(p){
        var th = p.image ? driveThumb(p.image) : "";
        h += '<tr class="mrr"><td>'+ce("MRP",p,"tier_en","", "Room name")+'</td>'+
          '<td style="color:#999;font-size:10.5px">'+(sc==="all"?"All centres":esc(centreName(sc)))+'</td>'+
          '<td class="mrprice">'+ce("MRP",p,"per_30_mins","mrprice","\u2014")+'</td>'+
          '<td class="mrprice">'+ce("MRP",p,"per_day","mrprice","\u2014")+'</td>'+
          '<td><span class="mrimg" data-mrimg="'+p.__i+'" style="'+(th?"background-image:url(\''+th+'\')":"")+'">'+(th?"":"+ photo")+'</span></td>'+
          '<td><span class="rowops"><button class="del" data-mrdel="'+p.__i+'">\u00D7</button></span></td></tr>';
      });
    });
    h += '</table>';
    h += '<div style="display:flex;gap:8px;margin-top:8px;align-items:center">'+
      '<select class="coed-btn" style="font-size:12px" data-mrscope="'+client+'"><option value="all">All centres</option>'+
      centresOf(mkt).map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.building_en||c.id)+'</option>';}).join("")+'</select>'+
      '<button class="addbar" style="margin:0" data-mradd="'+client+'">+ Add '+client.toLowerCase()+' room / price row</button></div>';
    h += '</div>';
  });

  /* tier labels (drives the columns of both tables) */
  h += '<div class="wz"><div class="secband"><div class="tt">Room size / tier labels</div></div>'+
    '<p class="hint" style="font-size:11px;color:#999;margin:8px 0">\u201CPricing\u201D tiers are the column headers of the price tables above; \u201Cmatrix\u201D tiers are the columns of the availability matrix below. Fill EN first, then use the language tabs to translate. A market with no matrix tiers has no availability page. New sizes appear as toggles below immediately \u2014 remember to press Save when done.</p>';
  ["pricing","matrix"].forEach(function(kind){
    var trow=MT.filter(function(t){return t.market===mkt && t.kind===kind;})[0];
    h += '<div style="display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap"><span style="font-size:10px;font-weight:800;width:56px;text-transform:uppercase;color:#999">'+kind+'</span>';
    if (trow){
      for (var ti=1; ti<=6; ti++){
        h += '<span style="flex:0 0 118px;border:1px dashed #EEE;border-radius:6px;padding:3px 6px;font-size:12px">'+
          ce("MT",trow,"t"+ti,"", String(trow["t"+ti]||("tier "+ti)), WLANG!=="en")+'</span>';
      }
    } else {
      h += '<button class="addbar" style="margin:0" data-mtadd="'+kind+'">+ enable '+kind+' tiers for '+esc(mkt)+'</button>';
    }
    h += '</div>';
  });
  h += '</div>';

  /* room availability, grouped by centre */
  var mTiers = mrTierList("matrix");
  h += '<div class="wz"><div class="secband"><div class="tt">Room availability by centre</div></div>';
  if (!mTiers.length){
    var hasMatrixRow = MT.some(function(t){ return t.market===mkt && t.kind==="matrix"; });

var TEXT_GROUPS = [
  ["Section titles", /^mr\.(internal|external)\.title|^mr\.allcentres/, null],
  ["Row labels", /^mr\.per/, null],
  ["Video conferencing", /^vc\./, "vc"],
  ["Terms and Conditions", /^tc\./, "tc"],
  ["Included with booking", /^incl\./, "incl"],
  ["Available on request", /^avail\./, "avail"],
  ["Page titles & formats (all markets)", /^title\.|^level\./, null]
];
function blankTextRow(key){
  var o = { market:mkt, centre_id:"", key:key, __new:true };
  LANGS.forEach(function(L){ o["text_" + L[0]] = ""; });
  return o;
}
function findText(market, centre, key){
  return DB.texts.filter(function(t){
    return t.market === market && String(t.centre_id) === String(centre) && t.key === key;
  })[0];
}
function renderTexts(){
  var h = chipsHtml();
  h += '<h2 class="coed-h2">Texts &amp; T&amp;C \u2014 ' + esc(mkt) + '</h2>';
  h += '<p class="coed-sub">Everything written on the documents. For T&amp;C and the two \u201Cincluded / on request\u201D cards: <b>don\u2019t type \u2022</b> (the PDF adds the dot itself); <b>Enter</b> inside a cell makes a real line break on the PDF; and once a language has its own lines, <b>an empty cell in that language is simply not shown</b> \u2014 English is only used when a language has no translations at all. Use \u00D7 to delete a line everywhere.</p>';
  var shown = {};
  function textTable(rows, withMarket){
    var t2 = '<table class="coed-table"><tr><th style="width:9%">Key</th>' +
      (withMarket ? '<th style="width:6%">Market</th>' : '') +
      LANGS.map(function(L){ return '<th>' + L[1] + '</th>'; }).join("") + '<th style="width:26px"></th></tr>';
    rows.forEach(function(t){
      var key = ["tx", t.market, t.centre_id, t.key].join("|");
      shown[key] = 1;
      t2 += '<tr><td>' + esc(t.key) + (t.__new ? ' <span class="coed-savebadge">new</span>' : '') + '</td>' +
        (withMarket ? '<td style="color:#999;font-size:11px">' + esc(t.market) + '</td>' : '') +
        LANGS.map(function(L){
          return '<td data-cell="' + esc(key) + '|text_' + L[0] + '"><textarea>' + esc(t["text_" + L[0]]) + '</textarea></td>';
        }).join("") +
        '<td style="vertical-align:middle"><button class="coed-del" data-txdel="' + esc([t.market, t.centre_id, t.key].join("|")) + '" title="Delete this line">\u00D7</button></td></tr>';
    });
    return t2 + '</table>';
  }
  TEXT_GROUPS.forEach(function(g){
    var rows = DB.texts.filter(function(t){
      var m = (g[1].source.indexOf("title\\.") > -1) ? (t.market === "all") : (t.market === mkt);
      return m && g[1].test(t.key);
    });
    if (!rows.length && !g[2]) return;
    h += '<div class="coed-group">' + g[0] + '</div>';
    if (rows.length) h += textTable(rows, false);
    if (g[2]) h += '<button class="addbar" style="margin-top:6px" data-txadd="' + g[2] + '">+ add line</button>';
  });
  /* country names for the Global Network page — offered even before the rows exist */
  var COUNTRY_ED = { "Hong Kong":"Hong Kong", "Japan":"Japan", "Australia":"Australia",
    "Singapore":"Singapore", "Manila":"Philippines", "Kuala Lumpur":"Malaysia", "Ho Chi Minh City":"Vietnam" };
  var cnames = [], seenCn = {};
  DB.config.forEach(function(c2){
    var cn = COUNTRY_ED[c2.market] || c2.market;
    if (!seenCn[cn]){ seenCn[cn] = 1; cnames.push(cn); }
  });
  cnames.forEach(function(cn){
    if (!findText("all", "", "country." + cn)){
      var r0 = blankTextRow("country." + cn);
      r0.market = "all"; r0.text_en = cn;
      DB.texts.push(r0);
    }
  });
  var cRows = DB.texts.filter(function(t){ return t.market === "all" && t.key.indexOf("country.") === 0; });
  if (cRows.length){
    h += '<div class="coed-group">Global Network \u2014 country names</div>' + textTable(cRows, false);
  }
  var rest = DB.texts.filter(function(t){
    return (t.market === mkt || t.market === "all") &&
      !shown[["tx", t.market, t.centre_id, t.key].join("|")];
  });
  h += '<div class="coed-group">Other texts</div>';
  if (rest.length) h += textTable(rest, true);
  h += '<div style="display:flex;gap:8px;margin-top:6px;align-items:center">' +
    '<input id="txNewKey" placeholder="new key, e.g. vo.head.gold" style="font-family:inherit;font-size:12px;padding:7px 10px;border:1px solid var(--co-line);border-radius:8px;width:240px">' +
    '<button class="addbar" style="margin:0" id="txAddCustom">+ add text row for ' + esc(mkt) + '</button></div>';
  el("#main").innerHTML = h;
  bindChips(); bindCells(); bindTxAdd();
}
function bindTxAdd(){
  document.querySelectorAll("[data-txdel]").forEach(function(b){
    b.addEventListener("click", function(){
      var p = b.dataset.txdel.split("|");
      var row = findText(p[0], p[1], p[2]);
      if (!row) return;
      var dropDirty = function(){
        Object.keys(dirty).forEach(function(k){
          if (k.indexOf(["tx", p[0], p[1], p[2]].join("|") + "|") === 0) delete dirty[k];
        });
        syncSavebar();
      };
      if (row.__new){
        DB.texts.splice(DB.texts.indexOf(row), 1);
        dropDirty(); renderTexts(); return;
      }
      var scope = p[0] === "all" ? "ALL markets" : p[0];
      if (!confirm("Delete '" + p[2] + "' (" + scope + ")?\nThis removes the line from the documents immediately.")) return;
      setStatus("Deleting\u2026");
      post({ action:"deleteRows", tab:"Text", rows:[{ market:p[0], centre_id:p[1], key:p[2] }] })
      .then(function(j){
        DB.texts.splice(DB.texts.indexOf(row), 1);
        dropDirty(); renderTexts();
        setStatus(j.message || "Deleted", "ok");
      })
      .catch(function(e){ setStatus("Delete failed: " + e.message, "err"); });
    });
  });
  document.querySelectorAll("[data-txadd]").forEach(function(b){
    b.addEventListener("click", function(){
      var prefix = b.dataset.txadd, maxN = 0;
      DB.texts.forEach(function(t){
        if (t.market !== mkt) return;
        var m = t.key.match(new RegExp("^" + prefix + "\\.(\\d+)$"));
        if (m) maxN = Math.max(maxN, Number(m[1]));
      });
      DB.texts.push(blankTextRow(prefix + "." + (maxN + 1)));
      renderTexts();
      setStatus("New line added \u2014 fill in EN (at least), then press Save all", "ok");
    });
  });
  var bc = el("#txAddCustom");
  if (bc) bc.addEventListener("click", function(){
    var key = el("#txNewKey").value.trim();
    if (!key){ setStatus("Type a key first (e.g. vo.head.gold)", "err"); return; }
    if (key.indexOf("|") > -1){ setStatus("Keys cannot contain |", "err"); return; }
    if (findText(mkt, "", key)){ setStatus("'" + key + "' already exists for " + mkt, "err"); return; }
    DB.texts.push(blankTextRow(key));
    renderTexts();
    setStatus("Row '" + key + "' added \u2014 fill it in, then press Save all", "ok");
  });
}

function mdNudge(dx, dy){
  if (!mdSel || ["station","line","block","pin","card"].indexOf(mdSel.kind) < 0) return;
  var pos = mdPosXY(mdSel.kind, mdSel.ref) || {};
  var box = el("#mdCanvas");
  /* start from the element's current rendered spot when no stored value yet */
  var elm = box ? box.querySelector('[data-md="'+(mdSel.kind+"|"+mdSel.ref).replace(/"/g,'\\"')+'"]') : null;
  var bx = 0, by = 0;
  if (elm && box){
    var r = box.getBoundingClientRect(), er = elm.getBoundingClientRect();
    bx = (er.left + (mdSel.kind==="pin"?er.width/2:0) - r.left) / r.width * 100;
    by = (er.top + (mdSel.kind==="pin"?er.height:(mdSel.kind==="station"||mdSel.kind==="line"?er.height/2:0)) - r.top) / r.height * 100;
    if (mdSel.kind==="station") bx = (er.left + er.width/2 - r.left) / r.width * 100;
  }
  var x = pos.x !== undefined && pos.x !== null ? pos.x : bx;
  var y = pos.y !== undefined && pos.y !== null ? pos.y : by;
  if (mdSel.kind === "line") mdSet("line", mdSel.ref, null, y + dy);
  else if (mdSel.kind === "station"){
    var ax = elm ? (elm.dataset.axis || "x") : "x";
    if (ax === "y") mdSet("station", mdSel.ref, null, y + dy);
    else mdSet("station", mdSel.ref, x + dx, null);      /* stays ON the line */
  }
  else mdSet(mdSel.kind, mdSel.ref, x + dx, y + dy);
  mdRedraw();
}
document.addEventListener("keydown", function(ev){

  if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
  var st = ev.shiftKey ? 1 : 0.2;
  var map2 = { ArrowLeft:[-st,0], ArrowRight:[st,0], ArrowUp:[0,-st], ArrowDown:[0,st] };
  if (map2[ev.key]){ ev.preventDefault(); mdNudge(map2[ev.key][0], map2[ev.key][1]); }
});
function mdFit(){
  var box = el("#mdCanvas"), wrap = el("#mdFit");
  if (!box || !wrap || !wrap.parentNode) return;
  var avail = wrap.parentNode.getBoundingClientRect().width;
  var s = Math.min(1, (avail >= 730 ? 698 : Math.max(avail, 260)) / 698);
  box.style.transform = s < 1 ? "scale(" + s + ")" : "";
  box.style.transformOrigin = "top left";
  wrap.style.width = Math.round(698 * s) + "px";
  wrap.style.height = Math.round((parseFloat(box.style.height) || box.offsetHeight) * s) + "px";
}

function bindMapd(box, isTransit){
  box.addEventListener("pointerdown", function(ev){
    var elm = ev.target && ev.target.closest ? ev.target.closest("[data-md]") : null;
    if (!elm){ mdSel = null; mdRedraw(); return; }
    ev.preventDefault();
    var parts = elm.dataset.md.split("|");
    var kind = parts.shift(), ref = parts.join("|");
    var ckind = elm.dataset.ckind || "block";
    mdSel = (kind === "connstart" || kind === "connend") ? { kind:ckind, ref:ref } : { kind:kind, ref:ref };
    var rect = box.getBoundingClientRect();
    var orig = elm.getBoundingClientRect();
    var sx = ev.clientX, sy = ev.clientY, moved = false;
    var axis = elm.dataset.axis || "";
    function mv(e){
      var dx = e.clientX-sx, dy = e.clientY-sy;
      if (Math.abs(dx)>2 || Math.abs(dy)>2) moved = true;
      if (kind==="line"){ dx = 0; }
      else if (kind==="station"){ if (axis==="y") dx = 0; else dy = 0; }
      elm.style.marginLeft = dx+"px";
      elm.style.marginTop = dy+"px";
    }
    function up(e){
      document.removeEventListener("pointermove", mv);
      document.removeEventListener("pointerup", up);
      elm.style.marginLeft = "";
      elm.style.marginTop = "";
      if (!moved){ mdRedraw(); return; }
      var dx = e.clientX-sx, dy = e.clientY-sy;
      var cx = orig.left + orig.width/2, cy = orig.top + orig.height/2;
      if (kind==="pin"){ cx = orig.left + orig.width/2; cy = orig.top + orig.height; }
      if (kind==="block" || kind==="card"){ cx = orig.left; cy = orig.top; }
      var nx = (cx + dx - rect.left)/rect.width*100;
      var ny = (cy + dy - rect.top)/rect.height*100;
      nx = Math.max(0, Math.min(99, nx)); ny = Math.max(0, Math.min(99, ny));
      if (kind==="line") mdSet("line", ref, null, ny);
      else if (kind==="station"){
        if (axis==="y") mdSet("station", ref, null, ny);   /* branch stations slide on the branch */
        else mdSet("station", ref, nx, null);              /* main-line stations stay ON the line */
      }
      else if (kind==="connstart"){
        mdSetOpt(ckind, ref, "sx", String(Math.round(nx*10)/10));
        mdSetOpt(ckind, ref, "sy", String(Math.round(ny*10)/10));
        mdSel = { kind:ckind, ref:ref };
      }
      else if (kind==="connend"){
        mdSetOpt(ckind, ref, "ex", String(Math.round(nx*10)/10));
        mdSetOpt(ckind, ref, "ey", String(Math.round(ny*10)/10));
        mdSel = { kind:ckind, ref:ref };
      }
      else if (kind==="connvia"){
        var oV = connOpt((mdPosXY(ckind, ref)||{}).opt);
        var arrV = connVia(oV);
        var vi = Number(elm.dataset.vidx)||0;
        if (arrV[vi]) arrV[vi] = [Math.round(nx*10)/10, Math.round(ny*10)/10];
        mdSetOpt(ckind, ref, "via", viaStr(arrV));
        mdSel = { kind:ckind, ref:ref };
      }
      else mdSet(kind, ref, nx, ny);
      mdRedraw();
    }
    document.addEventListener("pointermove", mv);
    document.addEventListener("pointerup", up);
  });
}

/* big images are resized (max 1600px) and re-encoded as JPEG before upload */
function compressImage(f, cb){
  if (f.size <= 600 * 1024){                       /* small enough: upload as-is */
    var rd0 = new FileReader();
    rd0.onload = function(){ cb({ b64:String(rd0.result).split(",")[1], mime:f.type, name:f.name, note:"" }); };
    rd0.onerror = function(){ cb(null); };
    rd0.readAsDataURL(f);
    return;
  }
  var url = URL.createObjectURL(f);
  var img = new Image();
  img.onload = function(){
    URL.revokeObjectURL(url);
    try {
      var MAXD = 1600;
      var sc = Math.min(1, MAXD / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
      var cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      var cx = cv.getContext("2d");
      cx.fillStyle = "#FFFFFF"; cx.fillRect(0, 0, w, h);   /* transparency -> white (JPEG) */
      cx.drawImage(img, 0, 0, w, h);
      var q = 0.85, out = cv.toDataURL("image/jpeg", q);
      while (out.length * 3 / 4 > 1400 * 1024 && q > 0.5){ q -= 0.1; out = cv.toDataURL("image/jpeg", q); }
      var kb0 = Math.round(f.size / 1024), kb1 = Math.round(out.length * 3 / 4 / 1024);
      cb({ b64: out.split(",")[1], mime: "image/jpeg",
           name: f.name.replace(/\.[a-z0-9]+$/i, "") + ".jpg",
           note: " (compressed " + kb0 + "\u2009KB \u2192 " + kb1 + "\u2009KB)" });
    } catch (e){ cb(null); }
  };
  img.onerror = function(){ URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}
function uploadAssetFile(key, f, busyEl, busyText){
  if (!f || f.type.indexOf("image/") !== 0){ setStatus("Not an image file", "err"); return; }
  var revert = busyEl ? busyEl.textContent : "";
  if (busyEl){ busyEl.classList.add("busy"); busyEl.textContent = busyText || "Uploading\u2026"; }
  compressImage(f, function(res){
    if (!res){
      if (busyEl){ busyEl.classList.remove("busy"); busyEl.textContent = revert; }
      setStatus("Could not read that image", "err");
      return;
    }
    post({ action:"uploadImage", filename: key + "-" + res.name, mimeType: res.mime, assetKey: key, dataBase64: res.b64 })
    .then(function(j){
      var row = (DB.skAssets || []).filter(function(r){ return r.key === key; })[0];
      if (row){ row.drive_file_id = j.id; delete row.__local; }
      else (DB.skAssets = DB.skAssets || []).push({ key:key, drive_file_id:j.id, note:"" });
      var card = document.querySelector('[data-askey="' + key + '"] .th');
      if (card){ card.style.backgroundImage = "url('" + driveThumb(j.id) + "')"; card.textContent = ""; }
      if (busyEl){ busyEl.classList.remove("busy"); busyEl.textContent = "\u2191 Uploaded \u2713"; }
      setStatus("Saved to Google Drive and wired to " + key + (res.note || ""), "ok");
      renderView();
    })
    .catch(function(e){
      if (busyEl){ busyEl.classList.remove("busy"); busyEl.textContent = revert; }
      setStatus("Upload failed: " + e.message, "err");
    });
  });
}
function makeDroppable(el, getKey){
  ["dragover","dragenter"].forEach(function(evn){ el.addEventListener(evn, function(e){ e.preventDefault(); el.style.outline = "2px dashed var(--co-orange)"; }); });
  ["dragleave","dragend"].forEach(function(evn){ el.addEventListener(evn, function(e){ e.preventDefault(); el.style.outline = ""; }); });
  el.addEventListener("drop", function(e){
    e.preventDefault(); el.style.outline = "";
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) uploadAssetFile(getKey(), f, el.querySelector(".coed-upbtn") || el);
  });
}

          renderView(); setStatus("Card \u201C" + key + "\u201D deleted", "ok");
        };

    });
  });
  var aa = el("#asAddCard");

    renderView();

  });
}

    sv.disabled=true; setStatus("Saving VO Features\u2026");
    saveTabs([
      {tab:"VO-Features", header:tabHeader(VF,["set","row_type","label_en","label_tc","label_sc","label_jp","label_vi","gold","platinum","diamond"]), rows:VF}
    ], function(){ vfDirty=false; setStatus("VO Features saved","ok"); load(); })
    .catch(function(e){ sv.disabled=false; setStatus("Save failed: "+e.message,"err"); });
  });
  var dc=el("#vfDiscard"); if(dc) dc.addEventListener("click",function(){
    if(!confirm("Discard feature changes?")) return;
    VF=JSON.parse(JSON.stringify(DB.voFeatures)); vfDirty=false; idxAll(); renderVoFeatures();
  });
}

/* ================= WYSIWYG SHARED ================= */
var WLANG = localStorage.getItem("coed_wlang") || "en";
var MRP=[], MRX=[], MT=[], VF=[], SP=[], SKI=[], SKA=[], SKP=[], MN=[], MP=[], mrDirty=false, skDirty=false, vfDirty=false, spDirty=false, mdDirty=false;
function wLangTabs(){
  var o=[["en","English"],["tc","繁體"],["sc","简体"],["jp","日本語"],["vi","Tiếng Việt"]];
  return '<div class="wzlang">'+o.map(function(x){
    return '<button data-wl="'+x[0]+'" class="'+(WLANG===x[0]?"on":"")+'">'+x[1]+'</button>';}).join("")+'</div>';
}
function bindWLang(){
  document.querySelectorAll("[data-wl]").forEach(function(b){
    b.addEventListener("click",function(){WLANG=b.dataset.wl;localStorage.setItem("coed_wlang",WLANG);renderView();});
  });
}
function ce(arr,row,field,cls,ph,langed){
  var f = langed ? field+"_"+WLANG : field;
  var v = row[f]===undefined?"":String(row[f]);
  var fallback = langed && WLANG!=="en" && !v ? (row[field+"_en"]||"") : "";
  return '<span class="'+(cls||"")+'" contenteditable data-m="'+arr+'|'+row.__i+'|'+f+'" data-ph="'+esc(fallback||ph||"\u2026")+'">'+esc(v)+'</span>';
}
function idxAll(){[["IT",IT],["MRP",MRP],["MRX",MRX],["MT",MT],["VF",VF],["SP",SP],["SKI",SKI],["SKA",SKA],["SKP",SKP],["MN",MN]].forEach(function(p){
  p[1].forEach(function(r,i){r.__i=i;});});}
function modelOf(n){return {IT:IT,MRP:MRP,MRX:MRX,MT:MT,VF:VF,SP:SP,SKI:SKI,SKA:SKA,SKP:SKP,MN:MN}[n];}
function bindCE(dirtyFn){
  document.querySelectorAll("[data-m]").forEach(function(elm){
    elm.addEventListener("input",function(){
      var p=elm.dataset.m.split("|");
      modelOf(p[0])[Number(p[1])][p[2]]=elm.textContent;
      dirtyFn(p[0]);
    });
    elm.addEventListener("keydown",function(ev){ if(ev.key==="Enter" && !ev.isComposing && ev.keyCode!==229){ev.preventDefault();elm.blur();} });
  });
}
function tabHeader(rows, base){
  var keys={}; base.forEach(function(k){keys[k]=1;});
  rows.forEach(function(r){Object.keys(r).forEach(function(k){ if(k.charAt(0)!=="_")keys[k]=1;});});
  return base.concat(Object.keys(keys).filter(function(k){return base.indexOf(k)<0;}));
}
function saveTabs(list, after){
  var chain=Promise.resolve();
  list.forEach(function(t){
    chain=chain.then(function(){
      var rows=t.rows.map(function(r){return t.header.map(function(h){return r[h]===undefined?"":r[h];});});
      return post({action:"saveTab", tab:t.tab, header:t.header, rows:rows});
    });
  });
  return chain.then(after);
}

/* ================= VIEW: IT & TELECOM ================= */
var IT_SECS = [["wifi_banner","Compass Wi-Fi banner"],["enterprise","Enterprise Secured Internet"],
  ["standard","Standard Internet"],["rack","Server Rack / IT Consultancy"],
  ["telecom","Telecommunication Services"],["bundle","IT&T Package"]];
function syncItBadge(){
  var b = el("#itNavBadge");
  if (b){ b.style.display = itDirty ? "inline-block" : "none"; b.textContent = "\u25CF"; }
}
function itRowsFor(market, sec){
  return IT.filter(function(r){ return r.market === market && r.section === sec; })
    .sort(function(a,b){ return (Number(a.sort)||0) - (Number(b.sort)||0); });
}
function itRenumber(){
  IT_SECS.forEach(function(s){
    DB.config.forEach(function(c){
      itRowsFor(c.market, s[0]).forEach(function(r, i){ r.sort = (i + 1) * 10; });
    });
  });
}
function renderIt(){
  idxAll();
  var h = chipsHtml();
  h += '<h2 class="coed-h2">IT &amp; Telecommunications <span style="font-size:12px;color:var(--co-muted);font-weight:600">\u2014 '+esc(mkt)+'</span></h2>';
  h += '<div class="coed-help"><b>What you see is what the PDF shows.</b> Pick a language, then click any text or price on the page and type. ' +
       'Empty cells show the English text greyed \u2014 type over it to translate. Hover a row for \u00D7 / \u2191\u2193. Press <b>Save IT changes</b> when done.</div>';
  h += wLangTabs();
  h += '<div class="wzsave"><button class="coed-btn primary" id="itSave"'+(itDirty?"":" disabled")+'>Save IT changes</button>'+
       '<button class="coed-btn" id="itDiscard"'+(itDirty?"":" disabled")+'>Discard</button></div>';
  h += '<div class="wz">';
  var cur=(DB.config.filter(function(c){return c.market===mkt;})[0]||{}).currency||"";
  IT_SECS.forEach(function(s){
    var rows=itRowsFor(mkt,s[0]);
    var tiers=rows.filter(function(r){return r.row_type==="tier";});
    var nT=tiers.length||1, colW=nT>1?96:170;
    var pc='flex:0 0 '+colW+'px;width:'+colW+'px;';
    var secRow=rows.filter(function(r){return r.row_type==="section";})[0];
    if (secRow){
      h += '<div class="secband"><div class="tt">'+ce("IT",secRow,"label","","Section title",true)+'</div>'+
        '<div class="pu" style="flex:0 0 '+(nT*colW)+'px">Price/unit ('+esc(cur)+')</div></div>';
    } else if (s[0]==="wifi_banner" && rows.length){
      h += '<div class="secband" style="background:none;border-top:0;margin:0"><div class="tt" style="font-size:13px;color:#999;padding:6px 0">'+s[1]+'</div></div>';
    }
    if (tiers.length>1){
      h += '<div class="tierrow"><div class="sp"></div>'+tiers.map(function(t){
        var k=String(t.note||"").toLowerCase();
        return '<div class="tiercell '+k+'" style="'+pc+'"><div class="k">'+k.toUpperCase()+'</div>'+
          '<div class="l">'+ce("IT",t,"label","","column label",true)+'</div></div>';}).join("")+'</div>';
    }
    var body=rows.filter(function(r){return ["group","bullet","option"].indexOf(r.row_type)>-1;});
    var i2=0, gi=0;
    while(i2<body.length){
      if(body[i2].row_type!=="group"){i2++;continue;}
      var g=body[i2]; i2++;
      var kids=[];
      while(i2<body.length && body[i2].row_type!=="group"){kids.push(body[i2]); i2++;}
      var bullets=kids.filter(function(k){return k.row_type==="bullet";});
      var opts=kids.filter(function(k){return k.row_type==="option";});
      var perBullet=bullets.some(function(b){return String(b.price_a||"")!=="";});
      h += '<div class="grp'+(gi===0?" first":"")+'">'+
        '<div class="gl">'+ce("IT",g,"label","","Package name",true)+'</div>'+
        '<div class="gb">'+bullets.map(function(b){
          return '<div class="bl"><span class="t">'+ce("IT",b,"label","","bullet line",true)+'</span>'+
            (perBullet||!String(g.price_a||"") ? '<span class="bp">'+ce("IT",b,"price_a","","price?")+'</span>' : "")+
            '<span class="rowops"><button class="del" data-itdel="'+b.__i+'">\u00D7</button></span></div>';
        }).join("")+
        '<button class="addbar" style="font-size:10px;padding:2px 8px" data-itadd="bullet|'+s[0]+'|'+g.__i+'">+ bullet</button> '+
        '<button class="addbar" style="font-size:10px;padding:2px 8px" data-itadd="option|'+s[0]+'|'+g.__i+'">+ option</button>'+
        '</div>';
      if(!perBullet || String(g.price_a||"")!==""){
        var vals=nT>1?[["price_a","ta"],["price_b","tb"],["price_c","tc"]].slice(0,nT):[["price_a",""]];
        h += vals.map(function(v){
          return '<div class="pcell '+v[1]+'" style="'+pc+'">'+ce("IT",g,v[0],"","\u2014")+'</div>';}).join("");
      }
      h += '<span class="rowops"><button data-itmv="'+g.__i+'|up">\u2191</button><button data-itmv="'+g.__i+'|dn">\u2193</button><button class="del" data-itdel="'+g.__i+'">\u00D7</button></span>';
      h += '</div>';
      opts.forEach(function(o){
        h += '<div class="optrow"><div class="ol">'+ce("IT",o,"label","","option line",true)+'</div>'+
          '<div class="op" style="flex-basis:'+(nT*colW)+'px;width:'+(nT*colW)+'px">'+ce("IT",o,"price_a","","price")+'</div>'+
          '<span class="rowops"><button class="del" data-itdel="'+o.__i+'">\u00D7</button></span></div>';
      });
      gi++;
    }
    h += '<button class="addbar" data-itadd="group|'+s[0]+'">+ Add group to '+s[1]+'</button>';
  });
  h += '</div>';
  el("#main").innerHTML = h;
  bindChips(); bindWLang(); bindCE(function(){itMarkDirty();}); bindItView();
}
function itMarkDirty(){ itDirty = true; syncItBadge(); var b = el("#itSave"); if (b) b.disabled = false; var d = el("#itDiscard"); if (d) d.disabled = false; }
function bindItView(){
  document.querySelectorAll("[data-itdel]").forEach(function(b){
    b.addEventListener("click", function(){
      var idx = Number(b.dataset.itdel), row = IT[idx];
      if (row.row_type === "group"){
        if (!confirm("Delete this group and all its rows?")) return;
        var rows = itRowsFor(row.market, row.section);
        var pos = rows.indexOf(row), kill = [row];
        for (var i = pos + 1; i < rows.length && rows[i].row_type !== "group"; i++) kill.push(rows[i]);
        IT = IT.filter(function(r){ return kill.indexOf(r) === -1; });
      } else {
        IT.splice(idx, 1);
      }
      itRenumber(); itMarkDirty(); renderIt();
    });
  });
  document.querySelectorAll("[data-itadd]").forEach(function(b){
    b.addEventListener("click", function(){
      var p = b.dataset.itadd.split("|");
      var blank = { market: mkt, section: p[1], sort: 0, row_type: p[0],
        label_en:"", label_tc:"", label_sc:"", label_jp:"", label_vi:"", price_a:"", price_b:"", price_c:"", note:"" };
      if (p[0] === "group"){
        IT.push(blank);
      } else {
        var g = IT[Number(p[2])];
        var rows = itRowsFor(g.market, g.section);
        var pos = rows.indexOf(g), last = g;
        for (var i = pos + 1; i < rows.length && rows[i].row_type !== "group"; i++) last = rows[i];
        blank.sort = (Number(last.sort) || 0) + 1;      /* renumber fixes spacing */
        IT.splice(IT.indexOf(last) + 1, 0, blank);
      }
      itRenumber(); itMarkDirty(); renderIt();
    });
  });
  document.querySelectorAll("[data-itmv]").forEach(function(b){
    b.addEventListener("click", function(){
      var p = b.dataset.itmv.split("|");
      var g = IT[Number(p[0])];
      var rows = itRowsFor(g.market, g.section);
      var gs = rows.filter(function(r){ return r.row_type === "group"; });
      var gi = gs.indexOf(g), swap = p[1] === "up" ? gs[gi - 1] : gs[gi + 1];
      if (!swap) return;
      var t = g.sort; g.sort = swap.sort; swap.sort = t;
      /* move whole blocks: easiest = rebuild sort by new group order */
      var order = rows.filter(function(r){ return r.row_type === "tier"; });
      gs.sort(function(a,b){ return (Number(a.sort)||0) - (Number(b.sort)||0); });
      gs.forEach(function(gg){
        order.push(gg);
        var pos = rows.indexOf(gg);
        for (var i = pos + 1; i < rows.length && rows[i].row_type !== "group"; i++)
          if (rows[i].row_type !== "tier") order.push(rows[i]);
      });
      order.forEach(function(r, i){ r.sort = (i + 1) * 10; });
      itMarkDirty(); renderIt();
    });
  });
  var sv = el("#itSave");
  if (sv) sv.addEventListener("click", function(){
    sv.disabled = true; setStatus("Saving IT & Telecom\u2026");
    var HEAD = ["market","section","sort","row_type","label_en","label_tc","label_sc","label_jp","label_vi","price_a","price_b","price_c","note"];
    itRenumber();
    var rows = IT.slice().sort(function(a,b){
      var so = function(r){ return [r.market, IT_SECS.map(function(s){return s[0];}).indexOf(r.section), Number(r.sort)||0]; };
      var x = so(a), y = so(b);
      return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : (x[1] - y[1]) || (x[2] - y[2]);
    }).map(function(r){ return HEAD.map(function(hh){ return r[hh] === undefined ? "" : r[hh]; }); });
    post({ action:"saveTab", tab:"IT-Packages", header: HEAD, rows: rows })
    .then(function(){ itDirty = false; syncItBadge(); setStatus("IT & Telecom saved", "ok"); load(); })
    .catch(function(e){ sv.disabled = false; setStatus("Save failed: " + e.message, "err"); });
  });
  var dc = el("#itDiscard");
  if (dc) dc.addEventListener("click", function(){
    if (!confirm("Discard IT & Telecom changes?")) return;
    IT = JSON.parse(JSON.stringify(DB.itPackages)); itDirty = false; syncItBadge(); renderIt();
  });
}

/* ================= INLINE DIRTY TRACKING + SAVE ALL ================= */
function applyDirty(){
  Object.keys(dirty).forEach(function(k){
    var sel = '[data-cell="' + k.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"]';
    var td; try { td = document.querySelector(sel); } catch(e){ td = null; }
    if (!td) return;
    var inp = td.querySelector("input,textarea");
    if (inp){ inp.value = dirty[k]; td.classList.add("dirty"); }
  });
}
function bindCells(){
  applyDirty();
  document.querySelectorAll("[data-cell] input, [data-cell] textarea").forEach(function(inp){
    inp.addEventListener("input", function(){
      var td = inp.closest("[data-cell]");
      dirty[td.dataset.cell] = inp.value;
      td.classList.add("dirty");
      syncSavebar();
    });
  });
}
function syncSavebar(){
  var n = Object.keys(dirty).length;
  el("#savebarText").textContent = n + " unsaved change" + (n === 1 ? "" : "s");
  el("#savebar").classList.toggle("show", n > 0);
}
el("#sbDiscard").addEventListener("click", function(){ dirty = {}; syncSavebar(); renderView(); });
el("#sbSave").addEventListener("click", function(){
  var edits = [], newRows = [];
  Object.keys(dirty).forEach(function(k){
    var parts = k.split("|");
    var field = parts.pop();
    if (parts[0] === "tx"){
      var row = findText(parts[1], parts[2], parts[3]);
      if (row && row.__new){
        row[field] = dirty[k];
        if (newRows.indexOf(row) < 0) newRows.push(row);
        return;                       /* created via addRows, not saveEdits */
      }
    }
    edits.push({ kind: parts[0], keys: parts.slice(1), field: field, value: dirty[k] });
  });
  var btn = el("#sbSave"); btn.disabled = true;
  setStatus("Saving " + (edits.length + newRows.length) + " change(s)\u2026");
  (newRows.length
    ? post({ action:"addRows", tab:"Text", rows: newRows.map(stripPrivate).map(function(r){
        var o = {}; Object.keys(r).forEach(function(kk){ if (kk !== "__new") o[kk] = r[kk]; }); return o;
      }) })
    : Promise.resolve({ ok:true }))
  .then(function(){
    newRows.forEach(function(r){ delete r.__new; });
    if (!edits.length) return { ok:true, applied:newRows.length, skipped:[] };
    return post({ action:"saveEdits", edits: edits });
  })
  .then(function(j){
    btn.disabled = false;
    var skipped = j.skipped || [];
    if (skipped.length){
      var keep = {};
      skipped.forEach(function(sk){ if (dirty[sk.key] !== undefined) keep[sk.key] = dirty[sk.key]; });
      dirty = keep; syncSavebar(); renderView();
      setStatus("Saved " + (j.applied || 0) + " \u2014 but " + skipped.length + " FAILED (kept pending): " +
        skipped.map(function(sk){ return sk.reason; }).slice(0, 2).join("; "), "err");
    } else {
      dirty = {}; syncSavebar();
      setStatus(j.message || "Saved", "ok");
      load();
    }
  })
  .catch(function(e){ setStatus("Save failed: " + e.message, "err"); btn.disabled = false; });
});

/* ================= ROUTER ================= */
function renderView(){
  if (!DB) return;
  if (view === "centres") renderCentres();
  else if (view === "mrprices") renderMrPrices();
  else if (view === "vofeat") renderVoFeatures();
  else if (view === "texts") renderTexts();
  else if (view === "sp") renderSp();
  else if (view === "saleskit") renderSalesKit();
  else if (view === "mapd") renderMapd();
  else if (view === "it") renderIt();
  else renderConfig();
}
load();
