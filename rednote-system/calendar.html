<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="内容日历">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Compass Offices — 内容日历 Content Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   COMPASS OFFICES — 内容日历
   Reads the posts tab, hands the finished PNGs to the phone
   share sheet, writes 已发布 back. Scoped under .cal
   ============================================================ */
.cal{
  --co-orange:#FF6600; --co-orange-dk:#E55A00; --co-orange-wash:#FFF3EB; --co-orange-tint:#FFD9BD;
  --co-ink:#1A1A1A; --co-text:#333333; --co-text-2:#555555;
  --co-muted:#888888; --co-faint:#BBBBBB; --co-line:#E5E5E5;
  --co-bg:#F5F5F5; --co-fill:#EFEFEF; --co-paper:#FFFFFF;
  font-family:'Hanken Grotesk','Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif;
  color:var(--co-ink); line-height:1.55; -webkit-font-smoothing:antialiased;
}
.cal *,.cal *::before,.cal *::after{box-sizing:border-box;}
html,body{margin:0;background:#F5F5F5;}
.cal-wrap{max-width:1080px;margin:0 auto;padding:0 16px 96px;}

/* header */
.cal-top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--co-line);}
.cal-top .in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;}
.cal-top img.lg{height:30px;display:block;}
.cal-top .ttl{font-size:13px;font-weight:800;letter-spacing:.02em;}
.cal-top .sp{flex:1;}
.cal-btn{appearance:none;border:1px solid var(--co-line);background:#fff;color:var(--co-ink);border-radius:9px;padding:8px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.cal-btn:hover{border-color:var(--co-muted);}
.cal-btn.pri{background:var(--co-orange);border-color:var(--co-orange);color:#fff;}
.cal-btn.pri:hover{background:var(--co-orange-dk);border-color:var(--co-orange-dk);}
.cal-btn.gho{background:transparent;}
.cal-btn:disabled{opacity:.45;cursor:not-allowed;}

/* month bar */
.mbar{display:flex;align-items:center;gap:12px;padding:20px 0 14px;}
.mbar h2{margin:0;font-size:22px;font-weight:800;letter-spacing:.01em;}
.mbar .sp{flex:1;}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--co-text-2);}
.legend i{display:inline-block;width:9px;height:9px;border-radius:999px;margin-right:5px;vertical-align:middle;}

/* grid */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px;}
.dow span{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--co-muted);text-align:center;text-transform:uppercase;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.day{background:#fff;border:1px solid var(--co-line);border-radius:12px;min-height:104px;padding:8px;display:flex;flex-direction:column;gap:5px;}
.day.out{background:transparent;border-color:transparent;}
.day .n{font-size:11px;font-weight:800;color:var(--co-muted);}
.day.today{border-color:var(--co-orange);box-shadow:0 0 0 2px var(--co-orange-wash);}
.day.today .n{color:var(--co-orange);}
.ev{border:0;text-align:left;background:var(--co-orange-wash);border-left:3px solid var(--co-orange);border-radius:6px;padding:5px 6px;font:inherit;font-size:11px;line-height:1.3;cursor:pointer;color:var(--co-ink);}
.ev:hover{background:var(--co-orange-tint);}
.ev b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ev .st{font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--co-text-2);}
.ev.s-draft{background:var(--co-fill);border-left-color:var(--co-faint);}
.ev.s-done{background:#EAF6EE;border-left-color:#3E9B62;}
.ev.s-done b{text-decoration:line-through;color:var(--co-text-2);}

/* list (phone) */
.list{display:none;flex-direction:column;gap:10px;}
.row{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--co-line);border-radius:14px;padding:12px;cursor:pointer;}
.row .dt{flex:0 0 52px;text-align:center;}
.row .dt b{display:block;font-size:20px;font-weight:900;line-height:1;}
.row .dt span{font-size:10px;font-weight:700;color:var(--co-muted);letter-spacing:.08em;}
.row .mn{flex:1;min-width:0;}
.row .mn b{display:block;font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .mn span{font-size:12px;color:var(--co-text-2);}
.chip{display:inline-block;border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:800;letter-spacing:.03em;}
.c-draft{background:var(--co-fill);color:var(--co-text-2);}
.c-sched{background:var(--co-orange-wash);color:var(--co-orange);}
.c-done{background:#EAF6EE;color:#2F7A4C;}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:40;display:none;}
.sheet.on{display:block;}
.sheet .bg{position:absolute;inset:0;background:rgba(10,10,10,.5);}
.sheet .panel{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:#fff;overflow-y:auto;padding:20px 20px calc(28px + env(safe-area-inset-bottom));}
.sheet h3{margin:0 0 2px;font-size:19px;font-weight:900;}
.sheet .sub{color:var(--co-text-2);font-size:12.5px;margin-bottom:16px;}
.sheet .close{position:absolute;right:14px;top:14px;border:0;background:var(--co-fill);border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:15px;line-height:1;color:var(--co-text);}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch;}
.strip .sl{flex:0 0 108px;aspect-ratio:3/4;border-radius:9px;background:var(--co-fill) center/cover no-repeat;border:1px solid var(--co-line);}
.fld{margin-bottom:14px;}
.fld .lb{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--co-muted);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.fld .lb button{border:1px solid var(--co-line);background:#fff;border-radius:7px;padding:3px 8px;font:inherit;font-size:10.5px;font-weight:700;cursor:pointer;color:var(--co-text);}
.fld .bx{background:var(--co-bg);border:1px solid var(--co-line);border-radius:11px;padding:12px 14px;font-size:14px;line-height:1.7;white-space:pre-wrap;}
.fld input{width:100%;border:1px solid var(--co-line);border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
.acts .cal-btn{flex:1;min-width:132px;padding:13px;}
.note{font-size:11.5px;color:var(--co-muted);margin-top:10px;line-height:1.6;}

/* config */
.mask{position:fixed;inset:0;background:rgba(10,10,10,.55);display:none;place-items:center;z-index:60;padding:20px;}
.mask.on{display:grid;}
.mbox{background:#fff;border-radius:16px;width:min(460px,96vw);padding:22px;}
.mbox h3{margin:0 0 4px;font-size:16px;font-weight:900;}
.mbox p{color:var(--co-text-2);font-size:12px;margin:0 0 16px;line-height:1.6;}
.mbox label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--co-muted);margin:0 0 5px;}
.mbox input{width:100%;border:1px solid var(--co-line);border-radius:9px;padding:10px 12px;font:inherit;font-size:13px;margin-bottom:12px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:12px 18px;border-radius:11px;font-size:13px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:.25s;}
.toast.on{opacity:1;}
.toast b{color:var(--co-orange);}
.empty{text-align:center;color:var(--co-muted);font-size:13px;padding:44px 16px;line-height:1.8;}

@media (max-width:760px){
  .dow,.grid{display:none;}
  .list{display:flex;}
  .sheet .panel{width:100%;border-radius:0;}
  .mbar h2{font-size:19px;}
}
</style>
</head>
<body class="cal">

<header class="cal-top"><div class="in">
  <img class="lg" id="lg" alt="Compass Offices">
  <span class="ttl">内容日历</span>
  <span class="sp"></span>
  <button class="cal-btn gho" id="bPrev">‹</button>
  <button class="cal-btn gho" id="bNext">›</button>
  <button class="cal-btn" id="bCfg">设置</button>
</div></header>

<div class="cal-wrap">
  <div class="mbar">
    <h2 id="mTitle">—</h2>
    <span class="sp"></span>
    <div class="legend">
      <span><i style="background:#BBBBBB"></i>草稿</span>
      <span><i style="background:#FF6600"></i>已排期</span>
      <span><i style="background:#3E9B62"></i>已发布</span>
    </div>
  </div>
  <div class="dow"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
  <div class="grid" id="grid"></div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none"></div>
</div>

<div class="sheet" id="sheet">
  <div class="bg"></div>
  <div class="panel">
    <button class="close" id="xSheet">&times;</button>
    <h3 id="dTitle">—</h3>
    <div class="sub" id="dSub"></div>
    <div class="strip" id="dStrip"></div>
    <div class="fld">
      <div class="lb">笔记正文 <button id="cCap">复制</button></div>
      <div class="bx" id="dCap"></div>
    </div>
    <div class="fld">
      <div class="lb">话题标签 <button id="cTag">复制</button></div>
      <div class="bx" id="dTag"></div>
    </div>
    <div class="acts">
      <button class="cal-btn pri" id="bShare">分享图片到小红书</button>
      <button class="cal-btn" id="bDl">下载全部</button>
    </div>
    <div class="fld" style="margin-top:18px">
      <div class="lb">发布后贴回笔记链接（选填）</div>
      <input type="text" id="dUrl" placeholder="https://www.xiaohongshu.com/…">
    </div>
    <div class="acts">
      <button class="cal-btn pri" id="bDone">标记已发布</button>
    </div>
    <p class="note">「分享图片」会把整套 PNG 直接送进手机的分享面板，选小红书即可，图片已经带上。<br>正文与标签请先复制，发布时贴上。</p>
  </div>
</div>

<div class="mask" id="mCfg"><div class="mbox">
  <h3>后端设置</h3>
  <p>Apps Script 部署后的 /exec 网址，与脚本属性里的 API_TOKEN。</p>
  <label>Endpoint</label><input id="cfgUrl" type="text" placeholder="https://script.google.com/macros/s/…/exec">
  <label>Token</label><input id="cfgTok" type="text" placeholder="API_TOKEN">
  <div class="acts"><button class="cal-btn pri" id="bCfgSave">保存</button><button class="cal-btn" id="bCfgX">取消</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), el=(t,c)=>{const n=document.createElement(t);if(c)n.className=c;return n;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get:(k,d)=>{try{return localStorage.getItem(k)??d;}catch(e){return d;}},
             set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
const API={url:store.get('co_api',''),token:store.get('co_tok','')};

async function api(fn,payload,method){
  if(!API.url) throw new Error('尚未设置后端网址');
  if((method||'GET')==='GET'){
    const q=new URLSearchParams(Object.assign({fn,token:API.token},payload||{}));
    return (await fetch(API.url+'?'+q)).json();
  }
  return (await fetch(API.url,{method:'POST',body:JSON.stringify(Object.assign({fn,token:API.token},payload||{}))})).json();
}
let tt; function toast(m){const n=$('#toast');n.innerHTML=m;n.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>n.classList.remove('on'),2300);}

/* ── state ── */
let VIEW=new Date(); VIEW.setDate(1);
let POSTS=[], CUR=null, IMGS=[];
const iso=d=>d.toISOString().slice(0,10);
const STATUS=s=>s==='已发布'?'done':(s==='草稿'?'draft':'sched');

/* ── load ── */
async function load(){
  if(!API.url){ $('#empty').style.display='block'; $('#empty').innerHTML='尚未连接后端。<br>点右上角「设置」填入 Apps Script 网址。'; return; }
  const from=iso(new Date(VIEW.getFullYear(),VIEW.getMonth()-1,1));
  const to  =iso(new Date(VIEW.getFullYear(),VIEW.getMonth()+2,0));
  try{
    const j=await api('posts',{from,to});
    if(j.error) throw new Error(j.error);
    POSTS=j.posts||[]; $('#empty').style.display='none'; draw();
  }catch(e){ $('#empty').style.display='block'; $('#empty').textContent='读取失败：'+e.message; }
}

function draw(){
  $('#mTitle').textContent=VIEW.getFullYear()+' 年 '+(VIEW.getMonth()+1)+' 月';
  const first=new Date(VIEW.getFullYear(),VIEW.getMonth(),1);
  const start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const today=iso(new Date());
  const g=$('#grid'); g.innerHTML='';
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const key=iso(d), out=d.getMonth()!==VIEW.getMonth();
    const cell=el('div','day'+(out?' out':'')+(key===today?' today':''));
    cell.innerHTML='<div class="n">'+d.getDate()+'</div>';
    POSTS.filter(p=>String(p.publish_at).slice(0,10)===key).forEach(p=>{
      const b=el('button','ev s-'+STATUS(p.status));
      b.innerHTML='<b>'+esc(p.title||p.id)+'</b><span class="st">'+esc(p.status||'')+'</span>';
      b.onclick=()=>open(p.id); cell.appendChild(b);
    });
    g.appendChild(cell);
  }
  const L=$('#list'); L.innerHTML='';
  const mine=POSTS.filter(p=>String(p.publish_at).slice(0,7)===iso(VIEW).slice(0,7))
                  .sort((a,b)=>String(a.publish_at).localeCompare(String(b.publish_at)));
  if(!mine.length) L.innerHTML='<div class="empty">这个月还没有排期。</div>';
  mine.forEach(p=>{
    const d=new Date(p.publish_at);
    const r=el('div','row');
    r.innerHTML='<div class="dt"><b>'+(isNaN(d)?'—':d.getDate())+'</b><span>'+(isNaN(d)?'':['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()])+'</span></div>'
      +'<div class="mn"><b>'+esc(p.title||p.id)+'</b><span>'+esc(p.platform||'')+'</span></div>'
      +'<span class="chip c-'+STATUS(p.status)+'">'+esc(p.status||'')+'</span>';
    r.onclick=()=>open(p.id); L.appendChild(r);
  });
}

/* ── detail ── */
async function open(id){
  const p=POSTS.find(x=>String(x.id)===String(id)); if(!p) return;
  CUR=p; IMGS=[];
  $('#dTitle').textContent=p.title||p.id;
  $('#dSub').textContent=(p.platform||'')+' · '+(String(p.publish_at).slice(0,10)||'未排期')+' · '+(p.status||'');
  $('#dCap').textContent=p.caption||'（尚未填写）';
  $('#dTag').textContent=p.hashtags||'（尚未填写）';
  $('#dUrl').value=p.post_url||'';
  $('#sheet').classList.add('on');
  const strip=$('#dStrip'); strip.innerHTML='';
  let ids=[]; try{ ids=JSON.parse(p.image_ids||'[]'); }catch(e){}
  if(!ids.length){ strip.innerHTML='<div class="empty" style="padding:14px">这条还没有成品图。<br>在版式工厂里按「存到日历」生成。</div>'; return; }
  ids.forEach(()=>strip.appendChild(el('div','sl')));
  for(let i=0;i<ids.length;i++){
    try{
      const j=await api('asset',{id:ids[i]});
      if(j.error) continue;
      const uri='data:'+(j.mime||'image/png')+';base64,'+j.b64;
      IMGS.push({name:(i+1)+'.png',uri,mime:j.mime||'image/png'});
      strip.children[i].style.backgroundImage='url('+uri+')';
    }catch(e){}
  }
}
const close=()=>$('#sheet').classList.remove('on');
$('#xSheet').onclick=close; $('#sheet .bg').onclick=close;

function toFile(im){
  const bin=atob(im.uri.split(',')[1]);
  const buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  return new File([buf],im.name,{type:im.mime});
}
$('#bShare').onclick=async()=>{
  if(!IMGS.length) return toast('还没有成品图');
  const files=IMGS.map(toFile);
  if(navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files,title:CUR.title||'Compass Offices'}); }
    catch(e){ if(e.name!=='AbortError') toast('分享未完成'); }
  } else { toast('这个浏览器不支持直接分享，改用「下载全部」'); }
};
$('#bDl').onclick=()=>{
  if(!IMGS.length) return toast('还没有成品图');
  IMGS.forEach((im,i)=>setTimeout(()=>{
    const a=document.createElement('a'); a.href=im.uri; a.download=(CUR.id||'post')+'-'+im.name;
    document.body.appendChild(a); a.click(); a.remove();
  }, i*260));
};
const copy=async(t,label)=>{
  try{ await navigator.clipboard.writeText(t); toast(label+'已复制'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); toast(label+'已复制'); }
};
$('#cCap').onclick=()=>copy(CUR&&CUR.caption||'','正文');
$('#cTag').onclick=()=>copy(CUR&&CUR.hashtags||'','标签');
$('#bDone').onclick=async()=>{
  if(!CUR) return;
  try{
    const j=await api('markPosted',{id:CUR.id,url:$('#dUrl').value.trim()},'POST');
    if(j.error) throw new Error(j.error);
    CUR.status='已发布'; toast('已标记 <b>已发布</b>'); draw(); close();
  }catch(e){ toast('写回失败：'+e.message); }
};

/* ── nav + config ── */
$('#bPrev').onclick=()=>{ VIEW.setMonth(VIEW.getMonth()-1); load(); };
$('#bNext').onclick=()=>{ VIEW.setMonth(VIEW.getMonth()+1); load(); };
$('#bCfg').onclick=()=>{ $('#cfgUrl').value=API.url; $('#cfgTok').value=API.token; $('#mCfg').classList.add('on'); };
$('#bCfgX').onclick=()=>$('#mCfg').classList.remove('on');
$('#bCfgSave').onclick=()=>{
  API.url=$('#cfgUrl').value.trim().replace(/\/+$/,''); API.token=$('#cfgTok').value.trim();
  store.set('co_api',API.url); store.set('co_tok',API.token);
  $('#mCfg').classList.remove('on'); load();
};

/* deep link: calendar.html?post=P20260904-101500 opens straight to the post */
(async function boot(){
  await load();
  const id=new URLSearchParams(location.search).get('post');
  if(id){ if(!POSTS.find(p=>String(p.id)===id)){ try{ const j=await api('post',{id}); if(j.post){ POSTS.push(j.post); draw(); } }catch(e){} } open(id); }
