<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Workspace — Compass Offices Complaints</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 23.13 23.13'%3E%3Cpath fill='%23FF6600' d='M11.57,0C5.18,0,0,5.18,0,11.57s5.18,11.56,11.57,11.56,11.56-5.18,11.56-11.56S17.95,0,11.57,0ZM14.24,15.57l-2.48-4.45-2.57,4.45h-3.27l5.84-10.1,5.63,10.1h-3.15Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/brand.css">
</head>
<body>
<div class="co">
  <header class="co-header">
    <div class="co-header-row">
      <a class="co-brand" href="workspace.html">
        <svg viewBox="0 0 23.13 23.13" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="#FF6600" d="M11.57,0C5.18,0,0,5.18,0,11.57s5.18,11.56,11.57,11.56,11.56-5.18,11.56-11.56S17.95,0,11.57,0ZM14.24,15.57l-2.48-4.45-2.57,4.45h-3.27l5.84-10.1,5.63,10.1h-3.15Z"/></svg>
        <div class="co-brand-text"><span class="co-name">Compass Offices</span><span class="co-sub">Complaints Tracker</span></div>
      </a>
      <div class="co-header-right">
        <div class="co-whoami"><span class="co-who-name" id="whoName"></span><span class="co-who-team" id="whoTeam"></span></div>
        <button class="co-btn co-btn-sm" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <main class="co-main">
    <h1 class="co-page-title" id="pageTitle">Workspace</h1>
    <p class="co-page-sub" id="pageSub"></p>

    <div class="co-tabs" id="tabs" style="display:none;">
      <button class="co-tab co-active" data-tab="unassigned">Unassigned Queue <span class="co-tab-count" id="countUnassigned">0</span></button>
      <button class="co-tab" data-tab="board">My Team's Board <span class="co-tab-count" id="countBoard">0</span></button>
    </div>

    <section id="unassignedSection" class="co-section">
      <div id="unassignedList" class="co-kanban-cards"></div>
    </section>

    <section id="boardSection" class="co-section" style="display:none;">
      <div class="co-kanban">
        <div class="co-kanban-col" data-status="Assigned">
          <div class="co-kanban-col-head"><span class="co-kanban-col-title">Assigned</span><span class="co-tab-count" id="colCountAssigned">0</span></div>
          <div class="co-kanban-cards" id="colAssigned"></div>
        </div>
        <div class="co-kanban-col" data-status="In Progress">
          <div class="co-kanban-col-head"><span class="co-kanban-col-title">In Progress</span><span class="co-tab-count" id="colCountProgress">0</span></div>
          <div class="co-kanban-cards" id="colProgress"></div>
        </div>
        <div class="co-kanban-col" data-status="Resolved">
          <div class="co-kanban-col-head"><span class="co-kanban-col-title">Resolved</span><span class="co-tab-count" id="colCountResolved">0</span></div>
          <div class="co-kanban-cards" id="colResolved"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="co-modal-backdrop" id="modalBackdrop">
    <div class="co-modal">
      <button class="co-modal-close" id="modalCloseBtn"><svg viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="co-modal-title" id="modalTitle"></div>
      <div class="co-modal-sub" id="modalSub"></div>
      <div class="co-error" id="modalErr"></div>

      <div class="co-detail-grid" id="modalDetailGrid"></div>
      <div class="co-detail-item co-span2" style="margin-bottom:18px;">
        <div class="co-detail-label">Description</div>
        <div class="co-detail-value" id="modalDescription" style="font-weight:400;"></div>
      </div>

      <div class="co-section-title" style="margin-bottom:10px;">Activity Log</div>
      <div class="co-log" id="modalLog"></div>

      <div id="triageForm" style="display:none;">
        <div class="co-section-title" style="margin-bottom:10px;">Triage</div>
        <div class="co-row2" style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
          <div class="co-field">
            <label class="co-label">Assign to team <span class="co-req">*</span></label>
            <select class="co-select-field" id="triageTeam" required>
              <option value="" disabled selected>Select team</option>
              <option value="CS">CS</option>
              <option value="Project">Project</option>
              <option value="IT">IT</option>
            </select>
          </div>
          <div class="co-field">
            <label class="co-label">Owner <span class="co-req">*</span></label>
            <select class="co-select-field" id="triageOwner" required>
              <option value="" disabled selected>Select team first</option>
            </select>
          </div>
        </div>
        <div class="co-row2" style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
          <div class="co-field">
            <label class="co-label">Severity <span class="co-req">*</span></label>
            <select class="co-select-field" id="triageSeverity" required>
              <option value="Low">Low</option>
              <option value="Med">Med</option>
              <option value="High">High</option>
            </select>
          </div>
          <div class="co-field">
            <label class="co-label">Target resolution date <span class="co-req">*</span></label>
            <input class="co-input" id="triageTarget" type="date" required>
          </div>
        </div>
        <button class="co-btn co-btn-primary" id="triageSubmitBtn" style="width:100%; padding:11px;">Assign &amp; move to Assigned</button>
      </div>

      <div id="updateForm" style="display:none;">
        <div class="co-section-title" style="margin-bottom:10px;">Post an Update</div>
        <div class="co-field">
          <label class="co-label">Note <span class="co-req">*</span></label>
          <textarea class="co-textarea" id="updateNote" required placeholder="What did you do / find out?"></textarea>
        </div>
        <div class="co-field">
          <label class="co-label">Status <span class="co-req">*</span></label>
          <select class="co-select-field" id="updateStatus" required>
            <option value="Assigned">Assigned</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>
        <button class="co-btn co-btn-primary" id="updateSubmitBtn" style="width:100%; padding:11px;">Post update</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { db, requireStaffSession, signOutAndRedirect } from "./shared/firebase-client.js";
import {
  collection, doc, getDocs, query, where, orderBy, writeBatch
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const staff = await requireStaffSession();
if (!staff) throw new Error("no session");

document.getElementById("whoName").textContent = staff.name;
document.getElementById("whoTeam").textContent = staff.team + " Team";
document.getElementById("logoutBtn").addEventListener("click", signOutAndRedirect);

const isCS = staff.team === "CS";
document.getElementById("pageTitle").textContent = isCS ? "CS Workspace" : `${staff.team} Workspace`;
document.getElementById("pageSub").textContent = isCS
  ? "Triage incoming complaints and track your own team's tickets."
  : `Tickets currently assigned to ${staff.team}.`;

let allStaff = [];
const staffSnap = await getDocs(collection(db, "staff"));
allStaff = staffSnap.docs.map(d => d.data());

const severityBadge = { Low: "co-badge-sev-low", Med: "co-badge-sev-med", High: "co-badge-sev-high" };
const statusBadge = {
  "New - Unassigned": "co-badge-status",
  "Assigned": "co-badge-status-assigned",
  "In Progress": "co-badge-status-progress",
  "Resolved": "co-badge-status-resolved",
};

function fmtDate(d){
  if(!d) return "—";
  return new Date(d + (d.length === 10 ? "T00:00:00" : "")).toLocaleDateString("en-US", {year:"numeric", month:"short", day:"numeric"});
}
function isOverdue(t){
  return t.targetResolutionDate && t.status !== "Resolved" && t.targetResolutionDate < new Date().toISOString().slice(0,10);
}

function ticketCardHTML(t){
  const overdue = isOverdue(t);
  return `
    <div class="co-card-ticket ${overdue ? "co-card-overdue" : ""}" data-ref="${t.ticketRef}">
      <div class="co-card-top">
        <span class="co-card-ref">${t.ticketRef}</span>
        ${overdue ? '<span class="co-badge co-badge-overdue">Overdue</span>' : ""}
      </div>
      <div class="co-card-client">${escapeHTML(t.clientName)}${t.company ? " · " + escapeHTML(t.company) : ""}</div>
      <div class="co-card-meta">${escapeHTML(t.centre)} · ${escapeHTML(t.complaintType)} · raised ${fmtDate(t.dateRaised.slice(0,10))}</div>
      <div class="co-card-tags">
        <span class="co-badge ${severityBadge[t.severity]}">${t.severity}</span>
        <span class="co-badge ${statusBadge[t.status]}">${t.status}</span>
      </div>
    </div>`;
}

function escapeHTML(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

let ticketsByRef = {};

function snapToTickets(snap){
  return snap.docs.map(d => ({ ...d.data(), ticketRef: d.id }));
}

async function loadUnassigned(){
  let data;
  try {
    const snap = await getDocs(query(collection(db, "complaints"), where("ownerTeam", "==", null)));
    data = snapToTickets(snap);
  } catch (err) { console.error(err); return; }
  data.sort((a, b) => a.dateRaised < b.dateRaised ? -1 : a.dateRaised > b.dateRaised ? 1 : 0);
  data.forEach(t => ticketsByRef[t.ticketRef] = t);
  document.getElementById("countUnassigned").textContent = data.length;
  const list = document.getElementById("unassignedList");
  list.innerHTML = data.length
    ? data.map(ticketCardHTML).join("")
    : `<div class="co-empty-state"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 6L9 17l-5-5"/></svg><div>Nothing waiting on triage.</div></div>`;
}

async function loadBoard(){
  let data;
  try {
    const snap = await getDocs(query(collection(db, "complaints"), where("ownerTeam", "==", staff.team)));
    data = snapToTickets(snap);
  } catch (err) { console.error(err); return; }
  data.sort((a, b) => a.dateRaised > b.dateRaised ? -1 : a.dateRaised < b.dateRaised ? 1 : 0);
  data.forEach(t => ticketsByRef[t.ticketRef] = t);
  document.getElementById("countBoard").textContent = data.length;

  const cols = { "Assigned": [], "In Progress": [], "Resolved": [] };
  data.forEach(t => { if (cols[t.status]) cols[t.status].push(t); });

  const map = { "Assigned": ["colAssigned","colCountAssigned"], "In Progress": ["colProgress","colCountProgress"], "Resolved": ["colResolved","colCountResolved"] };
  for (const status of Object.keys(map)){
    const [listId, countId] = map[status];
    document.getElementById(countId).textContent = cols[status].length;
    document.getElementById(listId).innerHTML = cols[status].length
      ? cols[status].map(ticketCardHTML).join("")
      : `<div class="co-kanban-empty">No tickets</div>`;
  }
}

async function refreshAll(){
  ticketsByRef = {};
  if (isCS) await loadUnassigned();
  await loadBoard();
}

// ---- Tabs (CS only) ----
if (isCS) {
  document.getElementById("tabs").style.display = "flex";
  document.querySelectorAll(".co-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".co-tab").forEach(t => t.classList.remove("co-active"));
      tab.classList.add("co-active");
      const which = tab.dataset.tab;
      document.getElementById("unassignedSection").style.display = which === "unassigned" ? "block" : "none";
      document.getElementById("boardSection").style.display = which === "board" ? "block" : "none";
    });
  });
} else {
  document.getElementById("unassignedSection").style.display = "none";
  document.getElementById("boardSection").style.display = "block";
}

// ---- Modal ----
const modalBackdrop = document.getElementById("modalBackdrop");
const modalErr = document.getElementById("modalErr");
let activeTicket = null;

function closeModal(){
  modalBackdrop.classList.remove("co-show");
  activeTicket = null;
}
document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) closeModal(); });

function populateOwnerOptions(team){
  const sel = document.getElementById("triageOwner");
  const names = allStaff.filter(s => s.team === team).map(s => s.name);
  sel.innerHTML = names.length
    ? names.map(n => `<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join("")
    : `<option value="" disabled selected>No staff found for ${team}</option>`;
}

document.getElementById("triageTeam").addEventListener("change", (e) => populateOwnerOptions(e.target.value));

async function openModal(ref){
  const t = ticketsByRef[ref];
  if (!t) return;
  activeTicket = t;
  modalErr.classList.remove("co-show");

  document.getElementById("modalTitle").textContent = t.ticketRef;
  document.getElementById("modalSub").textContent = `${t.clientName}${t.company ? " · " + t.company : ""} · ${t.centre}`;

  const overdue = isOverdue(t);
  document.getElementById("modalDetailGrid").innerHTML = `
    <div class="co-detail-item"><div class="co-detail-label">Email</div><div class="co-detail-value">${escapeHTML(t.email)}</div></div>
    <div class="co-detail-item"><div class="co-detail-label">Type</div><div class="co-detail-value">${escapeHTML(t.complaintType)}</div></div>
    <div class="co-detail-item"><div class="co-detail-label">Severity</div><div class="co-detail-value"><span class="co-badge ${severityBadge[t.severity]}">${t.severity}</span></div></div>
    <div class="co-detail-item"><div class="co-detail-label">Status</div><div class="co-detail-value"><span class="co-badge ${statusBadge[t.status]}">${t.status}</span> ${overdue ? '<span class="co-badge co-badge-overdue">Overdue</span>' : ""}</div></div>
    <div class="co-detail-item"><div class="co-detail-label">Date Raised</div><div class="co-detail-value">${fmtDate(t.dateRaised.slice(0,10))}</div></div>
    <div class="co-detail-item"><div class="co-detail-label">Target Resolution</div><div class="co-detail-value">${fmtDate(t.targetResolutionDate)}</div></div>
  `;
  document.getElementById("modalDescription").textContent = t.description;

  const logSnap = await getDocs(query(
    collection(db, "complaints", t.ticketRef, "activity_log"),
    orderBy("ts", "desc")
  ));
  const logs = logSnap.docs.map(d => d.data());
  const logDiv = document.getElementById("modalLog");
  logDiv.innerHTML = logs.map(l => `
    <div class="co-log-item">
      <div class="co-log-item-top"><span class="co-log-actor">${escapeHTML(l.actor)}</span><span class="co-log-ts">${new Date(l.ts).toLocaleString("en-US", {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"})}</span></div>
      <div class="co-log-note">${escapeHTML(l.note)}</div>
    </div>`).join("") || `<div class="co-hint">No activity yet.</div>`;

  const needsTriage = t.ownerTeam === null;
  document.getElementById("triageForm").style.display = needsTriage ? "block" : "none";
  document.getElementById("updateForm").style.display = needsTriage ? "none" : "block";

  if (needsTriage) {
    document.getElementById("triageTeam").value = "";
    document.getElementById("triageOwner").innerHTML = `<option value="" disabled selected>Select team first</option>`;
    document.getElementById("triageSeverity").value = "Low";
    document.getElementById("triageTarget").value = "";
  } else {
    document.getElementById("updateNote").value = "";
    document.getElementById("updateStatus").value = t.status === "New - Unassigned" ? "Assigned" : t.status;
  }

  modalBackdrop.classList.add("co-show");
}

document.body.addEventListener("click", (e) => {
  const card = e.target.closest(".co-card-ticket");
  if (card) openModal(card.dataset.ref);
});

document.getElementById("triageSubmitBtn").addEventListener("click", async () => {
  const team = document.getElementById("triageTeam").value;
  const owner = document.getElementById("triageOwner").value;
  const severity = document.getElementById("triageSeverity").value;
  const target = document.getElementById("triageTarget").value;

  if (!team || !owner || !severity || !target) {
    modalErr.textContent = "Please fill in all triage fields.";
    modalErr.classList.add("co-show");
    return;
  }

  const btn = document.getElementById("triageSubmitBtn");
  btn.disabled = true; btn.textContent = "Assigning…";

  const ref = activeTicket.ticketRef;
  const now = new Date().toISOString();
  const batch = writeBatch(db);
  batch.update(doc(db, "complaints", ref), {
    ownerTeam: team, owner, severity, status: "Assigned", targetResolutionDate: target, updatedAt: now,
  });
  batch.set(doc(collection(db, "complaints", ref, "activity_log")), {
    ts: now, actor: staff.name,
    note: `Triaged: routed to ${team} (${owner}), severity ${severity}, target resolution ${target}.`,
  });
  batch.update(doc(db, "public_status", ref), { status: "Assigned", targetResolutionDate: target });

  let updErr = null;
  try { await batch.commit(); } catch (err) { updErr = err; }

  btn.disabled = false; btn.textContent = "Assign & move to Assigned";

  if (updErr) {
    modalErr.textContent = "Couldn't save — please try again.";
    modalErr.classList.add("co-show");
    console.error(updErr);
    return;
  }

  closeModal();
  await refreshAll();
});

document.getElementById("updateSubmitBtn").addEventListener("click", async () => {
  const note = document.getElementById("updateNote").value.trim();
  const status = document.getElementById("updateStatus").value;

  if (!note) {
    modalErr.textContent = "Please add a note describing this update.";
    modalErr.classList.add("co-show");
    return;
  }

  const btn = document.getElementById("updateSubmitBtn");
  btn.disabled = true; btn.textContent = "Posting…";

  const ref = activeTicket.ticketRef;
  const now = new Date().toISOString();
  const resolvedDate = (status === "Resolved" && !activeTicket.resolvedDate) ? now.slice(0, 10) : (activeTicket.resolvedDate ?? null);

  const batch = writeBatch(db);
  const complaintUpdate = { status, updatedAt: now };
  if (status === "Resolved") complaintUpdate.resolvedDate = resolvedDate;
  batch.update(doc(db, "complaints", ref), complaintUpdate);
  batch.set(doc(collection(db, "complaints", ref, "activity_log")), { ts: now, actor: staff.name, note });
  batch.update(doc(db, "public_status", ref), { status, resolvedDate });

  let updErr = null;
  try { await batch.commit(); } catch (err) { updErr = err; }

  btn.disabled = false; btn.textContent = "Post update";

  if (updErr) {
    modalErr.textContent = "Couldn't save — please try again.";
    modalErr.classList.add("co-show");
    console.error(updErr);
    return;
  }

  closeModal();
  await refreshAll();
});

refreshAll();
</script>
</body>
</html>
