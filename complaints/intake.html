<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report a Concern — Compass Offices</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 23.13 23.13'%3E%3Cpath fill='%23FF6600' d='M11.57,0C5.18,0,0,5.18,0,11.57s5.18,11.56,11.57,11.56,11.56-5.18,11.56-11.56S17.95,0,11.57,0ZM14.24,15.57l-2.48-4.45-2.57,4.45h-3.27l5.84-10.1,5.63,10.1h-3.15Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/brand.css">
<style>
  .co-intake-wrap{max-width:560px; margin:0 auto; padding:36px 20px 60px;}
  .co-intake-head{text-align:center; margin-bottom:26px;}
  .co-intake-head svg{width:36px; height:36px; margin-bottom:10px;}
  .co-intake-head h1{font-size:21px; font-weight:800; margin:0 0 6px;}
  .co-intake-head p{font-size:13.5px; color:var(--co-text-2); margin:0;}
  .co-row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:560px){.co-row2{grid-template-columns:1fr;}}
  .co-ticket-result{text-align:center; padding:16px 4px 4px;}
  .co-ticket-result svg{width:44px; height:44px; stroke:var(--co-good); fill:none; stroke-width:1.6; margin-bottom:14px;}
  .co-ticket-ref-box{display:flex; align-items:center; justify-content:center; gap:10px; background:var(--co-orange-wash); border:1px dashed var(--co-orange); border-radius:var(--co-radius); padding:16px; margin:16px 0 20px;}
  .co-ticket-ref-num{font-size:22px; font-weight:800; color:var(--co-orange-dk); letter-spacing:.02em;}
  .co-copy-btn{appearance:none; border:1px solid var(--co-orange); background:#fff; color:var(--co-orange-dk); font-size:12px; font-weight:700; padding:5px 10px; border-radius:var(--co-radius-pill); cursor:pointer;}
  .co-ticket-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px;}
</style>
</head>
<body>
<div class="co">
  <div class="co-main co-intake-wrap">

    <div class="co-intake-head">
      <svg viewBox="0 0 23.13 23.13" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="#FF6600" d="M11.57,0C5.18,0,0,5.18,0,11.57s5.18,11.56,11.57,11.56,11.56-5.18,11.56-11.56S17.95,0,11.57,0ZM14.24,15.57l-2.48-4.45-2.57,4.45h-3.27l5.84-10.1,5.63,10.1h-3.15Z"/></svg>
      <h1>Report a Concern</h1>
      <p>Tell us what happened and we'll get it to the right team. You'll get a ticket number to track progress.</p>
    </div>

    <div class="co-card" id="formCard">
      <div class="co-error" id="errBox"></div>

      <form id="intakeForm" novalidate>
        <div class="co-field">
          <label class="co-label" for="f_name">Your name <span class="co-req">*</span></label>
          <input class="co-input" id="f_name" name="client_name" required maxlength="120" autocomplete="name">
        </div>

        <div class="co-row2">
          <div class="co-field">
            <label class="co-label" for="f_company">Company</label>
            <input class="co-input" id="f_company" name="company" maxlength="160" autocomplete="organization">
          </div>
          <div class="co-field">
            <label class="co-label" for="f_email">Email <span class="co-req">*</span></label>
            <input class="co-input" id="f_email" name="email" type="email" required maxlength="160" autocomplete="email">
          </div>
        </div>

        <div class="co-row2">
          <div class="co-field">
            <label class="co-label" for="f_centre">Centre <span class="co-req">*</span></label>
            <select class="co-select-field" id="f_centre" name="centre" required></select>
          </div>
          <div class="co-field">
            <label class="co-label" for="f_type">Type of complaint <span class="co-req">*</span></label>
            <select class="co-select-field" id="f_type" name="complaint_type" required></select>
          </div>
        </div>

        <div class="co-field">
          <label class="co-label" for="f_desc">What happened? <span class="co-req">*</span></label>
          <textarea class="co-textarea" id="f_desc" name="description" required maxlength="4000" placeholder="Please share as much detail as you're comfortable with — date, location within the centre, and what you'd like to see happen."></textarea>
        </div>

        <!-- honeypot: hidden from real users, bots tend to fill every field -->
        <div class="co-honeypot" aria-hidden="true">
          <label for="f_website">Website</label>
          <input id="f_website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" class="co-btn co-btn-primary" id="submitBtn" style="width:100%; padding:12px; font-size:14px;">Submit complaint</button>
        <p class="co-hint" style="text-align:center; margin-top:10px;">Already have a ticket? <a href="lookup.html" style="color:var(--co-orange-dk); font-weight:600;">Check its status</a>.</p>
      </form>

      <div class="co-ticket-result" id="resultBox" style="display:none;">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 6L9 17l-5-5"/></svg>
        <h2 style="font-size:17px; font-weight:800; margin:0;">Thank you — we've got it.</h2>
        <p style="font-size:13px; color:var(--co-text-2); margin:8px 0 0;">Save this ticket number to check on progress any time.</p>
        <div class="co-ticket-ref-box">
          <span class="co-ticket-ref-num" id="ticketRefOut"></span>
          <button class="co-copy-btn" id="copyBtn" type="button">Copy</button>
        </div>
        <div class="co-ticket-actions">
          <a class="co-btn co-btn-primary" id="lookupLink" href="lookup.html">Check status</a>
          <button class="co-btn" id="anotherBtn" type="button">Submit another</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { db } from "./shared/firebase-client.js";
import { CENTRES, COMPLAINT_TYPES } from "./shared/config.js";
import {
  doc, collection, runTransaction, getDoc, setDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const centreSel = document.getElementById("f_centre");
const typeSel = document.getElementById("f_type");
const placeholder = (text) => { const o = document.createElement("option"); o.value=""; o.textContent=text; o.disabled=true; o.selected=true; return o; };

centreSel.appendChild(placeholder("Select a centre"));
CENTRES.forEach(c => { const o=document.createElement("option"); o.value=c; o.textContent=c; centreSel.appendChild(o); });

typeSel.appendChild(placeholder("Select a type"));
COMPLAINT_TYPES.forEach(t => { const o=document.createElement("option"); o.value=t; o.textContent=t; typeSel.appendChild(o); });

const form = document.getElementById("intakeForm");
const errBox = document.getElementById("errBox");
const submitBtn = document.getElementById("submitBtn");
const resultBox = document.getElementById("resultBox");
const pageLoadedAt = Date.now();

function showError(msg){
  errBox.textContent = msg;
  errBox.classList.add("co-show");
}
function clearError(){
  errBox.classList.remove("co-show");
  errBox.textContent = "";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearError();

  // Basic bot deterrent: real people take more than 3s to fill this out.
  if (Date.now() - pageLoadedAt < 3000) {
    showError("Please take a moment to review your complaint before submitting.");
    return;
  }

  const fd = new FormData(form);
  const honeypot = fd.get("website");
  const complaint = {
    clientName: fd.get("client_name").trim(),
    company: fd.get("company").trim() || null,
    email: fd.get("email").trim(),
    centre: fd.get("centre"),
    complaintType: fd.get("complaint_type"),
    description: fd.get("description").trim(),
  };

  if (!complaint.clientName || !complaint.email || !complaint.centre || !complaint.complaintType || !complaint.description) {
    showError("Please fill in all required fields.");
    return;
  }
  if (complaint.description.length > 4000) {
    showError("Please keep the description under 4000 characters.");
    return;
  }

  // Honeypot: real users never fill this hidden field in. Note there's no
  // server-side backstop for this (no Cloud Functions in this build), so
  // it and the time-trap above are the only spam deterrents — see
  // SETUP.md's "known limitations" section.
  if (honeypot) {
    showError("Something went wrong submitting your complaint. Please try again, or email us directly.");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting…";

  // TEMPORARY DEBUG VERSION — runs each write separately (not atomically)
  // so we can see exactly which one Firestore rejects. Revert to the
  // transaction version once the real cause is found.
  let ticketRef;
  try {
    const counterRef = doc(db, "counters", "complaints_seq");
    let counterSnap;
    try {
      counterSnap = await getDoc(counterRef);
      console.log("STEP 1 (read counter) OK:", counterSnap.data());
    } catch (err) {
      console.error("STEP 1 (read counter) FAILED:", err);
      throw err;
    }
    if (!counterSnap.exists()) throw new Error("Ticket counter is not set up yet.");

    const nextCount = counterSnap.data().count + 1;
    const year = new Date().getFullYear();
    const ref = `CMP-${year}-${String(nextCount).padStart(4, "0")}`;
    const now = new Date();
    const nowIso = now.toISOString();

    try {
      await updateDoc(counterRef, { count: nextCount });
      console.log("STEP 2 (update counter) OK");
    } catch (err) {
      console.error("STEP 2 (update counter) FAILED:", err);
      throw err;
    }

    const complaintRef = doc(db, "complaints", ref);
    try {
      await setDoc(complaintRef, {
        ticketRef: ref,
        ...complaint,
        severity: "Low",
        status: "New - Unassigned",
        ownerTeam: null,
        owner: null,
        dateRaised: nowIso,
        targetResolutionDate: null,
        resolvedDate: null,
        createdAt: nowIso,
        updatedAt: nowIso,
      });
      console.log("STEP 3 (create complaint) OK");
    } catch (err) {
      console.error("STEP 3 (create complaint) FAILED:", err);
      throw err;
    }

    const logRef = doc(collection(db, "complaints", ref, "activity_log"));
    try {
      await setDoc(logRef, {
        ts: nowIso,
        actor: "System",
        note: "Complaint submitted by client via public intake form.",
      });
      console.log("STEP 4 (create activity_log) OK");
    } catch (err) {
      console.error("STEP 4 (create activity_log) FAILED:", err);
      throw err;
    }

    const publicStatusRef = doc(db, "public_status", ref);
    try {
      await setDoc(publicStatusRef, {
        status: "New - Unassigned",
        targetResolutionDate: null,
        resolvedDate: null,
      });
      console.log("STEP 5 (create public_status) OK");
    } catch (err) {
      console.error("STEP 5 (create public_status) FAILED:", err);
      throw err;
    }

    ticketRef = ref;
  } catch (err) {
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit complaint";
    showError("Something went wrong submitting your complaint. Please try again, or email us directly.");
    return;
  }

  submitBtn.disabled = false;
  submitBtn.textContent = "Submit complaint";

  document.getElementById("ticketRefOut").textContent = ticketRef;
  document.getElementById("lookupLink").href = `lookup.html?ref=${encodeURIComponent(ticketRef)}`;
  form.style.display = "none";
  resultBox.style.display = "block";
});

document.getElementById("copyBtn").addEventListener("click", () => {
  const ref = document.getElementById("ticketRefOut").textContent;
  navigator.clipboard.writeText(ref).then(() => {
    const btn = document.getElementById("copyBtn");
    const original = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
});

document.getElementById("anotherBtn").addEventListener("click", () => {
  form.reset();
  form.style.display = "block";
  resultBox.style.display = "none";
});
</script>
</body>
</html>
