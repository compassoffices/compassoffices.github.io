<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centre Content · Compass Offices</title>
<meta name="description" content="View and update the neighbourhood and getting-here content for every Compass Offices centre.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'%3E%3Ccircle cx='150' cy='150' r='145' fill='%23FF6600'/%3E%3Cpolygon fill='%23fff' points='152.47 144.45 183.58 200.24 223.13 200.24 152.47 73.62 79.27 200.24 120.22 200.24'/%3E%3C/svg%3E">
<style>
/* ============================ TOKENS ================================== */
:root{
  --o:#FF6600; --o-dk:#E55A00; --o-wash:#FFF3EB; --o-tint:#FFD9BD;
  --ink:#1A1A1A; --ink-2:#333333; --tx2:#555555; --mut:#888888; --fnt:#BBBBBB;
  --ln:#E5E5E5; --ln-2:#F0F0F0; --bg:#F5F5F5; --fill:#EFEFEF; --pap:#FFFFFF;
  --ok:#137A4A; --ok-wash:#E9F6EF; --warn:#8A5A00; --warn-wash:#FFF6E3;
  --bad:#B3261E; --bad-wash:#FDEDEC;
  --r:10px; --r-sm:7px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --side:288px; --head:60px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
  --shadow-lg:0 24px 70px rgba(0,0,0,.22);
  --fs:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',
       'Noto Sans TC','Noto Sans JP',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--fs);background:var(--bg);color:var(--ink-2);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,p,ul,ol,figure{margin:0;}
ul,ol{padding:0;list-style:none;}
button,input,select,textarea{font:inherit;color:inherit;}
button{background:none;border:0;cursor:pointer;}
a{color:inherit;}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  width:16px;height:16px;flex:0 0 auto;}
:focus-visible{outline:2px solid var(--o);outline-offset:2px;border-radius:3px;}
::selection{background:var(--o-tint);}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ============================ CHROME ================================== */
.top{position:fixed;inset:0 0 auto 0;height:var(--head);z-index:30;display:flex;align-items:center;
  gap:var(--s4);padding:0 var(--s4);background:rgba(255,255,255,.88);border-bottom:1px solid var(--ln);
  -webkit-backdrop-filter:saturate(1.6) blur(12px);backdrop-filter:saturate(1.6) blur(12px);}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.brand svg{width:24px;height:24px;stroke:none;}
.brand b{font-size:.94rem;font-weight:800;letter-spacing:-.015em;color:var(--ink);}
.brand span{color:var(--fnt);font-weight:400;}
.top .sp{flex:1 1 auto;}

.state{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--r-pill);
  background:var(--fill);font-size:.76rem;color:var(--tx2);white-space:nowrap;}
.state svg{width:13px;height:13px;}
.state.live{background:var(--ok-wash);color:var(--ok);}
.state.draft{background:var(--warn-wash);color:var(--warn);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;
  padding:9px 15px;border-radius:var(--r-sm);font-size:.84rem;font-weight:700;letter-spacing:-.005em;
  border:1px solid transparent;transition:background .16s,border-color .16s,color .16s,transform .16s;
  white-space:nowrap;}
.btn:active{transform:translateY(1px);}
.btn--o{background:var(--o);color:#fff;}
.btn--o:hover{background:var(--o-dk);}
.btn--line{border-color:var(--ln);background:#fff;color:var(--ink);}
.btn--line:hover{border-color:var(--ink);}
.btn--ghost{color:var(--tx2);}
.btn--ghost:hover{background:var(--fill);color:var(--ink);}
.btn--lg{min-height:46px;padding:12px 22px;font-size:.9rem;}
.btn[disabled]{opacity:.42;pointer-events:none;}
.btn .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 5px;border-radius:var(--r-pill);background:rgba(255,255,255,.24);font-size:.7rem;}

/* ============================ SHELL =================================== */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);
  height:100vh;padding-top:var(--head);}
.scrim{display:none;position:fixed;inset:var(--head) 0 0 0;z-index:24;
  background:rgba(26,26,26,.4);opacity:0;visibility:hidden;
  transition:opacity .2s,visibility .2s;}
.side{border-right:1px solid var(--ln);background:#fff;display:flex;flex-direction:column;min-height:0;}
.main{min-width:0;overflow-y:auto;overscroll-behavior:contain;}

/* ---- sidebar ---- */
.find{position:relative;padding:var(--s3);border-bottom:1px solid var(--ln-2);}
.find svg{position:absolute;left:24px;top:50%;transform:translateY(-50%);color:var(--mut);width:15px;height:15px;}
.find input{width:100%;height:38px;padding:0 34px;border:1px solid var(--ln);border-radius:var(--r-sm);
  background:var(--bg);font-size:.84rem;}
.find input:focus{outline:none;border-color:var(--o);background:#fff;box-shadow:0 0 0 3px var(--o-wash);}
.find input::placeholder{color:var(--mut);}
.find .x{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--mut);}
.find .x:hover{background:var(--fill);color:var(--ink);}
.find .x[hidden]{display:none;}

.ovbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:46px;
  padding:11px var(--s4);border-bottom:1px solid var(--ln-2);font-size:.85rem;font-weight:700;
  color:var(--ink-2);transition:background .14s;}
.ovbtn:hover{background:var(--bg);}
.ovbtn svg{color:var(--mut);}
.ovbtn.on{background:var(--o-wash);box-shadow:inset 2px 0 0 var(--o);color:var(--ink);}
.ovbtn.on svg{color:var(--o);}
.tree{flex:1 1 auto;overflow-y:auto;padding:var(--s2) 0 var(--s5);}
.tree h4{position:sticky;top:0;z-index:1;padding:12px var(--s4) 6px;background:#fff;
  font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--fnt);}
.tree button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px var(--s4);min-height:42px;border-left:2px solid transparent;transition:background .14s;}
.tree button:hover{background:var(--bg);}
.tree button.on{background:var(--o-wash);border-left-color:var(--o);}
.tree button.on .nm{color:var(--ink);font-weight:700;}
.tree .nm{flex:1 1 auto;font-size:.85rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tree .dot{width:7px;height:7px;border-radius:50%;background:var(--ln);flex:0 0 auto;}
.tree .dot.has{background:var(--o);}
.tree .n{font-size:.7rem;color:var(--fnt);font-variant-numeric:tabular-nums;}
.tree .none{padding:var(--s5) var(--s4);color:var(--mut);font-size:.83rem;}

.sidefoot{border-top:1px solid var(--ln-2);padding:var(--s3);display:grid;gap:6px;}

/* ============================ DETAIL ================================== */
.wrap{max-width:1000px;margin:0 auto;padding:var(--s6) var(--s6) var(--s7);}
@media(max-width:720px){.wrap{padding:var(--s5) var(--s4) var(--s7);}}

.hd{display:flex;align-items:flex-start;gap:var(--s4);flex-wrap:wrap;
  padding-bottom:var(--s5);border-bottom:1px solid var(--ln);}
.hd .kick{font-size:.68rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--o);margin-bottom:8px;}
.hd h1{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:800;letter-spacing:-.03em;
  line-height:1.08;color:var(--ink);}
.hd .code{display:inline-block;margin-top:10px;padding:3px 9px;border-radius:5px;background:var(--fill);
  font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--tx2);
  font-variant-numeric:tabular-nums;}
.hd .sp{flex:1 1 auto;}

.tally{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s5);}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r-pill);
  border:1px solid var(--ln);background:#fff;font-size:.78rem;color:var(--tx2);
  white-space:nowrap;min-height:34px;}
.pill b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;}
.pill svg{width:14px;height:14px;color:var(--o);}
.pill.empty{border-style:dashed;color:var(--mut);}

section.blk{margin-top:var(--s6);}
.blk > h2{display:flex;align-items:baseline;gap:10px;margin-bottom:var(--s4);
  font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);}
.blk > h2 em{font-style:normal;font-weight:700;letter-spacing:0;text-transform:none;
  font-size:.78rem;color:var(--mut);}

.card{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:var(--s5);}
.grid2{display:grid;gap:var(--s3);grid-template-columns:repeat(2,minmax(0,1fr));}
@media(max-width:800px){.grid2{grid-template-columns:1fr;}}

/* report */
.per{display:grid;gap:var(--s4);}
.per > div > h5{font-size:.68rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--mut);margin-bottom:5px;}
.per p{color:var(--ink-2);line-height:1.6;}
.mix{display:grid;gap:11px;margin-top:var(--s2);}
.mix .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:baseline;}
.mix .nm{font-size:.84rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mix .v{font-size:.8rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
.mix .bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--fill);overflow:hidden;}
.mix .bar i{display:block;height:100%;background:var(--o);border-radius:3px;}
.split{display:flex;height:34px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--ln);}
.split i{display:flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:800;
  font-style:normal;font-variant-numeric:tabular-nums;}
.split i.a{background:var(--fill);color:var(--ink);}
.split i.b{background:var(--o);color:#fff;}
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:10px;font-size:.76rem;color:var(--tx2);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;border-radius:2px;background:var(--fill);border:1px solid var(--ln);}
.legend i.b{background:var(--o);border-color:var(--o);}

/* places */
.cats{display:grid;gap:var(--s4);}
.cat > h3{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-size:.8rem;
  font-weight:800;color:var(--ink);}
.cat > h3 svg{width:15px;height:15px;color:var(--o);}
.cat > h3 span{color:var(--fnt);font-weight:700;font-variant-numeric:tabular-nums;}
.places{border:1px solid var(--ln);border-radius:var(--r);background:#fff;overflow:hidden;}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:start;
  padding:13px var(--s4);border-bottom:1px solid var(--ln-2);}
.pl:last-child{border-bottom:0;}
.pl b{display:block;font-size:.86rem;font-weight:700;color:var(--ink);}
.pl p{font-size:.81rem;color:var(--tx2);margin-top:2px;}
.pl .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px;}
.tag{padding:2px 7px;border-radius:4px;background:var(--ink);color:#fff;font-size:.64rem;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
.geo{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;color:var(--mut);
  font-variant-numeric:tabular-nums;}
.geo svg{width:11px;height:11px;}
.geo.no{color:var(--fnt);}
.pl .w{font-size:.78rem;font-weight:800;color:var(--ink);white-space:nowrap;
  font-variant-numeric:tabular-nums;padding-top:1px;}

/* journeys */
.jrs{display:grid;gap:var(--s3);}
.jr{border:1px solid var(--ln);border-radius:var(--r);background:#fff;overflow:hidden;}
.jr > header{display:flex;align-items:center;gap:11px;padding:13px var(--s4);
  border-bottom:1px solid var(--ln-2);background:var(--bg);}
/* title and subtitle wrap onto their own lines rather than colliding */
.jr .jrh{min-width:0;flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;}
.jr > header svg{width:16px;height:16px;color:var(--o);}
.jr b{font-size:.86rem;font-weight:800;color:var(--ink);}
.jr .sub{font-size:.78rem;color:var(--mut);position:relative;}
@media(min-width:520px){.jr .sub::before{content:"·";margin-right:8px;color:var(--fnt);}}
.jr .best{margin-left:auto;flex:0 0 auto;padding:2px 8px;border-radius:var(--r-pill);background:var(--o-wash);
  border:1px solid var(--o-tint);color:var(--o-dk);font-size:.66rem;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;}
.jr ol{padding:var(--s4);display:grid;gap:12px;counter-reset:st;}
.jr li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:11px;align-items:start;}
.jr li::before{counter-increment:st;content:counter(st);width:22px;height:22px;border-radius:50%;
  background:var(--fill);color:var(--tx2);font-size:.68rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;}
.jr li b{font-size:.84rem;font-weight:700;}
.jr li p{font-size:.8rem;color:var(--tx2);margin-top:1px;}
.jr li .t{font-size:.74rem;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums;}
.jr .tot{padding:11px var(--s4);border-top:1px solid var(--ln-2);font-size:.8rem;color:var(--tx2);}
.jr .tot b{color:var(--ink);}

/* empty */
.empty{border:1.5px dashed var(--ln);border-radius:var(--r);background:#fff;
  padding:var(--s7) var(--s5);text-align:center;}
.empty svg{width:26px;height:26px;color:var(--fnt);margin-bottom:12px;}
.empty h3{font-size:.95rem;font-weight:800;color:var(--ink);margin-bottom:6px;}
.empty p{color:var(--mut);max-width:44ch;margin:0 auto;font-size:.85rem;}
.empty .btn{margin-top:var(--s4);}

.langs{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s4);}
.lg{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:8px 13px;
  border-radius:var(--r-sm);border:1px solid var(--ln);background:#fff;font-size:.8rem;
  font-weight:700;color:var(--tx2);transition:border-color .14s,background .14s,color .14s;}
.lg:hover{border-color:var(--ink);color:var(--ink);}
.lg.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.lg .pc{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:.72rem;
  color:var(--mut);font-variant-numeric:tabular-nums;}
.lg.on .pc{color:rgba(255,255,255,.66);}
.lg .ring{width:13px;height:13px;border-radius:50%;border:2px solid var(--ln);flex:0 0 auto;}
.lg .ring.part{border-color:var(--o-tint);background:
  conic-gradient(var(--o) var(--p,0%), transparent 0);}
.lg .ring.full{border-color:var(--o);background:var(--o);}
.lg.on .ring{border-color:rgba(255,255,255,.36);}
.lg.on .ring.full{border-color:#fff;background:#fff;}

.xnote{display:flex;align-items:center;gap:9px;padding:10px var(--s4);margin-top:var(--s4);
  border-radius:var(--r-sm);background:var(--bg);border:1px solid var(--ln);
  font-size:.8rem;color:var(--tx2);}
.xnote svg{width:15px;height:15px;color:var(--mut);}

.newban{display:flex;align-items:center;gap:11px;padding:13px var(--s4);margin-bottom:var(--s4);
  border-radius:var(--r);background:var(--o-wash);border:1px solid var(--o-tint);font-size:.85rem;}
.newban svg{color:var(--o);}
.newban b{color:var(--ink);}
.newban .sp{flex:1 1 auto;}

/* ============================ CHARTS ================================== */
.figs{display:grid;gap:var(--s3);grid-template-columns:repeat(2,minmax(0,1fr));}
@media(max-width:900px){.figs{grid-template-columns:1fr;}}
.fig{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:var(--s5);min-width:0;}
.fig.wide{grid-column:1/-1;}
.fig > h3{font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--mut);margin-bottom:3px;}
.fig > .cap{font-size:.8rem;color:var(--mut);margin-bottom:var(--s4);}
.fig svg{width:100%;max-width:660px;height:auto;display:block;overflow:visible;stroke:none;}
.fig text{font-family:var(--fs);fill:var(--tx2);stroke:none;}
.fig .ax{font-size:10px;fill:var(--mut);}
.fig .val{font-size:11px;font-weight:800;fill:var(--ink);}
.fig .lab{font-size:11.5px;fill:var(--ink-2);}
.fig .grid{stroke:var(--ln-2);stroke-width:1;}
.fig .mk{fill:var(--o);}
.fig .mk-2{fill:var(--fill);}
.fig .mk-ink{fill:var(--ink);}
.fig .hit{fill:transparent;cursor:default;}
.fig g.q:hover .mk{fill:var(--o-dk);}

.hero{display:flex;align-items:baseline;gap:9px;}
.hero b{font-size:clamp(2rem,4.4vw,2.9rem);font-weight:800;letter-spacing:-.04em;color:var(--ink);
  line-height:1;font-variant-numeric:tabular-nums;}
.hero span{font-size:.82rem;color:var(--mut);}
.kpis{display:grid;gap:var(--s3);grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:var(--s3);}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));}}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:var(--s4) var(--s5);}
.kpi h4{font-size:.66rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--mut);margin-bottom:7px;}
.kpi .hero b{font-size:clamp(1.6rem,3.2vw,2.2rem);}

.wf{display:grid;gap:var(--s4);}
.wfr{display:grid;grid-template-columns:104px minmax(0,1fr);gap:var(--s3);align-items:center;}
@media(max-width:600px){.wfr{grid-template-columns:1fr;gap:6px;}}
.wfr > span{font-size:.74rem;font-weight:700;color:var(--tx2);text-align:right;}
@media(max-width:600px){.wfr > span{text-align:left;}}
.wfc{display:flex;gap:5px;flex-wrap:wrap;}
.wfc i{width:20px;height:20px;border-radius:4px;background:var(--fill);
  border:1px solid var(--ln);cursor:default;transition:transform .12s;}
.wfc i.has{background:var(--o);border-color:var(--o);}
.wfc i:hover{transform:scale(1.22);}
.wfkey{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s4);font-size:.78rem;color:var(--tx2);}
.wfkey span{display:inline-flex;align-items:center;gap:7px;}
.wfkey i{width:12px;height:12px;border-radius:3px;background:var(--fill);border:1px solid var(--ln);}
.wfkey i.has{background:var(--o);border-color:var(--o);}

.meter{display:grid;gap:11px;}
.meter .m{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:baseline;}
.meter .m > span{font-size:.82rem;color:var(--ink-2);}
.meter .m > b{font-size:.82rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
.meter .t{grid-column:1/-1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden;}
.meter .t i{display:block;height:100%;background:var(--o);border-radius:3px;}
.meter .t i.ink{background:var(--ink);}

/* ============================ DROP ==================================== */
.drop{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:var(--s5);
  background:rgba(26,26,26,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.drop.on{display:grid;}
.drop > div{border:2px dashed #fff;border-radius:16px;padding:var(--s7) var(--s6);text-align:center;
  color:#fff;background:rgba(255,102,0,.16);}
.drop svg{width:38px;height:38px;margin-bottom:var(--s3);}
.drop b{display:block;font-size:1.05rem;font-weight:800;}
.drop p{opacity:.82;font-size:.86rem;margin-top:4px;}

/* ============================ MODAL =================================== */
.sheet{position:fixed;inset:0;z-index:70;display:none;}
.sheet.on{display:block;}
.sheet .veil{position:absolute;inset:0;background:rgba(26,26,26,.45);}
.sheet .box{position:absolute;inset:auto 0 0 0;margin:0 auto;width:min(820px,100%);

.steps{display:grid;gap:var(--s4);counter-reset:s;}

  "cx-walk":'<circle cx="13" cy="4" r="1.8"/><path d="M9 21.5 11 15l-2-2.2V8.6L12.4 7l2.6 3 2.5 1.2M11 15l3.6 1.4 1.4 5.1M9 12.2 6.6 14 5 18"/>',
  "cx-tram":'<rect x="5.5" y="3.5" width="13" height="13" rx="2.5"/><path d="M5.5 11h13M12 3.5V1.8M8.5 1.8h7"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/><path d="m8.5 20.5 1.6-4M15.5 20.5l-1.6-4M7 20.5h10"/>'
};
function ico(k, cls){
  var d = I[k]; if(!d){ return ""; }
  return '<svg viewBox="0 0 24 24" aria-hidden="true"' + (cls ? ' class="'+cls+'"' : '') + '>' + d + '</svg>';
}
function $(id){ return document.getElementById(id); }
function esc(v){
  return String(v == null ? "" : v).split("&").join("&amp;").split("<").join("&lt;")
         .split(">").join("&gt;").split('"').join("&quot;");
}
function txt(v){ return String(v == null ? "" : v).split("&amp;").join("&").split("&#039;").join("'"); }

/* ------------------------------- state ------------------------------- */
var DATA = null;      /* {source, generated, updated, centres:{CODE:{...}}} */
var origin = "built-in";
var current = null;
var view = "overview";
var dirty = {};       /* codes changed in this browser */
var fresh = {};       /* codes the website has that we have not written */
var term = "";

function centres(){ return DATA.centres; }
function centre(code){ return DATA.centres[code]; }
function content(code){ return base(code); }
function filled(code){
  var k = base(code);
  if(k.places.length){ return true; }
  if(k.journeys.length){ return true; }
  return false;
}

/* ------------------------------ storage ------------------------------ */
function stash(){
  try{
    window.localStorage.setItem(KEY, JSON.stringify({at:Date.now(), dirty:dirty, data:DATA}));
  }catch(e){}
}
function restore(){
  try{
    var raw = window.localStorage.getItem(KEY);
    if(!raw){ return null; }
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function forget(){
  try{ window.localStorage.removeItem(KEY); }catch(e){}
}

/* -------------------------------- boot ------------------------------- */
function seedFromReport(){
  var out = {source: REPORT.source, generated: REPORT.generated, updated: REPORT.generated, centres: {}};
  var i;
  for(i = 0; i < REPORT.centres.length; i++){
    var r = REPORT.centres[i];
    out.centres[r.code] = {
      code: r.code, label: r.label, region: r.region, city: r.city, name: r.name,
      report: {mnc: r.mnc, local: r.local, origin: r.origin, persona: r.persona, industries: r.industries},
      content: {}
    };
    if(SEED[r.code]){ out.centres[r.code].content.en = SEED[r.code]; }
  }
  return out;
}
function adopt(json){
  /* accept either our own file shape or a bare {CODE:{...}} map */
  if(json.centres){ return json; }
  var base = seedFromReport(), code;
  for(code in json){ if(base.centres[code]){ base.centres[code].content.en = json[code]; } }
  return base;
}

function setState(){
  var el = $("state"), n = 0, code;
  for(code in centres()){ if(filled(code)){ n++; } }
  var total = Object.keys(centres()).length;
  var d = Object.keys(dirty).length;
  el.className = "state hide-s" + (d ? " draft" : (origin === "live" ? " live" : ""));
  var label;
  if(d){ label = d + (d === 1 ? " centre" : " centres") + " changed, not downloaded"; }
  else if(origin === "live"){ label = "Committed file · " + n + " of " + total + " written"; }
  else { label = "Built-in copy · " + n + " of " + total + " written"; }
  el.innerHTML = ico(d ? "warn" : (origin === "live" ? "ok" : "empty")) + "<span>" + esc(label) + "</span>";
  /* the download is always available — the Excel is the working copy */
  var c = $("cnt");
  if(d){ c.hidden = false; c.textContent = d; } else { c.hidden = true; }
}

function boot(){
  DATA = seedFromReport();
  drawTree(); setState();

  var saved = restore();
  function afterLive(){
    if(saved){
      if(saved.data){ if(saved.data.centres){
        DATA = saved.data; dirty = saved.dirty || {}; origin = origin;
        toast("Picked up where you left off");
      }}
    }
    drawTree(); setState();
    if(view === "overview"){ showOverview(); } else { select(current || Object.keys(centres())[0]); }
    roster();
  }
  /* opened straight off disk? there is no live file to read */
  if(!window.fetch || window.location.protocol === "file:"){ afterLive(); return; }
  window.fetch(LIVE, {cache:"no-store"})
    .then(function(r){ if(!r.ok){ throw 0; } return r.json(); })
    .then(function(j){ DATA = adopt(j); origin = "live"; })
    .catch(function(){})
    .then(afterLive);
}

/* --------------------- the roster comes from the site -----------------
   Data only ever flows out of this tool. The one thing it reads back is the
   LIST of centres, because the website is where a new centre appears first. */
function roster(){
  if(!ROSTER){ return; }
  if(!window.fetch){ return; }
  window.fetch(ROSTER, {cache:"no-store"})
    .then(function(r){ if(!r.ok){ throw 0; } return r.json(); })
    .then(function(j){
      var list = j.centres || j.locations || j;
      if(Object.prototype.toString.call(list) !== "[object Array]"){ return; }
      var added = 0, i;
      for(i = 0; i < list.length; i++){
        var it = list[i];
        var code = asText(pick(it, ["code","centreCode","centre_code","slug","id"])).toUpperCase();
        if(!code){ continue; }
        if(centres()[code]){ continue; }
        var nm = asText(pick(it, ["name","building","title"])) || code;
        centres()[code] = {
          code: code, name: nm,
          label: asText(pick(it, ["label","display","fullName"])) || nm,
          region: asText(pick(it, ["region","country","market"])) || "New",
          city: asText(pick(it, ["city","town"])) || "",
          report: {}, content: {}
        };
        fresh[code] = true; added++;
      }
      if(added){
        stash(); drawTree(); setState();
        if(view === "overview"){ showOverview(); }
        toast(added + (added === 1 ? " new centre" : " new centres") + " on the website — nothing written yet");
      }
    })
    .catch(function(){});
}

/* ------------------------------- sidebar ----------------------------- */
function drawTree(){
  var box = $("tree"), order = [], code, groups = {}, reg = [];
  for(code in centres()){ order.push(code); }
  order.sort(function(a, b){
    var A = centre(a), B = centre(b);
    if(A.region === B.region){ return String(A.label).localeCompare(String(B.label)); }
    return String(A.region).localeCompare(String(B.region));
  });
  var q = term.trim().toLowerCase(), shown = 0, h = "";
  for(var i = 0; i < order.length; i++){
    code = order[i];
    var c = centre(code);
    if(q){
      var hay = (c.label + " " + c.code + " " + c.city + " " + c.region).toLowerCase();
      if(hay.indexOf(q) < 0){ continue; }
    }
    if(!groups[c.region]){ groups[c.region] = []; reg.push(c.region); }
    groups[c.region].push(code);
    shown++;
  }
  if(!shown){
    box.innerHTML = '<p class="none">Nothing matches &ldquo;' + esc(term) + '&rdquo;.</p>';
    return;
  }
  for(var g = 0; g < reg.length; g++){
    h += "<h4>" + esc(reg[g]) + "</h4>";
    var list = groups[reg[g]];
    for(var k = 0; k < list.length; k++){
      code = list[k];
      var cc = centre(code);
      var n = filled(code) ? content(code).places.length : 0;
      var on = (view === "centre" && code === current);
      h += '<button type="button" data-code="' + esc(code) + '"' +
           (on ? ' class="on" aria-current="true"' : '') + '>' +
           '<span class="dot' + (filled(code) ? " has" : "") + '"></span>' +
           '<span class="nm">' + esc(shortLabel(cc)) + '</span>' +
           (n ? '<span class="n">' + n + '</span>'
              : (fresh[code] ? '<span class="n" style="color:var(--o)">new</span>' : '')) +
           '</button>';
    }
  }
  box.innerHTML = h;
}
function shortLabel(c){
  var l = String(c.label || c.name || c.code);
  var cut = l.indexOf("—");
  if(cut > 0){ return l.slice(cut + 1).trim(); }
  return l;
}

/* -------------------------------- detail ----------------------------- */
function select(code){
  if(!centre(code)){ return; }
  current = code; view = "centre";
  $("ov").classList.remove("on");
  drawTree(); draw();
  $("main").scrollTop = 0;
  closeSide();
}
function showOverview(){
  view = "overview";
  $("ov").classList.add("on");
  drawTree(); drawOverview();
  $("main").scrollTop = 0;
  closeSide();
}
function draw(){ if(view === "overview"){ drawOverview(); } else { drawCentre(); } }

function drawCentre(){
  var c = centre(current), k = resolve(current, lang), en = base(current);
  var places = k.places || [], jrs = k.journeys || [];
  var geo = 0, i;
  for(i = 0; i < places.length; i++){ if(places[i].lat !== "" && places[i].lat != null){ geo++; } }

  var h = "";
  h += '<div class="hd"><div>' +
       '<p class="kick">' + esc(c.region) + (c.city && c.city !== c.region ? " · " + esc(c.city) : "") + '</p>' +
       '<h1>' + esc(c.name || shortLabel(c)) + '</h1>' +
       '<span class="code">' + esc(c.code) + '</span></div><div class="sp"></div></div>';

  h += '<div class="tally">' +
       tally("pin",   places.length, "place", "places") +
       tally("route", jrs.length,    "route", "routes") +
       (places.length
         ? '<span class="pill' + (geo === places.length ? "" : " empty") + '">' + ico("ok") +
           '<b>' + geo + '</b> of <b>' + places.length + '</b> with coordinates</span>'
         : "") +
       '</div>';

  /* languages */
  var sm = langSummary(current), li;
  h += '<div class="langs" role="tablist" aria-label="Language">';
  for(li = 0; li < sm.length; li++){
    var L = sm[li];
    var ring = L.total ? (L.pc >= 100 ? "full" : (L.pc > 0 ? "part" : "")) : "";

/* ------------------------------- import ------------------------------ */
function pick(o, keys){
  if(!o){ return ""; }
  for(var i = 0; i < keys.length; i++){
    if(Object.prototype.hasOwnProperty.call(o, keys[i])){
      var v = o[keys[i]];
      if(v !== null && v !== undefined && v !== ""){ return v; }
    }
  }
  return "";
}
function asText(v){
  if(v === null || v === undefined){ return ""; }
  if(typeof v === "object"){ return ""; }
  return String(v).trim();
}
function asNum(v){
  if(v === null || v === undefined || v === ""){ return ""; }
  var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
  return isNaN(n) ? "" : n;
}
function guessCat(v){
  var t = asText(v).toLowerCase();
  if(!t){ return "land"; }
  if(/eat|food|restaur|dining|cafe|coffee|bar\b/.test(t)){ return "eat"; }
  if(/shop|retail|mall|store|market/.test(t)){ return "shop"; }
  if(/hotel|stay|accom|serviced apart/.test(t)){ return "stay"; }
  if(/bank|well|gym|fitness|health|park|clinic|life/.test(t)){ return "life"; }
  return "land";
}
function guessMode(v){
  var t = asText(v).toLowerCase();
  if(/air|plane|flight/.test(t)){ return "cx-plane"; }
  if(/car|taxi|drive|uber|grab/.test(t)){ return "cx-car"; }
  if(/ferry|boat|pier/.test(t)){ return "cx-ferry"; }
  if(/bus|coach/.test(t)){ return "cx-bus"; }
  if(/walk|foot/.test(t)){ return "cx-walk"; }
  return "cx-train";
}
function readPlace(o){
  var name = asText(pick(o, ["n","name","title","place","placeName"]));
  if(!name){ return null; }
  return {
    c: guessCat(pick(o, ["c","cat","category","type","group"])),
    n: name,
    d: asText(pick(o, ["d","desc","description","detail","details","summary","note"])),
    w: asText(pick(o, ["w","walk","walkTime","walkingTime","time","minutes","distance"])),
    q: asText(pick(o, ["q","query","mapSearch","mapQuery","address","search","location"])) || name,
    tag: asText(pick(o, ["tag","badge","label","flag"])),
    photo: asText(pick(o, ["photo","photoUrl","image","imageUrl","img","picture"])),
    lat: asNum(pick(o, ["lat","latitude"])),
    lng: asNum(pick(o, ["lng","lon","long","longitude"]))
  };
}
function readJourney(o){
  var title = asText(pick(o, ["t","title","name","from","origin","route","routeTitle"]));
  if(!title){ return null; }
  var raw = pick(o, ["steps","legs","stages","directions"]), steps = [], i;
  if(Object.prototype.toString.call(raw) === "[object Array]"){
    for(i = 0; i < raw.length; i++){
      var st = raw[i];
      if(typeof st === "string"){ steps.push({t: st, d: "", e: ""}); continue; }
      var t2 = asText(pick(st, ["t","title","name","step"]));
      if(!t2){ continue; }
      steps.push({
        t: t2,
        d: asText(pick(st, ["d","detail","description","note"])),
        e: asText(pick(st, ["e","time","duration","minutes","legTime"]))
      });
    }
  }
  var best = pick(o, ["best","fastest","primary","recommended"]);
  return {
    i: guessMode(pick(o, ["i","mode","icon","transport","by"]) || title),
    t: title,
    s: asText(pick(o, ["s","subtitle","sub","line","via"])),
    total: asText(pick(o, ["total","totalTime","doorToDoor","duration"])),
    best: (best === true || /^(y|yes|true|1)$/i.test(String(best))),
    steps: steps
  };
}
/* one payload -> {code: {places, journeys}} */
function normalise(input){
  var out = {}, notes = [], i;
  function bucket(code){
    if(!out[code]){ out[code] = {places: [], journeys: []}; }
    return out[code];
  }
  function read(code, obj){
    var b = bucket(code);
    var pl = pick(obj, ["places","neighbourhood","neighborhood","nearby","locations","spots"]);
    var jr = pick(obj, ["journeys","gettingHere","getting_here","routes","travel","directions"]);
    if(Object.prototype.toString.call(pl) === "[object Array]"){
      for(i = 0; i < pl.length; i++){ var p = readPlace(pl[i]); if(p){ b.places.push(p); } }
    }
    if(Object.prototype.toString.call(jr) === "[object Array]"){
      for(i = 0; i < jr.length; i++){ var j = readJourney(jr[i]); if(j){ b.journeys.push(j); } }
    }
  }
  if(Object.prototype.toString.call(input) === "[object Array]"){
    var looksRoute = false;
    if(input.length){ if(pick(input[0], ["steps","legs","stages"])){ looksRoute = true; } }
    read(current, looksRoute ? {journeys: input} : {places: input});
    return {out: out, notes: notes};
  }
  /* our own full file — take it whole, translations and all */
  if(input.centres){
    var code, took = 0;
    for(code in input.centres){
      if(!centre(code)){ notes.push(code + " is not a Compass centre code"); continue; }
      var cc = input.centres[code].content;
      if(!cc){ continue; }
      if(cc.en){ if((cc.en.places || []).length || (cc.en.journeys || []).length){
        read(code, cc.en);
      }}
      var lg;
      for(lg = 1; lg < LANGS.length; lg++){
        var id = LANGS[lg].id;
        if(cc[id]){ centre(code).content[id] = cc[id]; dirty[code] = true; took++; }
      }
    }
    if(took){ notes.push("Kept the translations that came with the file."); }
    return {out: out, notes: notes};
  }
  var direct = pick(input, ["code","centre","center","centreCode","id"]);
  if(direct){ read(asText(direct).toUpperCase(), input); return {out: out, notes: notes}; }
  if(pick(input, ["places","journeys","neighbourhood","routes","gettingHere"])){
    read(current, input); return {out: out, notes: notes};
  }
  /* a {CODE:{...}} map */
  var any = false, key;
  for(key in input){
    if(typeof input[key] !== "object"){ continue; }
    read(key.toUpperCase(), input[key]); any = true;
  }
  if(!any){ notes.push("Nothing in that file looked like centre content."); }
  return {out: out, notes: notes};
}

function applyImport(payload, filename){
  var r = normalise(payload), rows = [], code, changed = 0;
  for(code in r.out){
    var got = r.out[code];
    if(!centre(code)){
      rows.push({k: "bad", t: code, m: "Not a Compass centre code — skipped"});
      continue;
    }
    if(!got.places.length && !got.journeys.length){
      rows.push({k: "warn", t: label(code), m: "Nothing usable in this block — left as it was"});
      continue;
    }
    var was = base(code), had = was.places.length, hadJ = was.journeys.length;
    centre(code).content.en = {places: got.places, journeys: got.journeys};
    dirty[code] = true; changed++;
    rows.push({
      k: "ok", t: label(code),
      m: got.places.length + " places, " + got.journeys.length + " routes" +
         (had || hadJ ? " — replaces " + had + " places, " + hadJ + " routes" : " — first content for this centre")
    });
  }
  for(var i = 0; i < r.notes.length; i++){ rows.push({k: "warn", t: "Note", m: r.notes[i]}); }
  if(!rows.length){ rows.push({k: "bad", t: "Nothing imported", m: "The file had no centre content in it."}); }

  if(changed){
    DATA.updated = new Date().toISOString().slice(0, 10);
    stash(); drawTree(); setState();
    var first = null;
    for(code in r.out){ if(centre(code)){ if(!first){ first = code; } } }
    if(first){ select(first); }
    geocode();
  }
  showResult(rows, filename, changed);
}
function label(code){ return centre(code) ? centre(code).label : code; }

/* fill in whatever coordinates the file did not carry, quietly */
var geoBusy = false;
function geocode(){
  if(geoBusy){ return; }
  var todo = [], code;
  for(code in dirty){
    var ps = base(code).places || [];
    for(var i = 0; i < ps.length; i++){
      if(ps[i].lat === "" || ps[i].lng === ""){ todo.push(ps[i]); }
    }
  }
  if(!todo.length){ return; }
  if(!window.fetch){ return; }
  geoBusy = true;
  var done = 0, miss = 0, total = todo.length;
  function step(){
    if(!todo.length || miss > 4){
      geoBusy = false; stash(); draw();
      if(done){ toast("Filled in coordinates for " + done + " of " + total + " places"); }
      return;
    }
    var pl = todo.shift();
    var u = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
            encodeURIComponent(pl.q || pl.n);
    window.fetch(u, {headers: {"Accept": "application/json"}})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j.length){
          pl.lat = Math.round(parseFloat(j[0].lat) * 1e6) / 1e6;
          pl.lng = Math.round(parseFloat(j[0].lon) * 1e6) / 1e6;
          done++; miss = 0;
        } else { miss++; }
        window.setTimeout(step, 1100);
      })
      .catch(function(){ miss++; window.setTimeout(step, 1100); });
  }
  toast("Looking up coordinates for " + total + " places…");
  step();
}

/* -------------------------------- files ------------------------------ */
function readFiles(list){
  var files = [], i;
  for(i = 0; i < list.length; i++){ files.push(list[i]); }
  if(!files.length){ return; }
  /* a workbook takes a different road in */
  var rest = [];
  for(i = 0; i < files.length; i++){
    if(/\.xlsx?$/i.test(files[i].name)){ xlsxIn(files[i]); } else { rest.push(files[i]); }
  }
  files = rest;
  if(!files.length){ return; }
  var next = function(){
    if(!files.length){ return; }
    var f = files.shift();
    var fr = new FileReader();
    fr.onload = function(){
      var obj;
      try{ obj = JSON.parse(String(fr.result)); }
      catch(e){
        showResult([{k: "bad", t: f.name, m: "That is not valid JSON. " + String(e.message || e)}], f.name, 0);
        return;
      }
      applyImport(obj, f.name);
    };
    fr.readAsText(f);
    if(files.length){ window.setTimeout(next, 300); }
  };
  next();
}
/* ---------------------- save straight to GitHub ---------------------- */
function savedKey(){
  try{ return window.sessionStorage.getItem(SAVE_KEY) ||
              window.localStorage.getItem(SAVE_KEY) || ""; }catch(e){ return ""; }
}
function keepKey(k, forever){
  try{
    if(forever){ window.localStorage.setItem(SAVE_KEY, k); }
    else { window.sessionStorage.setItem(SAVE_KEY, k); }
  }catch(e){}
}
function changedNames(){
  var out = [], code;
  for(code in dirty){ out.push(label(code)); }
  return out;
}
function commitMessage(){
  var names = changedNames();
  if(!names.length){ return "Centre content — no change"; }
  if(names.length === 1){ return names[0] + " — content update"; }
  if(names.length < 4){ return names.join(", ") + " — content update"; }
  return names.length + " centres — content update";
}
function saving(body, foot){
  /* keep the one sheet open and swap its contents — closing and reopening it
     from an async callback races with the click that started the save */
  openSheet("Save to GitHub", body, foot || "");
}
function pushToGitHub(){
  var key = savedKey();
  if(!key){ askKey(); return; }
  DATA.updated = stamp();
  saving('<p style="color:var(--tx2);display:flex;align-items:center;gap:10px">' +
         '<span class="cx-spin"></span>Committing ' + esc(commitMessage()) + '…</p>', "");
  window.fetch(SAVE_URL, {
    method: "POST",
    credentials: "include",
    headers: {"Content-Type": "application/json", "X-Save-Key": key},
    body: JSON.stringify({data: DATA, message: commitMessage()})
  })
  .then(function(r){
    return r.json().then(function(j){ return {ok: r.ok, j: j}; },
                         function(){ return {ok: false, j: {error: "The save service answered with something that was not JSON"}}; });
  })
  .then(function(res){
    if(!res.ok || !res.j.ok){
      var msg = (res.j && res.j.error) ? res.j.error : "GitHub would not take it";
      if(/save key/i.test(msg)){ forgetKey(); askKey(msg); return; }
      saving('<div class="note" style="background:var(--bad-wash);border-color:#F5C6C2">' +
             ico("bad") + '<span>' + esc(msg) + '</span></div>' +
             '<p style="color:var(--tx2);margin-top:14px">Nothing was lost — your changes are ' +
             'still here. Download the JSON and commit it by hand if this keeps happening.</p>',
             '<button class="btn btn--line" data-close>Close</button>' +
             '<button class="btn btn--o" data-act="push">Try again</button>');
      return;
    }
    dirty = {};
    stash(); drawTree(); setState();
    saving('<div class="note" style="background:var(--ok-wash);border-color:#BFE3CE">' +
           ico("ok") + '<span>Committed to GitHub' +
           (res.j.commit ? ' as <b>' + esc(res.j.commit) + '</b>' : "") +
           '. The website picks it up on its next refresh.</span></div>',
           (res.j.url ? '<a class="btn btn--line" href="' + esc(res.j.url) +
                        '" target="_blank" rel="noopener">See the commit</a>' : "") +
           '<button class="btn btn--o" data-close>Done</button>');
  })
  .catch(function(){
    saving('<div class="note" style="background:var(--bad-wash);border-color:#F5C6C2">' +
           ico("bad") + '<span>Could not reach the save service. Check the connection, or ' +
           'download the JSON and commit it by hand.</span></div>',
           '<button class="btn btn--line" data-close>Close</button>' +
           '<button class="btn btn--o" data-act="push">Try again</button>');
  });
}
function forgetKey(){
  try{ window.sessionStorage.removeItem(SAVE_KEY); window.localStorage.removeItem(SAVE_KEY); }catch(e){}
}
function askKey(err){
  saving(
    (err ? '<div class="note" style="margin-bottom:16px">' + ico("warn") + '<span>' + esc(err) + '</span></div>' : "") +
    '<p style="color:var(--tx2);margin-bottom:16px">Paste the save key your admin gave you. ' +
    'It is not a GitHub password — it only lets this tool commit the content file.</p>' +
    '<input type="password" id="keyin" placeholder="Save key" autocomplete="off" ' +
    'style="width:100%;height:44px;padding:0 14px;border:1px solid var(--ln);border-radius:7px;' +
    'background:var(--bg);font-size:.9rem">' +
    '<label style="display:flex;align-items:center;gap:9px;margin-top:14px;font-size:.84rem;color:var(--tx2)">' +
    '<input type="checkbox" id="keykeep" style="width:17px;height:17px">Remember on this computer</label>',
    '<button class="btn btn--line" data-close>Cancel</button>' +
    '<button class="btn btn--o" data-act="keygo">Save</button>');
  window.setTimeout(function(){ var el = $("keyin"); if(el){ el.focus(); } }, 60);
}

function askDownload(){
  openSheet(SAVE_URL ? "Save or download" : "Download",
    '<div class="steps">' +
    (SAVE_URL ? '<div class="step"><div><h4>Save to GitHub</h4><p>Commits the content file ' +
      'straight to the repo. Nothing to download, nothing to upload.</p></div></div>' : "") +
    '<div class="step"><div><h4>Excel — the one you edit</h4><p>Every centre, every language, ' +
    'as it stands. Correct a walk time, rewrite a description, add rows for a centre with ' +
    'nothing yet, translate a column. Then upload it back here.</p></div></div>' +
    '<div class="step"><div><h4>JSON — for the developer</h4><p>The file that goes to GitHub ' +
    'and feeds the API. Commit it as <code>compass-centres.json</code>.</p></div></div>' +

function csvCell(v){

function csvRows(head, rows){

  for(i = 0; i < rows.length; i++){
    line = [];
    for(j = 0; j < rows[i].length; j++){ line.push(csvCell(rows[i][j])); }
    out.push(line.join(","));
  }
  return out.join("\n");
}
/* the current content for one centre, in the same columns as the workbook */

               "Badge","Photo URL","Lat","Lng"], pr) + "\n```");

/* ===========================================================================
   Languages. English carries the facts — category, walk time, map search,
   coordinates, badge, mode. Every other language carries only the words, keyed
   by the English name, so a translated file can never disagree with the map.
   ======================================================================== */
var LANGS = [
  {id:"en", label:"English",             short:"EN"},
  {id:"tc", label:"Traditional Chinese", short:"TC"},
  {id:"sc", label:"Simplified Chinese",  short:"SC"},
  {id:"jp", label:"Japanese",            short:"JP"},
  {id:"vi", label:"Vietnamese",          short:"VI"}
];
function langLabel(id){
  for(var i = 0; i < LANGS.length; i++){ if(LANGS[i].id === id){ return LANGS[i].label; } }
  return String(id).toUpperCase();
}
function langId(v){
  var t = asText(v).toLowerCase().replace(/[^a-z]/g, "");
  if(!t){ return "en"; }
  if(t.indexOf("trad") === 0 || t === "tc" || t === "zhhant" || t === "hant"){ return "tc"; }
  if(t.indexOf("simp") === 0 || t === "sc" || t === "zhhans" || t === "hans" || t === "cn"){ return "sc"; }
  if(t.indexOf("jap") === 0 || t === "jp" || t === "ja"){ return "jp"; }
  if(t.indexOf("viet") === 0 || t === "vi" || t === "vn"){ return "vi"; }
  return "en";
}

function base(code){                      /* the English master */
  var c = centre(code);
  if(!c.content){ c.content = {}; }
  if(!c.content.en){ c.content.en = {places: [], journeys: []}; }
  if(!c.content.en.places){ c.content.en.places = []; }
  if(!c.content.en.journeys){ c.content.en.journeys = []; }
  return c.content.en;
}
function words(code, lang){               /* a translation layer */
  var c = centre(code);
  if(!c.content){ c.content = {}; }
  if(lang === "en"){ return base(code); }
  if(!c.content[lang]){ c.content[lang] = {places: {}, journeys: {}}; }
  var w = c.content[lang];
  if(!w.places){ w.places = {}; }
  if(!w.journeys){ w.journeys = {}; }
  return w;
}
/* what to show: English facts + this language's words */
function resolve(code, lang){
  var en = base(code);
  if(lang === "en"){ return {places: en.places, journeys: en.journeys}; }
  var w = words(code, lang), i, s;
  var places = [], journeys = [];
  for(i = 0; i < en.places.length; i++){
    var p = en.places[i], t = w.places[p.n] || {};
    places.push({
      c: p.c, w: p.w, q: p.q, lat: p.lat, lng: p.lng, photo: p.photo,
      n: t.n || p.n, d: t.d || p.d, tag: t.tag || p.tag,
      _en: p.n, _done: !!(t.n || t.d)
    });
  }
  for(i = 0; i < en.journeys.length; i++){
    var j = en.journeys[i], tj = w.journeys[j.t] || {}, steps = [];
    for(s = 0; s < (j.steps || []).length; s++){
      var st = j.steps[s], ts = (tj.steps || {})[st.t] || {};
      steps.push({t: ts.t || st.t, d: ts.d || st.d, e: st.e, _en: st.t});
    }
    journeys.push({
      i: j.i, best: j.best,
      t: tj.t || j.t, s: tj.s || j.s, total: tj.total || j.total,
      steps: steps, _en: j.t, _done: !!(tj.t || tj.total)
    });
  }
  return {places: places, journeys: journeys};
}
/* how much of a language is written for one centre */
function langDone(code, lang){
  var en = base(code);
  var total = en.places.length + en.journeys.length;
  if(!total){ return {done: 0, total: 0}; }
  if(lang === "en"){ return {done: total, total: total}; }
  var w = words(code, lang), done = 0, i;
  for(i = 0; i < en.places.length; i++){
    var t = w.places[en.places[i].n];
    if(t){ if(t.n || t.d){ done++; } }
  }
  for(i = 0; i < en.journeys.length; i++){
    var tj = w.journeys[en.journeys[i].t];
    if(tj){ if(tj.t || tj.total){ done++; } }
  }
  return {done: done, total: total};
}
function langSummary(code){
  var out = [], i;
  for(i = 0; i < LANGS.length; i++){
    var d = langDone(code, LANGS[i].id);
    out.push({id: LANGS[i].id, short: LANGS[i].short, label: LANGS[i].label,
              done: d.done, total: d.total,
              pc: d.total ? Math.round(d.done / d.total * 100) : 0});
  }
  return out;
}


/* ===========================================================================
   Charts. Inline SVG, no library. One hue (brand orange) plus neutrals —
   the "emphasis" form, so there is no categorical palette to get wrong.
   Orange sits at 2.86:1 on white, under the 3:1 mark, so every chart that
   uses it carries a visible value or label rather than relying on the fill.
   ======================================================================== */
function svgOpen(w, h){
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" preserveAspectRatio="xMinYMin meet">';
}
/* horizontal bars, ranked, value at the tip */
function hbars(rows, opts){
  opts = opts || {};
  var W = 560, pad = opts.labelW || 200, gap = 10, bh = Math.min(22, opts.bh || 18);
  var rowH = bh + gap, H = Math.max(1, rows.length) * rowH;
  var max = 0, i;
  for(i = 0; i < rows.length; i++){ if(rows[i].v > max){ max = rows[i].v; } }
  if(!max){ max = 1; }
  var plot = W - pad - 56;
  var h = svgOpen(W, H);
  for(i = 0; i < rows.length; i++){
    var r = rows[i], y = i * rowH;
    var share = r.of ? (r.of ? r.v / r.of : 0) : (r.v / max);   /* own total, or the row max */
    var w = Math.max(r.v ? 3 : 0, share * plot);
    if(r.of){
      h += '<rect class="mk-2" x="' + pad + '" y="' + y + '" width="' + plot +
           '" height="' + bh + '" rx="4" ry="4"/>';
    }
    h += '<g class="q">';
    h += '<text class="lab" x="' + (pad - 10) + '" y="' + (y + bh / 2 + 4) + '" text-anchor="end">' +
         esc(r.n) + '</text>';
    if(w){
      h += '<rect class="' + (r.dim ? "mk-2" : "mk") + '" x="' + pad + '" y="' + y + '" width="' + w +
           '" height="' + bh + '" rx="4" ry="4"/>';
    }
    h += '<text class="val" x="' + (pad + (r.of ? plot : w) + 8) + '" y="' + (y + bh / 2 + 4) + '">' +
         esc(r.t || r.v) + '</text>';
    h += '<title>' + esc(r.n) + ' — ' + esc(r.t || r.v) + '</title></g>';
  }
  return h + "</svg>";
}
/* columns for a distribution */
function columns(rows, opts){
  opts = opts || {};
  var W = 560, H = 190, base = H - 30, top = 22;
  var n = Math.max(1, rows.length), slot = W / n, bw = Math.min(30, slot - 16);
  var max = 0, i;
  for(i = 0; i < rows.length; i++){ if(rows[i].v > max){ max = rows[i].v; } }
  if(!max){ max = 1; }
  var h = svgOpen(W, H);
  h += '<line class="grid" x1="0" y1="' + base + '" x2="' + W + '" y2="' + base + '"/>';
  for(i = 0; i < rows.length; i++){
    var r = rows[i];
    var bh = Math.max(r.v ? 3 : 0, (r.v / max) * (base - top));
    var x = i * slot + (slot - bw) / 2, y = base - bh;
    h += '<g class="q">';
    if(bh){ h += '<rect class="mk" x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="4" ry="4"/>'; }
    h += '<text class="val" x="' + (x + bw / 2) + '" y="' + (y - 7) + '" text-anchor="middle">' + r.v + '</text>';
    h += '<text class="ax" x="' + (x + bw / 2) + '" y="' + (base + 16) + '" text-anchor="middle">' +
         esc(r.n) + '</text>';
    h += '<title>' + esc(r.n) + ' — ' + r.v + (opts.unit ? " " + opts.unit : "") + '</title></g>';
  }
  return h + "</svg>";
}
/* two-part split, labelled on both sides */
function splitBar(a, b, aLabel, bLabel){
  var total = a + b; if(!total){ total = 1; }
  var W = 560, H = 34, gapPx = 2;
  var aw = (a / total) * (W - gapPx), bw = W - gapPx - aw;
  var h = svgOpen(W, H);
  h += '<rect class="mk-2" x="0" y="0" width="' + aw + '" height="' + H + '" rx="5" ry="5"/>';
  h += '<rect class="mk" x="' + (aw + gapPx) + '" y="0" width="' + Math.max(2, bw) +
       '" height="' + H + '" rx="5" ry="5"/>';
  if(aw > 62){ h += '<text class="val" x="' + (aw / 2) + '" y="' + (H / 2 + 4) + '" text-anchor="middle">' + fmt(a) + '%</text>'; }
  if(bw > 62){ h += '<text class="val" x="' + (aw + gapPx + bw / 2) + '" y="' + (H / 2 + 4) +
                    '" text-anchor="middle" fill="#fff">' + fmt(b) + '%</text>'; }
  h += '<title>' + esc(aLabel) + ' ' + fmt(a) + '% · ' + esc(bLabel) + ' ' + fmt(b) + '%</title>';
  return h + "</svg>";
}
function key(items){
  var h = '<p class="wfkey">', i;
  for(i = 0; i < items.length; i++){
    h += '<span><i' + (items[i].on ? ' class="has"' : "") + '></i>' + esc(items[i].n) + '</span>';
  }
  return h + "</p>";
}
function meters(rows){
  var h = '<div class="meter">', i;
  for(i = 0; i < rows.length; i++){
    var r = rows[i], pc = r.max ? Math.min(100, (r.v / r.max) * 100) : 0;
    h += '<div class="m"><span>' + esc(r.n) + '</span><b>' + esc(r.t) + '</b>' +
         '<span class="t"><i' + (r.ink ? ' class="ink"' : "") + ' style="width:' + pc + '%"></i></span></div>';
  }
  return h + "</div>";
}
function minutes(w){
  var m = String(w == null ? "" : w).match(/\d+/);
  if(!m){ return 0; }
  return parseInt(m[0], 10);
}
var BUCKETS = [
  {n:"0–2", lo:0,  hi:2},  {n:"3–5", lo:3,  hi:5},
  {n:"6–10", lo:6, hi:10}, {n:"11–15", lo:11, hi:15}, {n:"16+", lo:16, hi:9999}
];
function walkBuckets(places){
  var out = [], i, j;
  for(i = 0; i < BUCKETS.length; i++){ out.push({n: BUCKETS[i].n, v: 0}); }
  for(i = 0; i < places.length; i++){
    var m = minutes(places[i].w);
    for(j = 0; j < BUCKETS.length; j++){
      if(m >= BUCKETS[j].lo && m <= BUCKETS[j].hi){ out[j].v++; break; }
    }
  }
  return out;
}
function catCounts(places){
  var out = [], i, j;
  for(i = 0; i < CATS.length; i++){ out.push({n: CATS[i].label, v: 0, id: CATS[i].id}); }
  for(i = 0; i < places.length; i++){
    for(j = 0; j < out.length; j++){ if(out[j].id === places[i].c){ out[j].v++; break; } }
  }
  return out;
}

/* ------------------------------ overview ----------------------------- */
function drawOverview(){
  var codes = Object.keys(centres()), i, j;
  var written = 0, places = 0, routes = 0, coords = 0, allPlaces = [];
  var byRegion = {}, regions = [];
  for(i = 0; i < codes.length; i++){
    var code = codes[i], c = centre(code), k = content(code);
    var np = (k.places || []).length, nj = (k.journeys || []).length;
    if(np || nj){ written++; }
    places += np; routes += nj;
    for(j = 0; j < np; j++){
      allPlaces.push(k.places[j]);
      if(k.places[j].lat !== "" && k.places[j].lat != null){ coords++; }
    }
    if(!byRegion[c.region]){ byRegion[c.region] = []; regions.push(c.region); }
    byRegion[c.region].push({code: code, c: c, n: np, has: (np || nj)});
  }
  regions.sort();

  var h = "";
  h += '<div class="hd"><div><p class="kick">The network</p>' +
       '<h1>All ' + codes.length + ' centres</h1>' +
       '<span class="code">' + esc(DATA.updated || DATA.generated || "") + '</span></div></div>';

  h += '<div class="kpis" style="margin-top:var(--s5)">' +
       kpi("Centres written", written, "of " + codes.length) +
       kpi("Places", places, places ? "across the network" : "none yet") +
       kpi("Routes", routes, routes ? "ways in" : "none yet") +
       kpi("With coordinates", coords, places ? Math.round(coords / places * 100) + "% of places" : "—") +
       "</div>";

  /* coverage grid */
  h += '<div class="figs"><div class="fig wide"><h3>Coverage</h3>' +
       '<p class="cap">One square per centre. Filled means the neighbourhood and routes have been written.</p>' +
       '<div class="wf">';
  for(i = 0; i < regions.length; i++){
    var list = byRegion[regions[i]];
    list.sort(function(a, b){ return String(a.c.label).localeCompare(String(b.c.label)); });
    h += '<div class="wfr"><span>' + esc(regions[i]) + '</span><div class="wfc">';
    for(j = 0; j < list.length; j++){
      h += '<i' + (list[j].has ? ' class="has"' : "") + ' title="' + esc(list[j].c.label) +
           (list[j].n ? " — " + list[j].n + " places" : " — nothing written") + '"></i>';
    }
    h += "</div></div>";
  }
  h += "</div>" + key([{n:"Written", on:true},{n:"Still empty"}]) + "</div>";

  /* written vs empty, by region */
  var rows = [];
  for(i = 0; i < regions.length; i++){
    var l = byRegion[regions[i]], done = 0;
    for(j = 0; j < l.length; j++){ if(l[j].has){ done++; } }
    rows.push({n: regions[i], v: done, of: l.length, t: done + " of " + l.length, dim: !done});
  }
  h += '<div class="fig"><h3>Written, by region</h3>' +
       '<p class="cap">How far through the network the content is.</p>' +
       hbars(rows, {labelW: 130}) + "</div>";

  /* places by category */
  var cc = catCounts(allPlaces), crows = [];
  cc.sort(function(a, b){ return b.v - a.v; });
  for(i = 0; i < cc.length; i++){ crows.push({n: cc[i].n, v: cc[i].v, dim: !cc[i].v}); }
  h += '<div class="fig"><h3>Places by category</h3>' +
       '<p class="cap">A centre reads badly when one category is empty.</p>' +
       hbars(crows, {labelW: 175}) + "</div>";

  /* walk-time distribution */
  h += '<div class="fig"><h3>How far things are</h3>' +
       '<p class="cap">Every place on the network, by walking minutes.</p>' +
       columns(walkBuckets(allPlaces), {unit: "places"}) + "</div>";

  /* network industry mix */
  var mix = {}, names = [];
  for(i = 0; i < codes.length; i++){
    var R = centre(codes[i]).report;
    if(!R || !R.industries){ continue; }
    for(j = 0; j < R.industries.length; j++){
      var nm = R.industries[j].name;
      if(!mix[nm]){ mix[nm] = 0; names.push(nm); }
      mix[nm] += R.industries[j].pct;
    }
  }
  var irows = [];
  for(i = 0; i < names.length; i++){
    irows.push({n: names[i], v: mix[names[i]] / codes.length});
  }
  irows.sort(function(a, b){ return b.v - a.v; });
  irows = irows.slice(0, 6);
  for(i = 0; i < irows.length; i++){ irows[i].t = fmt(irows[i].v) + "%"; }
  /* language coverage across the whole network */
  var lrows = [], done2, total2;
  for(i = 0; i < LANGS.length; i++){
    done2 = 0; total2 = 0;
    for(j = 0; j < codes.length; j++){
      var d = langDone(codes[j], LANGS[i].id);
      done2 += d.done; total2 += d.total;
    }
    lrows.push({n: LANGS[i].label, v: done2, of: total2 || 1,
                t: total2 ? (Math.round(done2 / total2 * 100) + "%") : "—",
                dim: !done2});
  }
  h += '<div class="fig"><h3>Languages</h3>' +
       '<p class="cap">Every place and route needs all five. Against the ' +
       (places + routes) + ' English entries written so far.</p>' +
       hbars(lrows, {labelW: 165}) + "</div>";

  h += '<div class="fig wide"><h3>Who is in the network</h3>' +
       '<p class="cap">Average share of resident companies across all ' + codes.length +
       ' centres, from the report.</p>' + hbars(irows, {labelW: 260}) + "</div>";

  h += "</div>";
  $("view").innerHTML = h;
}

function xlsxIn(file){
  withXLSX(function(){
    var fr = new FileReader();
    fr.onload = function(){
      var wb;
      try{ wb = XLSX.read(new Uint8Array(fr.result), {type: "array"}); }
      catch(e){
        showResult([{k:"bad", t:file.name, m:"Could not read that workbook."}], file.name, 0);
        return;
      }
      var rows = [], touched = {}, unknown = {}, i;
      function sheet(name){
        if(wb.SheetNames.indexOf(name) < 0){ return []; }
        return XLSX.utils.sheet_to_json(wb.Sheets[name], {defval: ""});
      }
      function get(r, keys){ return asText(pick(r, keys)); }

      /* ---- English master ---- */
      var hood = sheet("Neighbourhood"), route = sheet("Getting here");
      var fresh = {};
      function bucket(code){
        if(!fresh[code]){ fresh[code] = {places: [], journeys: []}; }
        return fresh[code];
      }
      for(i = 0; i < hood.length; i++){
        var r = hood[i], code = get(r, ["Centre code","centre code","Code"]).toUpperCase();
        var nm = get(r, ["Name","name"]);
        if(!code || !nm){ continue; }
        if(!centre(code)){ unknown[code] = true; continue; }
        bucket(code).places.push({
          c: catId(get(r, ["Category","category"])),
          n: nm,
          d: get(r, ["Description","description"]),
          w: get(r, ["Walk time","walk time","Walk"]),
          q: get(r, ["Map search","map search","Map query"]) || nm,
          tag: get(r, ["Badge","badge"]),
          photo: get(r, ["Photo URL","photo url","Photo"]),
          lat: asNum(pick(r, ["Lat","lat","Latitude"])),
          lng: asNum(pick(r, ["Lng","lng","Lon","Longitude"]))
        });
      }
      var open = {};
      for(i = 0; i < route.length; i++){
        var rr = route[i], rc = get(rr, ["Centre code","centre code","Code"]).toUpperCase();
        var rt = get(rr, ["Route title","route title","Title"]);
        if(!rc || !rt){ continue; }
        if(!centre(rc)){ unknown[rc] = true; continue; }
        var b = bucket(rc), id = rc + "|" + get(rr, ["Route","route"]) + "|" + rt;
        if(!open[id]){
          open[id] = {
            i: modeId(get(rr, ["Mode","mode"])), t: rt,
            s: get(rr, ["Subtitle","subtitle"]),
            total: get(rr, ["Total time","total time","Total"]),
            best: /^(y|yes|true|1)$/i.test(get(rr, ["Fastest","fastest","Best"])),
            steps: []
          };
          b.journeys.push(open[id]);
        }
        var stT = get(rr, ["Step title","step title"]);
        if(stT){
          open[id].steps.push({t: stT, d: get(rr, ["Step detail","step detail"]),
                               e: get(rr, ["Leg time","leg time","Time"])});
        }
      }
      for(var code2 in fresh){
        var got = fresh[code2];
        if(!got.places.length && !got.journeys.length){ continue; }
        centre(code2).content.en = {places: got.places, journeys: got.journeys};
        dirty[code2] = true; touched[code2] = {p: got.places.length, j: got.journeys.length};
      }

      /* ---- translations ---- */
      var pt = sheet("Place translations"), rt2 = sheet("Route translations"), tCount = {};
      for(i = 0; i < pt.length; i++){
        var t = pt[i], tc = get(t, ["Centre code","centre code","Code"]).toUpperCase();
        var lg = langId(get(t, ["Language","language","Lang"]));
        var eng = get(t, ["English name","english name","English"]);
        var nm2 = get(t, ["Name","name"]), d2 = get(t, ["Description","description"]);
        var bg = get(t, ["Badge","badge"]);
        if(!tc || !eng || lg === "en"){ continue; }
        if(!centre(tc)){ unknown[tc] = true; continue; }
        if(!nm2 && !d2 && !bg){ continue; }
        var w = words(tc, lg);
        w.places[eng] = {n: nm2, d: d2, tag: bg};
        dirty[tc] = true;
        tCount[tc + " " + lg] = (tCount[tc + " " + lg] || 0) + 1;
      }
      for(i = 0; i < rt2.length; i++){
        var q = rt2[i], qc = get(q, ["Centre code","centre code","Code"]).toUpperCase();
        var ql = langId(get(q, ["Language","language","Lang"]));
        var qe = get(q, ["English route","english route","English"]);
        if(!qc || !qe || ql === "en"){ continue; }
        if(!centre(qc)){ unknown[qc] = true; continue; }
        var qw = words(qc, ql);
        if(!qw.journeys[qe]){ qw.journeys[qe] = {steps: {}}; }
        var J = qw.journeys[qe];
        if(!J.steps){ J.steps = {}; }
        var qt = get(q, ["Route title","route title"]);
        if(qt){ J.t = qt; }
        var qs = get(q, ["Subtitle","subtitle"]);
        if(qs){ J.s = qs; }
        var qo = get(q, ["Total time","total time"]);
        if(qo){ J.total = qo; }
        var es = get(q, ["English step","english step"]);
        var stT2 = get(q, ["Step title","step title"]), stD = get(q, ["Step detail","step detail"]);
        if(es){ if(stT2 || stD){ J.steps[es] = {t: stT2, d: stD}; } }
        if(qt || qs || qo || stT2 || stD){
          dirty[qc] = true;
          tCount[qc + " " + ql] = (tCount[qc + " " + ql] || 0) + 1;
        }
      }

      /* ---- the report ---- */
      for(var tc2 in touched){
        rows.push({k:"ok", t: label(tc2),
                   m: touched[tc2].p + " places, " + touched[tc2].j + " routes in English"});
      }
      var langRows = {};
      for(var key2 in tCount){
        var parts = key2.split(" ");
        if(!langRows[parts[0]]){ langRows[parts[0]] = []; }
        langRows[parts[0]].push(langLabel(parts[1]) + " ×" + tCount[key2]);
      }
      for(var lc in langRows){
        rows.push({k:"ok", t: label(lc) + " — translations", m: langRows[lc].join(", ")});
      }
      for(var uc in unknown){
        rows.push({k:"bad", t: uc, m: "Not a Compass centre code — those rows were skipped"});
      }
      var changed = Object.keys(touched).length + Object.keys(langRows).length;
      if(!changed && !rows.length){
        rows.push({k:"warn", t:"Nothing changed",
                   m:"No rows in Neighbourhood, Getting here or the translation sheets."});
      }
      if(changed){
        DATA.updated = stamp();
        stash(); drawTree(); setState(); draw();
        geocode();
      }
      showResult(rows, file.name, changed);
    };
    fr.readAsArrayBuffer(file);
  });
}
function stamp(){ return new Date().toISOString().slice(0, 10); }


boot();
})();

</script>
